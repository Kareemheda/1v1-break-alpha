        const to = bars.map(b => b.map(x => x.style.height));
        bars.forEach((b, i) => b.forEach((x, j) => { if (was[i] && Math.abs(was[i][j] - parseFloat(to[i][j])) > 0.5) x.style.height = was[i][j] + '%'; }));
        void one('#g' + p).offsetHeight;                      // let the page take the old heights in, then move to the new ones
        bars.forEach((b, i) => b.forEach((x, j) => { x.style.height = to[i][j]; }));
      }
      renderTable(v, p);
    });
  }

  // The table, always on screen at the top of the stage: each player's chains above their fighter, and the opponent's hand
  // as face-down cards with a big number. If a strip gets too full its cards overlap; if it is still too full it grows down.
  function tableHtml(v, p) {
    const cs = v.chains[p], me = p === 0;
    const chains = cs.length ? cs.map((c, i) => `<span class="tchain"><span class="num">#${i + 1}</span><span class="tcards">${c.cards.map(n => card(n, { size: 'x' })).join('')}</span>${c.jokers && c.kind !== 'joker' ? `<span class="dim">(${plural(c.jokers, 'Joker')})</span>` : ''}${c.oneAway ? (c.kind === 'joker' ? '<span class="tag wide">one Joker from winning the match</span>' : '<span class="tag">one card from complete</span>') : ''}</span>`).join('') : '<span class="none">none on the table</span>';
    return `<div class="tlist" role="group" aria-label="${me ? 'Your chains' : 'Their chains'}"><span class="lbl">${me ? 'Your chains' : 'Their chains'}</span>${chains}</div>`;
  }
  // the opponent's hand: a fan of face-down cards (at most 9 drawn, squeezed to fit) and the number, beside their fighter
  function oppHandHtml(v) {
    const n = v.oppHand, shown = Math.min(n, 9), step = shown > 1 ? Math.min(12, Math.floor(30 / (shown - 1))) : 0;
    const fan = shown ? Array.from({ length: shown }, (_, i) => `<span class="card s back"${i ? ` style="margin-left:${step - 30}px"` : ''}></span>`).join('') : '<span class="card s nocard"></span>';
    return `<span class="lbl">Their hand</span><span class="fan">${fan}</span><b class="count">${n}</b>`;
  }
  function renderTable(v, p) {
    const el = one('#t' + p), html = tableHtml(v, p);

      const full = () => el.scrollHeight > el.clientHeight + 1;       // too full: overlap the cards, then draw smaller, then grow down
      if (full()) { el.classList.add('d1'); if (full()) { el.classList.add('d2'); if (full()) el.classList.add('grow'); } }

    }

      th.title = `${nameOf(1)} holds ${plural(v.oppHand, 'card')}, face down`; th.setAttribute('aria-label', th.title);
    }
  }

  function setPrompt(title, say) {
    one('#prompt b').textContent = title; one('#prompt span').textContent = say;
    one('#prompt').classList.remove('glow', 'kb'); one('#dHand').classList.remove('glow', 'kb');
    // a long sentence: smaller letters, so it always stays inside the bar
    const s = one('#prompt span'); s.style.fontSize = '';
    for (let f = 19; f >= 13 && s.offsetHeight > 44; f -= 2) s.style.fontSize = f + 'px';
  }
  // the "What happened" list shows only whole sentences: the oldest ones are dropped until the rest fits its box
  function fitFeed() {
    const p = one('#dInfo'), f = p && one('.feed', p); if (!f) return;
    const room = parseFloat(p.style.height) || p.clientHeight;
    const over = () => f.offsetTop + f.offsetHeight + 12 > room;
    while (f.children.length > 1 && over()) f.lastElementChild.remove();
    for (let s = 16; s >= 13 && over(); s--) f.firstElementChild.style.fontSize = s + 'px';      // one very long sentence: smaller letters
  }
  // many cards or dice: squeeze them so they stay on one line, inside their box
  function fitDock() {
    all('#dHand .cards, #dInfo .cards').forEach(c => {
      const kids = all('.card', c), n = kids.length;

  // what a chain will do, for the defend screen
  function chainEffects(v, att, ch, n) {
    const c = CHARACTERS[v.chars[att]], out = [], m = G.match;
    if (!ch) return out;
    if (c.spells) {
      if (ch.kind === 'run') out.push(`Spell: Fire ×${n - 2}`); else out.push(`Spell: Freeze ${plural(n >= 4 ? 2 : 1, 'round')}`);

  // Which hand cards can go into a chain right now (asked from the engine): usable = every card that is part of some legal play,
  // suggest = the play the engine itself would pick (the "Play a chain" button selects these cards).
  function chainHints() {
    const m = G.match, n = m.pl[0].hand.length, usable = new Set();
    const has = (idx, type) => m.chainOptions(0, idx).some(o => o.type === type), mark = idx => idx.forEach(i => usable.add(i));
    for (let a = 0; a < n; a++) {
      if (has([a], 'add')) mark([a]);
      for (let b = a + 1; b < n; b++) {
        if (has([a, b], 'add')) mark([a, b]);
        for (let c = b + 1; c < n; c++) if (has([a, b, c], 'new')) mark([a, b, c]);
      }
    }
    const suggest = m.findChainPlay(0) || [];
    mark(suggest);
    return { usable, suggest };
  }
  // the big sign across the stage, once when a decision with a possible chain starts
  function chainSign(kb) {

    all('.chainsign', arena).forEach(x => x.remove());
    const el = document.createElement('div');
    el.className = 'chainsign' + (kb ? ' kb' : ''); el.setAttribute('role', 'status');
    el.innerHTML = kb ? `<b>${pic('star', 5)}Killing Blow ready!${pic('star', 5)}</b><span>${esc(nameOf(1))}’s Last is 0: land a chain and you name their weak point</span>`
      : `<b>${pic('star', 5)}Chain ready!${pic('star', 5)}</b><span>${esc(nameOf(1))}’s Break is 0: you can play a chain this round</span>`;
    arena.appendChild(el); setTimeout(() => el.remove(), 2300);

  /* ---------------- selecting chain cards, then playing them ---------------- */
  // Every legal play for the cards you selected, with the chain it would make (asked from the engine: chainOptions, planChain).
  // added[i]: card i of the result comes from your hand (the others are already on the table).
  function chainPlans(v) {
    const m = G.match, idx = G.picks, cards = idx.map(i => v.hand[i]), pos = idx.map(i => i + 1).join(' '), plans = [];
    if (!cards.length) return plans;
    const opts = m.chainOptions(0, idx);
    const mk = (act, base, ci, want) => {
      const plan = m.planChain(base, cards, 0, want || null); if (!plan) return;
      const made = { cards: plan.cards, kind: plan.kind, jokers: plan.jokers || 0 }, left = {}, old = base ? base.cards : [];
      old.forEach(c => { left[c] = (left[c] || 0) + 1; });
      const added = plan.cards.map(c => { if (left[c] > 0) { left[c]--; return false; } return true; });
      plans.push({ act, ci, want: want || null, base: old.slice(), result: plan.cards.slice(), kind: plan.kind, added, complete: m.isComplete(made, 0), oneAway: m.oneAway(made, 0) });
    };
    if (opts.some(o => o.type === 'new')) {
      const both = cards.includes(0) && m.planChain(null, cards, 0, 'same') && m.planChain(null, cards, 0, 'run');      // Jokers: it could be a set or a run
      if (both) { mk(`chain new ${pos} set`, null, -1, 'same'); mk(`chain new ${pos} run`, null, -1, 'run'); }
      else mk(`chain new ${pos}`, null, -1);
    }
    opts.filter(o => o.type === 'add').forEach(o => mk(`chain add ${o.ci + 1} ${pos}`, m.chains[0][o.ci], o.ci));
    return plans;
  }
  const chainLabel = pl => pl.kind === 'joker' ? `Joker set of ${pl.result.length}` : pl.kind === 'run' ? `run ${pl.result[0]}–${pl.result[pl.result.length - 1]}` : `set of ${pl.result.length}: ${pl.result[0]}s`;
  // Why the selected cards can't be played: the chain rules that fail, in the engine's terms (minimum length, one number or in a row,
  // the most a same-number chain holds, what each chain on the table can take). Returns sentences, the main one first.
  function whyNotChain(v, cards) {
    const L = SETTINGS.chain.minLength, c = CHARACTERS[v.chars[0]], K = c.complete, mine = v.chains[0], n = cards.length, out = [];
    const J = cards.filter(x => x === 0).length, R = cards.filter(x => x !== 0).sort((x, y) => x - y), shown = cards.map(cardStr).join(' ');
    const jk = J ? ` (even with ${J > 1 ? 'the Jokers' : 'the Joker'})` : '';
    if (n < L) out.push(`A new chain needs at least ${L} cards: you selected ${n}.`);
    else if (R.length && R.every(x => x === R[0])) out.push(`A same-number chain can never hold more than ${K.same} cards: you selected ${n}.`);
    else if (!R.length) out.push(`A Joker set holds at most ${c.jokerWin} Jokers.`);
    else {
      const dup = R.find((x, i) => i && x === R[i - 1]), gap = R.findIndex((x, i) => i && x !== R[i - 1] + 1);
      if (dup !== undefined) out.push(`${shown} is not a new chain${jk}: a run can’t repeat a number (two ${dup}s), and a same-number chain is one number only.`);
      else if (n > K.runTo - K.runFrom + 1) out.push(`${shown} is not a new chain: the longest run is ${K.runFrom}–${K.runTo}.`);
      else out.push(`${shown} is not a new chain${jk}: not one number, and not in a row${gap > 0 && !J ? ` (nothing between ${R[gap - 1]} and ${R[gap]})` : ''}.`);
    }
    mine.forEach((ch, i) => {
      const len = ch.cards.length, lo = ch.cards[0], hi = ch.cards[len - 1];
      let takes;
      if (ch.kind === 'joker') takes = len >= c.jokerWin ? 'is full' : `takes only Jokers (${c.jokerWin - len} more at most)`;
      else if (ch.kind === 'same') takes = len >= K.same ? `is full (${K.same} is the most)` : `takes only ${lo}s${c.deck.jokers ? ' or Jokers' : ''} (${K.same - len} more at most)`;
      else {
        const ends = [lo > K.runFrom ? lo - 1 : null, hi < K.runTo ? hi + 1 : null].filter(x => x !== null);

  // the preview in the left box: the chain each legal play would make (cards already on the table are plain, the ones you add are

  function chainPreview(v, plans, kb) {

        <span class="cpres">${esc(chainLabel(pl))}</span></div>`).join('').replace(/ data-act=""/g, '');
    const p0 = plans[0], n = p0.result.length, deckN = v.deck[0], facts = [];
    if (plans.length === 1) {

      facts.push(`To stop it they discard ${plural(n, 'card')} (they hold ${v.oppHand}${v.oppHand < n ? ': too few' : ''}). ${kb ? 'If it lands: no Charge, you name their weak point.' : `If it lands: your Charge, up to ${n} dice.`}`);
      if (p0.complete) facts.push(`Completes the chain: after this play it leaves the table and its ${n} cards are shuffled back into your deck (${deckN} → ${deckN + n}).`);

  }
  // step 2 of 2: the buttons that really play the selected cards (one per legal play), or a greyed one saying why not
  function chainButtons(v, plans, kb) {

  // the bar a decision would change, and the value it would fall to (shown as a marker on that bar)
  function previewFor(d, v) {

  /* ---------------- a completed chain goes back into the deck ---------------- */
  // The engine's sentence tells it all (whose chain, its cards, the deck afterwards). The chain's cards fly from the table to that
  // player's deck count, a band says what happened, and the count goes up. Shown for both players.
  async function recycleScene(raw, prev, now, t) {
    const m = raw.match(/^Player (\d)'s chain ([\d-]+) is complete: it leaves the table and its (\d+) cards are shuffled back into Player \d's deck \((\d+) cards\)\./);
    const arena = one('#arena');
    if (m) G.recycleTip = { p: m[1] - 1, n: Number(m[3]), deck: Number(m[4]) };
    if (!m || !arena || !(t > 0)) { G.held = null; renderGauges(); return; }      // Skip and the quick self-play test: no scene, no wait
    const p = m[1] - 1, mine = p === 0, cards = m[2].split('-').map(Number), n = Number(m[3]), deck = Number(m[4]), big = cards.length > 8;
    all('.recyc, .popnote', arena).forEach(x => x.remove());
    const el = document.createElement('div');
    el.className = `recyc ${mine ? 'mine' : 'theirs'}`; el.setAttribute('role', 'status'); el.style.setProperty('--t', t);
    el.dataset.player = p; el.dataset.deck = deck; el.dataset.cards = n;
    el.innerHTML = `<b class="rtitle">Chain complete!</b><span class="rcards${big ? ' many' : ''}">${cards.map(c => card(c, { size: big ? 'x' : 's' })).join('')}</span>
      <span class="rline">${mine ? 'Your' : esc(nameOf(p)) + '’s'} chain leaves the table: its ${plural(n, 'card')} are shuffled back into ${mine ? 'your' : 'their'} deck</span>
      <span class="rdeck">${pic('deck', 3)}${mine ? 'Your deck' : 'Their deck'} <b>${deck - n}</b> → <b>${deck}</b></span>`;
    el.onclick = () => { el._hurry = true; };
    arena.appendChild(el);
    // the cards fly from the chain's place on the table to the deck count under that player's bars
    const fly = [], table = one('#t' + p), ci = prev ? prev.chains[p].findIndex(c => c.complete) : -1;
    const from = (table && ci >= 0 && all('.tchain', table)[ci]) || table, to = one('#g' + p + ' .deckchip');
    if (!stillMotion() && from && to) {
      const a = arena.getBoundingClientRect(), z = a.width / arena.offsetWidth || 1;
      const mid = x => { const r = x.getBoundingClientRect(); return { x: (r.left - a.left + r.width / 2) / z, y: (r.top - a.top + r.height / 2) / z }; };
      const A = mid(from), B = mid(to);
      cards.forEach((c, i) => {
        const holder = document.createElement('div'); holder.className = 'flycard'; holder.innerHTML = card(c, { size: 's' });
        const sx = A.x + (i - (cards.length - 1) / 2) * 14; holder.style.left = sx + 'px'; holder.style.top = A.y + 'px';
        arena.appendChild(holder); fly.push(holder);
        const dx = B.x - sx, dy = B.y - A.y;
        holder.animate([{ transform: 'translate(-50%, -50%) scale(1.2) rotate(0deg)', opacity: 1 },
          { transform: `translate(calc(-50% + ${dx * .5}px), calc(-50% + ${dy * .5 - 50}px)) scale(1.4) rotate(${(i % 2 ? 1 : -1) * 180}deg)`, opacity: 1, offset: .5 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.6) rotate(${(i % 2 ? 1 : -1) * 360}deg)`, opacity: 1, offset: .92 },
          { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.3)`, opacity: 0 }],
        { duration: 620 * t, delay: (260 + i * 45) * t, easing: 'cubic-bezier(.4, 0, .6, 1)', fill: 'both' });
      });
    }
    await sceneWait(el, 900 + cards.length * 45, t);            // the cards are on their way
    G.held = null; renderGauges();                              // they arrive: the chain is off the table, the deck count goes up
    const chip = one('#g' + p + ' .deckchip'); if (chip) { chip.classList.add('gain'); chip.dataset.gain = '+' + n; }
    el.classList.add('s2');
    await sceneWait(el, 1300, t);
    el.classList.add('out');
    await sceneWait(el, 180, t);
    el.remove(); fly.forEach(x => x.remove());
    const c2 = one('#g' + p + ' .deckchip'); if (c2) c2.classList.remove('gain');
  }

  /* ---------------- first-match tips ---------------- */
  // Short, dismissible, shown once each at the first decision they are about (a chain you can play, your first Charge, the first
  // completed chain). Remembered on this device; the "Tips" button in the top bar turns them off, or on again from the start.
  // Never shown at speed 0 (the quick self-play test), and they never block a click.
  const TIPS = { on: true, seen: {} };
  try {
    if (localStorage.getItem('break-tips-on') === '0') TIPS.on = false;
    JSON.parse(localStorage.getItem('break-tips-seen') || '[]').forEach(id => { TIPS.seen[id] = true; });
  } catch (e) { /* no storage: tips on, none seen */ }

  function tipText(id, x) {
    const v = G.view, L = SETTINGS.chain.minLength;
    if (id === 'chain') return { title: x ? 'Tip: the Killing Blow chain' : 'Tip: playing a chain', lines: [
      `<b>1 Select</b> the gold cards (or press “${x ? 'Select Killing Blow cards' : 'Select chain cards'}”). Nothing is played yet.`,
      '<b>2 Check</b> the preview: this box shows the chain they would make.',
      `<b>3 Play</b> it with “${x ? 'Play Killing Blow chain' : 'Play selected chain'}”, instead of a move.`,
      `A chain: ${L}+ cards of one number or in a row. They can stop it by discarding as many cards. If it lands, ${x ? 'you name their weak point' : 'your Charge hits their Shield'}.`] };
    if (id === 'charge') return { title: 'Tip: your Charge', lines: [
      '<b>Attack now:</b> your pool total minus their highest escape die hits their Shield. It spends your dice and ends the Charge.',
      `<b>Charge again:</b> one more die (at most one per chain card), but they roll their escape dice again. If all of them match, the chain breaks: no attack, their Break refills to ${v.max[1].break}, and you keep your pool for your next Charge.`] };
    if (id === 'recycle') { const K = CHARACTERS[v.chars[x.p]].complete, mine = x.p === 0; return { title: 'Tip: a completed chain', lines: [
      `${mine ? 'Your' : esc(nameOf(x.p)) + '’s'} chain was complete (${K.same} of one number, or the full run ${K.runFrom}–${K.runTo}), so it left the table and its ${plural(x.n, 'card')} were shuffled back into ${mine ? 'your' : 'their'} deck (now ${x.deck}).`,
      `<b>Watch the deck count under the bars.</b> ${DRAW_MOVES.map(k => MOVE_NAME[k]).join(' and ')} draw from it, and a deck that reaches 0 loses the match. Completing a chain is the only way to refill it.`] }; }
    return null;
  }
  // show tip `id` if it is due; returns true when it is (or already was) on screen

  /* ---------------- settings ---------------- */

  const LEVELS = [['easy', 'Easy', 'A weaker opponent'], ['normal', 'Normal', 'Any opponent'], ['hard', 'Hard', 'A stronger opponent']];
  const LEVEL_NAME = Object.fromEntries(LEVELS.map(l => [l[0], l[1]]));

    const vb = one('#volBox'); if (vb) vb.classList.toggle('off', !SND.on);

  /* ---------------- the end of the match ---------------- */
  function showEnd(r) {
    G.preview = null; G.held = null; coachHide();
    const v = G.view = snapshot(G.match), w = r.winner;
    setMode('kb');
    renderGauges();
    one('#turn').style.display = 'none';
    const title = w === null ? 'No winner' : w === 0 ? 'You win!' : 'You lose';
    const endAt = Math.min(700, Math.max(sfxRinging(['kb-right', 'five-jokers', 'deck-out']) - 300, (G.minorAt || 0) - performance.now()));
    announce(w === null ? 'no-winner' : w === 0 ? 'win' : 'lose', { delay: endAt });      // after the last big sound, not on top of it
    music(w === null ? null : w === 0 ? 'win' : 'lose', { fade: 500, delay: Math.max(0, endAt) + 700 });      // the battle music fades; the win or lose sting follows the result sound
    setPrompt('Match over', `${title} — ${tell(r.endReason || '')}.`);

    if (w !== null) setTimeout(() => G.fighters[1 - w].pose('hurt', 700 * speed), 360 * speed);
    one('#dInfo').innerHTML = `<h4>Result</h4><p class="big">${title}</p><p>${esc(tell(r.endReason || ''))} after ${plural(r.rounds || v.round, 'round')}.</p>`;
    one('#dHand').innerHTML = `<h4>Weak points</h4><p>Yours: <b>${esc(weak[0] || '—')}</b>. ${esc(nameOf(1))}’s: <b>${esc(weak[1] || '—')}</b>.</p><p class="dim">The computer (${LEVEL_NAME[G.level] || 'Normal'}) was ${esc(G.bot.name)}: ${esc(botStyle(G.bot))}.</p>`;
    one('#dAct').innerHTML = `<button type="button" class="btn main mid" id="again"><b>Rematch</b><small>Same characters</small></button><button type="button" class="btn mid" id="toSelect"><b>New match</b><small>Choose the characters</small></button><button type="button" class="btn mid" id="toMenu"><b>Menu</b><small>Back to the start page</small></button>`;
    one('#again').onclick = () => startMatch(G.chars[0], G.chars[1]);

  function botStyle(b) {

    const st = { always: 'always stops chains', never: 'never stops chains', shortOnly: 'stops only short chains', half: 'stops chains half the time' }[b.stop];

  /* ---------------- choosing the characters ---------------- */
  const pickState = { mine: 'swordsman', theirs: 'mage' };
  const MAXBAR = Math.max(...ROSTER.flatMap(k => BAR.map(b => CHARACTERS[k].bars[b])));       // the longest bar of the roster: every gauge is drawn against it
  const MAXNUM = Math.max(...ROSTER.map(k => CHARACTERS[k].deck.maxNumber));
  const WEAK = [...new Set(ROSTER.flatMap(k => CHARACTERS[k].weakPoints))];
  const BAR_TIP = { break: 'The first bar to fall. While it is at 0, the opponent can play chains.', shield: 'Hit by charge attacks after a chain lands. At 0 the fight moves to the Last bar.', last: 'The final bar. While it is at 0, the opponent may play a chain as a Killing Blow: if it lands, they name a weak point, and the right one wins.' };
  const DIE_TIP = { duel: 'Rolled for damage when a duel move hits.', attack: 'Rolled into the pool in a Charge, after a chain lands.', defend: 'Rolled to break free when the opponent charges.' };
  // something to look at, with its full sentence on hover, focus or tap
  const hint = (cls, inner, name, text) => `<span class="hint ${cls}" tabindex="0">${inner}<span class="tip"><b>${esc(name)}</b>${esc(text)}</span></span>`;
  const artHtml = (k, form) => { const a = ART[k].standing[0]; return a ? `<img src="${a}" alt=""${form ? ` class="fa-${form}"` : ''}>` : `<canvas width="40" height="48" data-ph="${k}" data-form="${form || ''}"></canvas>`; };

  // One fighter's card on the Play screen: the art, the name with a Guide button, the difficulty (and the Swordsman's
  // "Recommended first pick" in your row), three bars drawn to the same scale for everyone, then three plain rows: the deck in
  // one line, the dice with the Block heal and the weak point, and the special powers as picture tiles (the Demon's forms are
  // tiles like the others). Every picture still gives its full sentence on hover, focus or tap.
  function fighterCard(row) {
    const k = pickState[row], c = CHARACTERS[k], d = c.deck, g = GUIDE[k], he = HE(k), He = he[0].toUpperCase() + he.slice(1);
    const norm = diceFor('default'), start = diceFor(k, c.forms ? 'elegant' : null);
    const bars = BAR.map((b, i) => hint(`hbar k${i}`, `<span class="hn">${BAR_NAME[b]}</span><span class="segs">${Array.from({ length: MAXBAR }, (_, n) => `<i${n < c.bars[b] ? ' class="on"' : ''}></i>`).join('')}</span><b>${c.bars[b]}</b>`, `${BAR_NAME[b]} ${c.bars[b]}`, BAR_TIP[b])).join('');
    const deck = hint('fdeck', `<span class="tot"><b>${deckSize(d)}</b> cards</span><span class="strip">${card(d.minNumber, { size: 'x' })}<i>to</i>${card(d.maxNumber, { size: 'x' })}</span><span class="times">×${d.copies}</span>${d.jokers ? `<span class="plus">+</span>${card(0, { size: 'x' })}<span class="times">×${d.jokers}</span>` : ''}`,
      `Deck: ${plural(deckSize(d), 'card')}`, `Numbers ${d.minNumber} to ${d.maxNumber}, ${d.copies} of each${d.jokers ? `, plus ${plural(d.jokers, 'Joker')}` : ''}. A chain is complete at ${c.complete.same} of one number or the full run ${c.complete.runFrom}–${c.complete.runTo}. With no cards left, ${he} loses.`);
    const dice = DICE.map(kind => {
      const n = start[kind], usual = norm[kind], dir = n > usual ? 'up' : n < usual ? 'down' : '';
      return hint(`pdie ${dir}`, `<b>d${n}</b><small>${DIE_NAME[kind]}</small>`, `${DIE_NAME[kind]} die: d${n}`, `${DIE_TIP[kind]} ${n === usual ? 'The normal size.' : `${n > usual ? 'Bigger' : 'Smaller'} than normal (d${usual}).`}${c.forms ? ' These are his starting dice (Elegant form).' : ''}`);
    }).join('');
    const block = hint('fstat', `${pic('shield', 3)}<b>+${c.blockRegain}</b><small>Block heal</small>`, `Block heals ${c.blockRegain}`, `A winning Block heals ${HIS(k)} current bar by ${c.blockRegain}, unless it is full.`);
    const weak = hint('fweak', `<span class="wp">${c.weakPoints.map(w => `<i class="on">${esc(w)}</i>`).join('')}</span><small>Weak point</small>`, 'Weak point',
      c.weakPoints.length > 1 ? `${He} secretly picks one of ${c.weakPoints.join(', ')}. A Killing Blow must name it to win.` : `Always the ${c.weakPoints[0]}: a Killing Blow against ${HIM(k)} can’t miss.`);
    const list = powersFor(k), forms = list.filter(p => p.form);
    const powers = list.map(p => hint(`power${p.form ? ' form' : ''}`, `<span class="pico">${pic(p.art, 4)}</span><span class="ptxt"><b>${p.form ? `${forms.indexOf(p) + 1}. ` : ''}${esc(p.name)}</b><small>${esc(p.short)}</small></span>`, p.form ? `${p.name} form` : p.name, p.full)).join('');
    return `<div class="panel fcard${row === 'theirs' ? ' right' : ''}" data-row="${row}" data-key="${k}">
      <div class="ftop"><div class="fart">${artHtml(k)}${ART[k].standing.length ? '' : '<span class="soon">art coming</span>'}</div>
        <div class="fid"><div class="fhead"><h3>${esc(c.name)}</h3><button type="button" class="btn mid fguide" data-guide="${k}" data-row="${row}" aria-label="${esc(c.name)}: guide"><b>Guide</b></button></div>
          <div class="fmeta"><span class="cdiff fdiff d-${g.difficulty.toLowerCase()}">${esc(g.difficulty)}</span>${g.recommended && row === 'mine' ? '<span class="frec">★ Recommended first pick</span>' : ''}</div>
          <div class="hbars">${bars}</div></div></div>
      <div class="frow"><span class="fl">Deck</span>${deck}</div>
      <div class="frow"><span class="fl">Dice</span><span class="fdice">${dice}</span>${block}${weak}</div>
      <div class="frow top"><span class="fl">Powers</span><div class="powers n${list.length}">${powers}</div></div>
    </div>`;
  }

  // leave the match in progress, if any (and its sounds)
  function leaveMatch() { if (G) { G.token = {}; G.skip = true; } pending = null; sfxStop(); coachHide(); }

  // The character screen, used two ways:
  //   pick   : Play. Two rows of tiles (You, Computer), each with its fighter's card; both fighters are picked on the one
  //            screen, then Fight! (or Random for a row, or Random both).
  //   browse : the start page's Characters choice. Eight simple cards (picture, name, one-line pitch, difficulty, a Guide
  //            button); nothing is picked. The words are the owner's guide (GUIDE, game-src/guide.js).
  // Both have the guide pages (showGuide) laid over them.
  const sel = { mode: 'pick', guideRow: null };
  const randomChar = () => ROSTER[Math.floor(Math.random() * ROSTER.length)];
  function charCard(k) {
    const c = CHARACTERS[k], g = GUIDE[k];
    return `<div class="ccard" data-key="${k}">
      ${g.recommended ? '<span class="crec">★ Recommended first pick</span>' : ''}
      <div class="cpick"><span class="cname">${esc(c.name)}</span><span class="cbody"><span class="cart">${artHtml(k)}</span>
      <span class="ctext"><span class="cdiff d-${g.difficulty.toLowerCase()}">${esc(g.difficulty)}</span><span class="cpitch">${esc(g.pitch)}</span></span></span></div>
      <button type="button" class="btn mid cguide" data-guide="${k}" aria-label="${esc(c.name)}: guide"><b>Guide</b></button></div>`;
  }
  // draw the character screen as `sel` says; focus: a selector to put the keyboard focus on afterwards
  function drawSelect(focus) {
    const frame = one('#frame'), pick = sel.mode === 'pick';
    const tile = (row, k) => `<button type="button" class="tile${pickState[row] === k ? ' on' : ''}" data-row="${row}" data-key="${k}" aria-pressed="${pickState[row] === k}" title="${esc(CHARACTERS[k].name)}${GUIDE[k].recommended && row === 'mine' ? ': recommended first pick' : ''}">
        ${GUIDE[k].recommended && row === 'mine' ? '<span class="tstar" aria-hidden="true">★</span>' : ''}<span class="art">${artHtml(k)}</span><span class="tname">${esc(CHARACTERS[k].name)}</span></button>`;
    const body = pick ? `${['mine', 'theirs'].map((row, i) => `<div class="selcol" style="left:${20 + i * 634}px" data-row="${row}">
        <div class="selrow"><div class="rowhead"><span class="rowlabel${row === 'mine' ? '' : ' long'}">${row === 'mine' ? 'You' : 'Computer'}</span><button type="button" class="chip rand" data-rand="${row}" title="A random fighter for ${row === 'mine' ? 'you' : 'the computer'}">Random</button></div>
          <div class="tiles">${ROSTER.map(k => tile(row, k)).join('')}</div></div>
        ${fighterCard(row)}</div>`).join('')}
      <div class="selbar"><div class="selhint">${pic('rules', 2)}<span>Point at (or tap) any picture to read the full rule.</span></div>
        <button type="button" class="btn main mid" id="fight"><b>Fight!</b><small>${esc(CHARACTERS[pickState.mine].name)} v ${esc(CHARACTERS[pickState.theirs].name)}</small></button>
        <button type="button" class="btn mid" id="spicy"><b>Random both</b><small>Feeling spicy</small></button></div>`
      : `<div class="cgrid">${ROSTER.map(charCard).join('')}</div>
      <div class="selbar"><div class="selhint">${pic('rules', 2)}<span>The eight fighters. Open a Guide to learn more about one.</span></div></div>`;
    frame.innerHTML = `<div class="scene on select ${pick ? 'pick' : 'browse'}" data-mode="${sel.mode}">
      <div class="seltitle" id="selTitle">${pick ? 'Choose the fighters' : 'Characters'}</div>
      <button type="button" class="chip" id="toMenu" title="Back to the start page (Esc)">◀ Menu</button>
      ${body}
      <div class="guidepage" id="guideBox" role="dialog" aria-label="Character guide (Beta)" hidden></div>
    </div>`;
    all('canvas[data-ph]', frame).forEach(cv => drawPlaceholder(cv, cv.dataset.ph, cv.dataset.form));
    all('.tile', frame).forEach(t => t.onclick = () => { pickState[t.dataset.row] = t.dataset.key; sfx('pick-fighter'); drawSelect(`.tile[data-row="${t.dataset.row}"][data-key="${t.dataset.key}"]`); });
    all('[data-rand]', frame).forEach(b => b.onclick = () => { pickState[b.dataset.rand] = randomChar(); sfx('random'); drawSelect(`[data-rand="${b.dataset.rand}"]`); });
    all('[data-guide]', frame).forEach(b => b.onclick = () => { sel.guideRow = b.dataset.row || null; showGuide(b.dataset.guide); });
    one('#toMenu').onclick = () => showStart();
    const on = (id, f) => { const b = one(id); if (b) b.onclick = f; };
    on('#spicy', () => { pickState.mine = randomChar(); pickState.theirs = randomChar(); sfx('random-both'); startMatch(pickState.mine, pickState.theirs); });
    on('#fight', () => { announce('fight'); startMatch(pickState.mine, pickState.theirs); });
    const f = focus && one(focus, frame); if (f) f.focus({ preventScroll: true });
  }
  // mode: 'pick' (Play: your earlier picks are still selected) or 'browse'
  async function showSelect(mode = 'pick') {
    const my = ++nav; screen = 'select';
    leaveMatch(); music('menu');
    await Promise.all(ROSTER.map(loadArt));
    if (nav !== my) return;
    sel.mode = mode; sel.guideRow = null;
    drawSelect(mode === 'pick' ? `.tile[data-row="mine"][data-key="${pickState.mine}"]` : '[data-guide]');
  }
  // The guide page (Beta): one per character, laid over the character screen so the player's place and picks stay as they are.
  // Every sentence is the owner's guide, word for word (GUIDE, game-src/guide.js). The "At a glance" row is the engine's own
  // numbers (bars, deck, dice, Block heal, weak point).
  // The radar chart: one spoke per axis of GUIDE_RADAR_AXES (guide.js), rings at 1 to 5, the character's scores (GUIDE[k].radar)
  // as a filled shape in the character's colour. Each label carries its score; pointing at or focusing a label shows its meaning.
  const RADAR = { w: 282, h: 236, cx: 141, cy: 120, r: 64 };
  function radarColour(k) {
    const [main, , trim] = COLOURS[k] || COLOURS.swordsman;
    return [1, 3, 5].every(i => parseInt(main.slice(i, i + 2), 16) > 0xd0) ? trim : main;       // a near-white fighter (the Paladin) is drawn in his trim colour
  }
  function radarSvg(k) {
    const { w, h, cx, cy, r } = RADAR, A = GUIDE_RADAR_AXES, N = A.length, sc = GUIDE[k].radar;
    const dir = i => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [Math.cos(a), Math.sin(a)]; };
    const at = (i, v) => { const [x, y] = dir(i); return [cx + r * v / 5 * x, cy + r * v / 5 * y]; };
    const f = n => (Math.round(n * 10) / 10).toString(), pts = v => A.map((_, i) => at(i, typeof v === 'function' ? v(i) : v).map(f).join(',')).join(' ');
    const rings = [1, 2, 3, 4, 5].map(n => `<polygon class="rring r${n}" points="${pts(n)}"/>`).reverse().join('');
    const spokes = A.map((_, i) => { const [x, y] = at(i, 5); return `<line class="rspoke" x1="${cx}" y1="${cy}" x2="${f(x)}" y2="${f(y)}"/>`; }).join('');
    const dots = A.map(([key], i) => { const [x, y] = at(i, sc[key]); return `<rect class="rpt" data-axis="${key}" data-score="${sc[key]}" data-x="${f(x)}" data-y="${f(y)}" x="${f(x - 3)}" y="${f(y - 3)}" width="6" height="6"/>`; }).join('');
    const labels = A.map(([key, label, meaning], i) => {
      const [dx, dy] = dir(i), x = cx + (r + 9) * dx, y = cy + (r + 9) * dy;
      const anchor = dx > .3 ? 'start' : dx < -.3 ? 'end' : 'middle';
      const ny = dy < -.5 ? y - 19 : dy > .5 ? y + 12 : y - 3;                       // the name's baseline; the score sits under it
      const bx = anchor === 'start' ? x - 3 : anchor === 'end' ? x - 73 : x - 38;
      return `<g class="rax" tabindex="0" role="img" data-axis="${key}" data-label="${esc(label)}" data-score="${sc[key]}" data-meaning="${esc(meaning)}" aria-label="${esc(label)}: ${sc[key]} out of 5. ${esc(meaning)}.">
        <rect class="rhit" x="${f(bx)}" y="${f(ny - 14)}" width="76" height="34"/>
        <text class="rname" x="${f(x)}" y="${f(ny)}" text-anchor="${anchor}">${esc(label)}</text><text class="rscore" x="${f(x)}" y="${f(ny + 17)}" text-anchor="${anchor}">${sc[key]}</text></g>`;
    }).join('');
    return `<svg class="radar" id="radar" viewBox="0 0 ${w} ${h}" data-key="${k}" data-cx="${cx}" data-cy="${cy}" data-r="${r}" role="group" aria-label="${esc(CHARACTERS[k].name)}: radar chart, scores from 1 to 5">
      ${rings}${spokes}<polygon class="rshape" points="${pts(i => sc[A[i][0]])}" fill="${radarColour(k)}"/>${dots}${labels}</svg>`;
  }
  function guideGlance(k) {
    const c = CHARACTERS[k], d = c.deck, dice = diceFor(k, c.forms ? 'elegant' : null);
    const cell = (cls, name, inner) => `<span class="gcell ${cls}"><small>${name}</small><span>${inner}</span></span>`;
    return cell('gbars', 'Bars', BAR.map((b, i) => `<i class="k${i}">${BAR_NAME[b]} <b>${c.bars[b]}</b></i>`).join(''))
      + cell('gdeck', 'Deck', `<b>${deckSize(d)}</b> cards: ${d.minNumber}–${d.maxNumber}, ×${d.copies}${d.jokers ? `, +${plural(d.jokers, 'Joker')}` : ''}`)
      + cell('gdice', c.forms ? 'Starting dice' : 'Dice', DICE.map(x => `${DIE_NAME[x]} <b>d${dice[x]}</b>`).join(' · '))
      + cell('gheal', 'Block heals', `<b>+${c.blockRegain}</b>`)
      + cell('gweak', 'Weak point', c.weakPoints.length > 1 ? `one of <b>${c.weakPoints.map(esc).join(', ')}</b>` : `always the <b>${esc(c.weakPoints[0])}</b>`);
  }
  function showGuide(k, focus) {     // k: a character key, or null to close the page; focus: the button to put the focus on (Back if none)
    const box = one('#guideBox'); if (!box) return;
    const under = all('.select > :not(#guideBox)');
    if (!k) { const from = box.dataset.key; box.hidden = true; box.innerHTML = ''; under.forEach(x => { x.inert = false; }); const b = (sel.mode === 'pick' && one(`.fguide[data-row="${sel.guideRow}"]`)) || one(`[data-guide="${from}"]`); if (b) b.focus({ preventScroll: true }); return; }
    const c = CHARACTERS[k], g = GUIDE[k], n = ROSTER.indexOf(k), pick = sel.mode === 'pick';
    const list = (cls, title, items, tag = 'ul') => `<section class="gsec ${cls}"><h4>${title}</h4><${tag}>${items.map(t => `<li>${esc(t)}</li>`).join('')}</${tag}></section>`;
    box.dataset.key = k;
    box.innerHTML = `<div class="ghead">
        <button type="button" class="chip" id="guideBack" title="Back to the characters (Esc)">◀ Back</button>
        <h2 id="guideName">${esc(c.name)}</h2><span class="gbeta">Beta guide</span>${g.recommended ? '<span class="grec">★ Recommended first pick</span>' : ''}
        <span class="gnav"><button type="button" class="chip" id="gPrev" title="Previous character (←)" aria-label="Previous character">◀</button><span class="gcount">${n + 1} of ${ROSTER.length}</span><button type="button" class="chip" id="gNext" title="Next character (→)" aria-label="Next character">▶</button></span>
      </div>
      <div class="gside">
        <div class="gart">${artHtml(k)}</div>
        <div class="gdline"><small>Difficulty</small><span class="cdiff gdiff d-${g.difficulty.toLowerCase()}">${esc(g.difficulty)}</span></div>
        <p class="gpitch">${esc(g.pitch)}</p>
        <div class="gradar" id="gRadar"><h4>Radar chart<span class="rscale">scores 1 to 5</span></h4>${radarSvg(k)}<p class="rtip" id="rTip" role="status" hidden></p></div>
        ${pick ? `<button type="button" class="btn main mid" id="gPick"><b>Pick ${esc(c.name)}</b><small>As ${sel.guideRow === 'theirs' ? 'the computer’s fighter' : 'your fighter'}</small></button>` : ''}
      </div>
      <div class="gmain">
        ${g.extra ? `<section class="gsec gextra"><h4>${esc(g.extra.title)}</h4><ul>${g.extra.items.map(([a, b]) => `<li><b>${esc(a)}</b>${esc(b)}</li>`).join('')}</ul></section>` : ''}
        <div class="gtwo">${list('ggood', 'Good at', g.good)}${list('gbad', 'Bad at', g.bad)}</div>
        ${list('gtips', 'Tips', g.tips, 'ol')}
        <section class="gsec gfights"><p class="glikes"><b>Likes fighting:</b> <span>${esc(g.likes)}</span></p><p class="ghates"><b>Hates fighting:</b> <span>${esc(g.hates)}</span></p></section>
        <section class="gsec gglance"><h4>At a glance</h4><div class="gcells">${guideGlance(k)}</div></section>
      </div>`;
    all('canvas[data-ph]', box).forEach(cv => drawPlaceholder(cv, cv.dataset.ph, cv.dataset.form));
    box.hidden = false; under.forEach(x => { x.inert = true; });
    // an axis label under the pointer or in focus: its meaning, over the chart's heading
    const tip = one('#rTip'), tell = a => { tip.innerHTML = `<b>${esc(a.dataset.label)} ${a.dataset.score}</b> ${esc(a.dataset.meaning)}`; tip.dataset.axis = a.dataset.axis; tip.hidden = false; all('.rax', box).forEach(x => x.classList.toggle('on', x === a)); };
    const hush = a => { if (tip.dataset.axis === a.dataset.axis) { tip.hidden = true; a.classList.remove('on'); } };
    all('.rax', box).forEach(a => { a.onmouseenter = a.onfocus = () => tell(a); a.onmouseleave = a.onblur = () => hush(a); });
    const step = (d, id) => showGuide(ROSTER[(n + d + ROSTER.length) % ROSTER.length], id);      // the focus stays on the arrow that was used
    one('#guideBack').onclick = () => showGuide(null);
    one('#gPrev').onclick = () => step(-1, '#gPrev');
    one('#gNext').onclick = () => step(1, '#gNext');
    if (pick) one('#gPick').onclick = () => { const row = sel.guideRow === 'theirs' ? 'theirs' : 'mine'; pickState[row] = k; sfx('pick-fighter'); drawSelect(`.fguide[data-row="${row}"]`); };      // what clicking that row's tile does (the other pick stays)
    (one(focus || '#guideBack') || one('#guideBack')).focus({ preventScroll: true });
  }
  // keys on the character screen: the arrows move between the tiles or the cards, Esc goes back (the guide page, then the start page)
  function selectKey(e) {
    const box = one('#guideBox'), at = document.activeElement;
    if (box && !box.hidden) {       // the guide page: Esc closes it, ← → turn to the previous or next character
      if (e.key === 'Escape') { e.preventDefault(); sfx('button'); showGuide(null); }
      else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !(at && /^(INPUT|TEXTAREA|SELECT)$/.test(at.tagName))) { e.preventDefault(); sfx('button'); one(e.key === 'ArrowLeft' ? '#gPrev' : '#gNext').click(); }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); sfx('button'); showStart(); return; }
    if (at && at.classList && at.classList.contains('tile') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {       // Play: ← → along the tiles, from your row on into the computer's
      const ts = all('.select .tile'), to = ts[ts.indexOf(at) + (e.key === 'ArrowRight' ? 1 : -1)];
      if (to) { e.preventDefault(); to.focus({ preventScroll: true }); }
      return;
    }
    const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -4, ArrowDown: 4 }[e.key], card = at && at.closest ? at.closest('.ccard') : null;
    if (!d || !card) return;
    const cards = all('.cgrid .ccard'), i = cards.indexOf(card), to = cards[i + d];
    if (!to || (Math.abs(d) === 1 && Math.floor(i / 4) !== Math.floor((i + d) / 4))) return;
    e.preventDefault();
    one('.cguide', to).focus({ preventScroll: true });
  }

  /* ---------------- the start page ---------------- */
  // The first screen: the title on the arena stage, two fighters, and three choices. Play opens the character screen to pick
  // the fighters; Characters opens the same screen to browse. Settings opens the Settings box (openSettings).
  const START_ART = ['swordsman', 'mage'];
  const startChoices = () => all('#start .smenu .sbtn');
  async function showStart() {
    const my = ++nav; screen = 'start';
    leaveMatch(); music('menu');
    await Promise.all(START_ART.map(loadArt));
    if (nav !== my) return;
    const frame = one('#frame');
    frame.innerHTML = `<div class="scene on start" id="start">
      <div class="stage"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i></div>
      ${START_ART.map((k, i) => `<div class="sfig ${i ? 'r' : 'l'}"><i class="shadowdisc"></i><div class="sart">${artHtml(k)}</div></div>`).join('')}
      <h2 class="stitle" id="startTitle">1v1 Break</h2>
      <div class="smenu" role="group" aria-label="Start page">
        <button type="button" class="btn main mid sbtn" data-go="play"><b>Play</b><small>Choose the fighters and fight</small></button>
        <button type="button" class="btn mid sbtn" data-go="chars"><b>Characters</b><small>A guide to each fighter</small></button>
        <button type="button" class="btn mid sbtn" data-go="settings"><b>Settings</b><small>Sound, music and tips</small></button>
      </div>
      <div class="skeys"><kbd>↑</kbd><kbd>↓</kbd> choose <kbd>Enter</kbd> select</div>
    </div>`;
    all('canvas[data-ph]', frame).forEach(cv => drawPlaceholder(cv, cv.dataset.ph, cv.dataset.form));
    startChoices().forEach(b => {
      b.onclick = () => { if (b.dataset.go === 'play') showSelect(); else if (b.dataset.go === 'chars') showSelect('browse'); else openSettings(b); };
      b.onmouseenter = () => b.focus({ preventScroll: true });       // one marker: the pointer and the keys move the same one
    });
    startChoices()[0].focus({ preventScroll: true });
    ROSTER.forEach(loadArt);       // the other fighters' art loads behind the start page, so Play opens at once
  }
  // keys: on the start page ↑ ↓ move between the choices (Enter or Space presses the one in focus, as for any button)
  // the character screen has its own keys (selectKey)
  function onKey(e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (one('#settings')) { if (e.key === 'Escape') { e.preventDefault(); sfx('button'); closeSettings(); } return; }       // the Settings box: Esc closes it; its own controls take the other keys
    if (screen === 'select' && one('.select')) { selectKey(e); return; }
    if (screen !== 'start' || !one('#start')) return;
    const at = document.activeElement;
    if (at && at !== document.body && !at.closest('#start')) return;       // the keys belong to the top bar (or the log) while the focus is there
    const bs = startChoices(), i = bs.indexOf(at), step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
    if (step) { e.preventDefault(); bs[i < 0 ? (step > 0 ? 0 : bs.length - 1) : (i + step + bs.length) % bs.length].focus({ preventScroll: true }); }
    else if (e.key === 'Enter' && i < 0) { e.preventDefault(); bs[0].click(); }       // nothing in focus: Enter is Play
  }

  /* ---------------- page ---------------- */
  function fit() {
    const view = one('.viewport'), frame = one('#frame');
    const k = Math.min(1.25, (view.clientWidth - 8) / 1288, (window.innerHeight - 90) / 724);
    frame.style.transform = `scale(${k})`; view.style.height = (724 * k) + 'px'; frame.style.margin = `${4 * k}px`;
  }
  function start() {
    window.addEventListener('resize', fit); fit();
    one('#newMatch').onclick = () => showSelect();
    one('#menu').onclick = () => showStart();
    document.addEventListener('keydown', onKey);
    one('#frame').addEventListener('click', onClick);
    // the hover sound, used sparingly: only when the pointer moves onto one of the start page's three choices, a character tile
    // on the Play screen, or Fight!. Nowhere else, and never during a match.
    one('#frame').addEventListener('pointerover', e => {
      const b = e.target.closest ? e.target.closest('#start .sbtn, .select.pick .tile, .select.pick #fight') : null;
      if (!b || screen === 'match' || (e.relatedTarget && b.contains(e.relatedTarget))) return;
      sfx('menu-hover', { gap: 140 });       // sweeping along the tiles does not stack
    });
    one('#speed').onclick = e => { speed = speed === 1 ? 0.45 : 1; e.currentTarget.textContent = `Speed: ${speed === 1 ? 'normal' : 'fast'}`; e.currentTarget.setAttribute('aria-pressed', String(speed !== 1)); };
    // Sound: on / off and a volume slider, next to Speed (remembered on this device)
    one('#speed').insertAdjacentHTML('afterend', `<button class="chip" id="sound" type="button"></button><label class="vol" id="volBox"><span>Volume</span><input type="range" id="volume" min="0" max="100" step="5" aria-label="Sound volume"></label>`);
    one('#sound').onclick = () => { quietClick(); setSound(!SND.on); };
    one('#volume').oninput = e => setVolume(e.target.value);
    one('#volume').onchange = () => { audioOn(); sfx('button', { gap: 150 }); };      // a click at the new volume
    one('#volBox').insertAdjacentHTML('afterend', '<button class="chip" id="tips" type="button"></button>');
    one('#tips').onclick = toggleTips;
    one('#settingsBtn').onclick = e => { if (one('#settings')) closeSettings(); else openSettings(e.currentTarget); };
    syncSettings();
    // every click: wake the audio; a button that made no sound of its own gets the plain button click
    document.addEventListener('click', () => { SND.click = { sounded: false }; audioOn(); }, true);
    document.addEventListener('click', e => {
      const c = SND.click, b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (c && !c.sounded && b && !b.disabled && !b.classList.contains('off')) sfx('button');
      SND.click = null;
    });
    showStart();
  }
  // for checking in the browser console: ARENA.autoplay() lets a bot make your decisions too (a quick test of every screen)
  window.ARENA = {
    // the music (for checking): what should play, what is playing and how; record() starts a list of every music() request
    music: { get want() { return MUS.want; }, get playing() { return MUS.cur ? MUS.cur.k : null; }, get how() { return MUS.cur ? MUS.cur.kind : null; }, get woke() { return MUS.woke; }, record() { MUS.log = []; return MUS.log; }, wake: musicWake },
    get game() { return G; }, get pending() { return pending; }, get screen() { return screen; }, get select() { return { mode: sel.mode, mine: pickState.mine, theirs: pickState.theirs }; },
    // the settings (for checking): what is set now, and the same setters the Settings box and the top bar use
    settings: { get level() { return level; }, get hints() { return TIPS.on; }, get sound() { return SND.on; }, get volume() { return SND.vol; }, get gain() { return volGain(); }, get music() { return MUS.on; }, get musicVolume() { return MUS.vol; }, setLevel, setHints, setSound, setVolume, setMusic, setMusicVolume, open: () => openSettings(), close: closeSettings, pickBot }, snapshot, submit, render,
    setSpeed(x) { speed = x; },
    // for checking the sounds: ARENA.sound.record() starts a list of every sound that starts (id, time), ARENA.sound.log reads it
    sound: { sfx, announce, stop: sfxStop, record(on = true) { SND.log = on ? [] : null; }, get log() { return SND.log; }, get on() { return SND.on; }, get volume() { return SND.vol; }, get ctx() { return SND.ctx; }, ids: HAVE_SFX ? Object.keys(SFX.SOUNDS) : [] },
    scenes: { breakScene, stopScene, formScene, showRoll, recycleScene },      // for checking a scene on its own
    // for the UI checks (tests/ui-checks.html): read-only helpers, plus a way to start a match and to ask the engine again for
    // the duel decision after a check has set the match up (hand, bars, deck) the way it needs
    test: {
      objective, whyNotChain, lostNote, duelOutcome, attackFirst, playEvents, tips: TIPS, toggleTips, drawsOf,
      get speed() { return speed; },
      menu: showStart,                                         // back to the start page
      start(mine, theirs) { pending = null; pickState.mine = mine; pickState.theirs = theirs; return startMatch(mine, theirs); },
      plans() { return chainPlans(G.view); },
      // put one decision on screen as the engine would ask it (to look at a screen that is hard to reach by playing); the answer goes to `done`
      show(d, done) { pending = { d, resolve: done || (() => {}), signed: true }; G.view = snapshot(G.match); G.picks = []; G.error = ''; G.armed = null; coachHide(); render(); },
      redecide() {
        if (!pending || pending.d.kind !== 'duel') return false;
        pending = { d: G.match.duelDecision(0), resolve: pending.resolve, signed: true };
        G.view = snapshot(G.match); G.picks = []; G.error = ''; G.armed = null; coachHide(); render(); return true;
      },
    },
    async autoplay(maxSteps = 200000) {
      const me = makeBots(1, Math.random)[0], seen = {};
      if (screen !== 'match') { const old = G; startMatch(pickState.mine, pickState.theirs); while (G === old) await tick(); }      // from the start page or the character select: a match with the picked fighters
      for (let i = 0; i < maxSteps; i++) {
        await tick();
        if (!G || !G.match) continue;
        if (G.match.over || G.match.winner !== null) { if (!pending) { for (let k = 0; k < 20; k++) await tick(); if (!G.events.length) return { result: G.match.result().endReason, winner: G.match.winner, seen }; } }
        if (!pending) continue;
        const d = pending.d; seen[d.kind] = (seen[d.kind] || 0) + 1;
        const tries = botAnswer(me, G.match, 0, d, Math.random);
        const ok = tries.find(t => d.parse(t).ok);
        submit(ok || d.legal[0].split(/\s{2,}|\s+\(/)[0]);
      }
      return { unfinished: true, seen };
    },
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
