    this.bars = [fresh(), fresh()];
    this.chars = [...characters];
    this.poison = [0, 0];            // poison on each player: damage they take at the end of every round
    this.poisonRounds = [0, 0];      // damaging poison rounds counted toward the next drop
    this.frozen = [{}, {}];          // Freeze: { move: duel rounds left } that each player can't use
    this.fire = [{ basic: 0, heavy: 0, block: 0 }, { basic: 0, heavy: 0, block: 0 }];   // Mage's Fire: stacks on each player's moves
    this.power = [0, 0];             // Mage's Power: extra d6 on every duel hit (one per completed chain)
    this.burn = [0, 0];              // Burn on each player: damage at the end of every round, then drops by 1
    this.form = [null, null];        // Demon: "elegant", "winged" or "demonic" (null for other characters)
    this.buff = [null, null];        // Vampire: { break, shield, last } buffs unlocked (null for other characters)
    this.breakCut = [0, 0];          // Cavalryman: how much each player's maximum Break has been lowered
    this.extraDie = [null, null];
    this.kbReady = [false, false];
    this.lastHitter = null;          // rules 1.40: who landed the last duel hit (picks first each round); null = nobody yet (Player 1 first)   // rules 1.39: may make a Killing Blow chain this round (the opponent's Last was 0 at the end of last round)
    this.gCharges = [0, 0];          // Sci-fi Gunner: charges left (set once the characters are known)    // Cavalryman's extra duel die: null, "before" (gained before his own Shield emptied: doubled with comeback) or "after" (double, then +1)
    this.pl = [0, 1].map(() => ({ hand: [], weak: null, deck: [], discard: [] }));   // decks are built once the characters are known
    this.chains = [[], []];          // each: { cards, kind, chained }
    this.d8 = [[], []];
    this.round = 1; this.winner = null; this.over = false; this.endReason = "";
    this.logs = [[], []];
    this.stages = { chain: 0, chained: 0, charge: 0, shieldGone: [false, false], killingBlow: 0 };
    this.keyDecisions = [];
    this.metrics = {
      chainsStopped: 0, chainsLanded: 0, blockCounters: [0, 0], attacksOn: [0, 0], attacksToEmptyShield: [null, null],
      killingBlowAttempts: [], chainsCompleted: [],
      escape: { charges: [0, 0], chargeRolls: [0, 0], breaks: [0, 0], attacks: [0, 0], blocked: [0, 0], d8Faced: [0, 0], chargesElegant: [0, 0], breaksElegant: [0, 0] },   // per DEFENDER
      forms: { reached: [[], []], roundWinged: [null, null], roundDemonic: [null, null] },
      vampire: { unlocked: [{}, {}], breakHeals: [0, 0], healed: [0, 0], overcharge: [0, 0] },
      gunner: { replays: [0, 0], rerolls: [{}, {}] },
      kb: { opened: [0, 0], chains: [0, 0], stopped: [0, 0], landed: [0, 0], noChainRounds: [0, 0] },   // per attacker (rules 1.39 Killing Blow chains)
      bank: [0, 0],                                                                              // Demon: Charges ended by banking a full pool   // per Gunner: rounds replayed, rerolls by kind ("own duel", "their duel", "own charge die", ...)
      cavalry: { cuts: [0, 0], extraDieRound: [null, null], extraDieMode: [null, null], extraDieHits: [0, 0] },   // per Cavalryman   // unlocked[p][bar] = round the buff was unlocked
      spells: { jokerWins: [0, 0], jokerSets: [0, 0], jokersUsed: [0, 0], freeze: [0, 0], freeze2: [0, 0], fire: [0, 0], fireAdded: [0, 0], fireDamage: [0, 0], fireHits: [0, 0], fireKBs: [0, 0], fireMove: [{}, {}], power: [0, 0], powerHits: [0, 0], burn: [0, 0], heal: [0, 0], burnAdded: [0, 0], burnDamage: [0, 0], healed: [0, 0], frozeMove: [{}, {}], freezeBit: [0, 0], burnKBs: [0, 0], burnShields: [0, 0], onLanded: [0, 0] }, poison: { applied: [0, 0], plays: [0, 0], damage: [{ break: 0, shield: 0, last: 0 }, { break: 0, shield: 0, last: 0 }], shieldsEmptied: [0, 0], killingBlowsStarted: [0, 0] }, onlyBlockRounds: [0, 0], longestNoDamageRun: 0,
    };
    this.noDamageRun = 0;
    this.repMove = null; this.repCount = 0;       // draw-by-repetition count
  }

  // ---------- helpers ----------
  roll(n, sides) { return Array.from({ length: n }, () => 1 + Math.floor(this.rng() * sides)); }
  shuffled(list) {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  ch(p) { return CHARACTERS[this.chars[p]]; }
  makePlayer(p) {
    const C = this.ch(p).deck, deck = [];
    for (let n = C.minNumber; n <= C.maxNumber; n++) for (let k = 0; k < C.copies; k++) deck.push(n);
    for (let k = 0; k < (C.jokers || 0); k++) deck.push(0);   // Mage's Jokers
    const d = this.shuffled(deck);
    return { hand: [], weak: null, deck: d, discard: [] };   // the hand is drawn after the weak point is chosen
  }
  say(text, who = [0, 1]) { for (const p of who) this.logs[p].push(`R${this.round}: ${text}`); }
  currentBar(p) { return this.bars[p].shield === 0 ? "last" : "break"; }
  // the size of die a player rolls: "duel" (damage d6), "attack" (charge d8) or "defend" (d4 to break free), bigger for some characters
  sides(p, kind) {
    if (this.form[p] === "elegant") return { duel: 4, attack: 6, defend: 2 }[kind];
    if (kind === "duel" && this.buff[p] && this.buff[p].shield) return this.ch(p).buffs.shieldDie;   // Vampire's Shield buff   // Demon, Elegant form: every die one size smaller (escape d2)
    const D = this.chars[p] && this.ch(p).dice; return (D && D[kind]) || { duel: SETTINGS.diceSides, attack: SETTINGS.charge.attackSides, defend: SETTINGS.charge.defendSides }[kind]; }
  // Demon forms: Winged from the first time his Shield takes damage (the Shield never heals, so: below full), Demonic once it is 0
  updateForms() {
    for (const p of [0, 1]) {
      if (!this.form[p]) continue;
      const B = this.bars[p], F = this.metrics.forms;
      if (this.form[p] === "elegant" && B.shield < this.max(p, "shield")) {
        this.form[p] = "winged"; F.reached[p].push("winged"); F.roundWinged[p] = this.round;
        this.say(`${NAME(p)}'s Shield has taken damage: the Demon takes his WINGED form (his dice are back to normal, for good).`);
      }
      if (this.form[p] === "winged" && B.shield === 0) {
        this.form[p] = "demonic"; F.reached[p].push("demonic"); F.roundDemonic[p] = this.round;
        this.say(`${NAME(p)}'s Shield is gone: the Demon takes his DEMONIC form (his duel hits roll triple dice).`);
      }
    }
  }
  max(p, b) { const m = this.chars[p] ? this.ch(p).bars[b] : SETTINGS.barMax[b]; return b === "break" ? Math.max(0, m - this.breakCut[p]) : m; }   // (a Cavalryman lowers the opponent's maximum Break)
  barFull(p) { const b = this.currentBar(p); return this.bars[p][b] >= this.max(p, b); }   // (a Vampire's Break can go above its maximum)
  poisonFor(p, len) { const P = this.ch(p).poison; if (!P) return 0; const ks = Object.keys(P).map(Number).sort((a, b) => a - b); let v = 0; for (const k of ks) if (len >= k) v = P[k]; return v; }
  // End of every round: each poisoned player takes their poison to one bar (Break, else Shield, else Last); leftover damage is lost
  poisonTick() {
    this._poisonTick(); this.updateForms();
  }
  _poisonTick() {
    for (const p of [0, 1]) {
      const n = this.poison[p]; if (!n || this.winner !== null || this.over) continue;
      const B = this.bars[p], bar = B.shield === 0 ? "last" : B.break > 0 ? "break" : "shield";   // Last once the Shield is gone; else Break, else Shield
      const dmg = Math.min(n, B[bar]); B[bar] -= dmg;
      this.metrics.poison.damage[1 - p][bar] += dmg;
      if (dmg > 0) {                                     // poison weakens: by poisonDecay every poisonDecayEvery damaging rounds
        const C = this.ch(1 - p); this.poisonRounds[p]++;
        if (this.poisonRounds[p] >= (C.poisonDecayEvery || 1)) { this.poison[p] = Math.max(0, n - (C.poisonDecay || 0)); this.poisonRounds[p] = 0; }
        if (this.poison[p] === 0) this.poisonRounds[p] = 0;
      }
      let text = `Poison: ${NAME(p)} takes ${dmg} damage to their ${bar}; their poison is now ${this.poison[p]}.`;
      if (bar === "break" && B.break === 0) text += ` ${NAME(p)} is Broken.`;
      if (bar === "shield" && B.shield === 0) { text += ` ${NAME(p)}'s Shield is gone: final stage.`; this.metrics.poison.shieldsEmptied[1 - p]++; this.stages.shieldGone[p] = true;
        if (this.metrics.attacksToEmptyShield[p] === null) this.metrics.attacksToEmptyShield[p] = this.metrics.attacksOn[p]; }
      if (bar === "last" && B.last === 0) { text += ` ${NAME(p)}'s Last bar is empty: ${NAME(1 - p)} can try a Killing Blow with a chain from next round.`; this.metrics.poison.killingBlowsStarted[1 - p]++; }
      this.say(text);
    }
  }
  // a move whose card effect can't be carried out can't be picked
  // a move this player may pick this round: its card effect can be carried out and it isn't frozen
  // (if Freeze would leave no move at all, Block is still allowed)
  isFrozen(p, key) { return (this.frozen[p][key] || 0) > 0; }
  allowed(key, p) {
    if (!this.canPick(key, p)) return false;
    if (!this.isFrozen(p, key)) return true;
    return key === "block" && !["basic", "heavy"].some(k => this.canPick(k, p) && !this.isFrozen(p, k));
  }
  canPick(key, p) {
    const e = SETTINGS.moves[key].effect, P = this.pl[p];
    if (e === "swap") return P.hand.length > 0 && P.discard.length > 0;
    if (e === "cycle") return P.hand.length > 0;
    return true;
  }
  validChain(cards, p) {
    if (cards.length < SETTINGS.chain.minLength) return null;
    if (cards.every(c => c === cards[0])) return cards.length <= this.ch(p).complete.same ? "same" : null;
    const v = [...cards].sort((a, b) => a - b);
    return v.every((c, i) => i === 0 || c === v[i - 1] + 1) ? "run" : null;
  }
  // A chain play with Jokers (0): what the chain becomes, or null. base = the chain it extends (null for a new one); want = "same" / "run"
  // for a new chain that could be either (default: same number). Jokers take the numbers that make the play legal (a run takes the lowest
  // window that fits). Plays without Jokers are checked exactly as before.
  planChain(base, vals, p, want = null) {
    const J = vals.filter(c => c === 0).length, R = vals.filter(c => c !== 0), K = this.ch(p).complete, L = SETTINGS.chain.minLength;
    if (!J) {
      if (base && base.kind === "joker") return null;
      const cards = (base ? base.cards : []).concat(vals), kind = this.validChain(cards, p);
      return kind ? { kind, cards: cards.sort((x, y) => x - y), real: (base ? base.real || base.cards : []).concat(vals), jokers: base ? base.jokers || 0 : 0 } : null;
    }
    const total = (base ? base.cards.length : 0) + vals.length;
    if ((base && base.kind === "joker") || (!base && !R.length)) {   // a Joker set: only Jokers, up to jokerWin
      if (R.length || total < L || total > (this.ch(p).jokerWin || 0)) return null;
      return { kind: "joker", cards: Array(total).fill(0), real: [], jokers: total };
    }
    if (total < L) return null;
    const F = base ? base.cards : [], fixed = F.concat(R), kinds = base ? [base.kind] : want ? [want] : ["same", "run"];
    for (const kind of kinds) {
      let cards = null;
      if (kind === "same") { if (fixed.every(c => c === fixed[0]) && total <= K.same) cards = Array(total).fill(fixed[0]); }
      else if (new Set(fixed).size === fixed.length && total <= K.runTo - K.runFrom + 1) {
        const lo = Math.min(...fixed), hi = Math.max(...fixed);
        for (let st = Math.max(K.runFrom, hi - total + 1); st <= Math.min(lo, K.runTo - total + 1); st++) { cards = Array.from({ length: total }, (_, i) => st + i); break; }
      }
      if (cards) return { kind, cards, real: (base ? base.real || base.cards : []).concat(R), jokers: (base ? base.jokers || 0 : 0) + J };
    }
    return null;
  }
  chainOptions(p, idxs, want = null) {
    const hand = this.pl[p].hand, cards = idxs.map(i => hand[i]), opts = [];
    if (!cards.length) return opts;
    if (!cards.includes(0) && !this.chains[p].some(ch => ch.kind === "joker" || ch.jokers)) {   // no Jokers anywhere: the original check
      if (this.validChain(cards, p)) opts.push({ type: "new" });
      this.chains[p].forEach((ch, k) => { if (this.validChain(ch.cards.concat(cards), p)) opts.push({ type: "add", ci: k }); });
      return opts;
    }
    if (this.planChain(null, cards, p, want)) opts.push({ type: "new" });
    this.chains[p].forEach((ch, k) => { if (this.planChain(ch, cards, p)) opts.push({ type: "add", ci: k }); });
    return opts;
  }
  findChainPlay(p) {
    const hand = this.pl[p].hand, L = SETTINGS.chain.minLength;
    for (let i = 0; i < hand.length; i++) if (this.chainOptions(p, [i]).some(o => o.type === "add")) return [i];
    const vals = [...new Set(hand)].sort((a, b) => a - b);
    for (const v of vals) { const idx = hand.map((c, i) => c === v ? i : -1).filter(i => i >= 0); if (idx.length >= L) return idx.slice(0, L); }
    for (let k = 0; k + L <= vals.length; k++) { const run = vals.slice(k, k + L); if (run.every((c, i) => c === run[0] + i)) return run.map(v => hand.indexOf(v)); }
    if (hand.includes(0)) {   // Mage's Jokers: any play that uses one
      for (let i = 0; i < hand.length; i++) if (hand[i] === 0 && this.chainOptions(p, [i]).some(o => o.type === "add")) return [i];
      for (let a = 0; a < hand.length; a++) for (let b = a + 1; b < hand.length; b++) for (let c = b + 1; c < hand.length; c++)
        if ([a, b, c].some(i => hand[i] === 0) && this.planChain(null, [hand[a], hand[b], hand[c]], p)) return [a, b, c];
    }
    return null;
  }
  // A chain is complete when it holds all copies of one number, or the full run minNumber..maxNumber
  // completeness uses the builder's character
  chainFull(ch, p) { const K = this.ch(p).complete; return ch.kind === "joker" ? this.ch(p).jokerWin : ch.kind === "same" ? K.same : K.runTo - K.runFrom + 1; }
  isComplete(ch, p) {
    const K = this.ch(p).complete;
    if (ch.kind === "joker") return false;   // a Joker set never completes (five that land win instead)
    return ch.kind === "same" ? ch.cards.length >= K.same : ch.cards[0] <= K.runFrom && ch.cards[ch.cards.length - 1] >= K.runTo;
  }
  oneAway(ch, p) { return !this.isComplete(ch, p) && ch.cards.length === this.chainFull(ch, p) - 1; }
  chainStr(ch) { return ch.kind === "joker" ? ch.cards.map(() => "J").join("-") : ch.cards.join("-") + (ch.jokers ? ` (${ch.jokers} Joker${ch.jokers > 1 ? "s" : ""})` : ""); }
  // After the play that completed it is fully resolved, a completed chain leaves the table and its cards are shuffled into its builder's deck
  retireIfComplete(att, ch) {
    if (!this.isComplete(ch, att)) return;
    const at = this.chains[att].indexOf(ch);
    if (at < 0) return;
    this.chains[att].splice(at, 1);
    const P = this.pl[att];
    P.deck = this.shuffled(P.deck.concat(ch.jokers ? ch.real.concat(Array(ch.jokers).fill(0)) : ch.cards));   // Jokers go back as Jokers
    this.metrics.chainsCompleted.push({ player: att, round: this.round, cards: ch.cards.join("-") });
    this.say(`${NAME(att)}'s chain ${ch.cards.join("-")} is complete: it leaves the table and its ${ch.cards.length} cards are shuffled back into ${NAME(att)}'s deck (${P.deck.length} cards).`);
    const on = this.ch(att).spells;
    if (on === true || (on && on.power)) {   // Mage's Power: one more d6 on every duel hit for the rest of the match
      this.power[att]++; this.metrics.spells.power[att]++;
      this.say(`Spell — Power: ${NAME(att)} now rolls ${this.power[att]} extra d6 on every duel hit.`);
    }
  }
  canChain(p) {
    const q = 1 - p;
    if (this.kbReady[p] && this.bars[q].last === 0) return !!this.findChainPlay(p);   // rules 1.39: a Killing Blow chain needs only their empty Last
    return this.bars[q].break === 0 && (!SETTINGS.chain.onlyWhileShieldUp || this.bars[q].shield > 0) && !!this.findChainPlay(p);
  }
  stageNow() { return this.bars.some(b => b.shield === 0) ? "final stage" : "break stage"; }

  // ---------- what a player may know ----------
  view(p) {
    const q = 1 - p, B = this.bars, P = this.pl[p], O = this.pl[q];
    const bar = (b, x) => `Break ${b.break}/${this.max(x, "break")}, Shield ${b.shield}/${this.max(x, "shield")}, Last ${b.last}/${this.max(x, "last")}`;
    const chains = who => this.chains[who].length ? this.chains[who].map((c, k) => `#${k + 1} ${this.chainStr(c)} (${c.cards.length} links${c.chained ? ", currently chaining" : ""}${this.oneAway(c, who) ? (c.kind === "joker" ? ", ONE JOKER FROM WINNING THE MATCH" : ", ONE CARD FROM COMPLETE") : ""})`).join("; ") : "none";
    const named = who => { const a = this.metrics.killingBlowAttempts.filter(k => k.player === who).map(k => k.named); return a.length ? a.join(", ") : "none"; };
    return [
      `You are ${NAME(p)}. Round ${this.round} (${this.stageNow()}).`,
      `Your character: ${this.chars[p] ? charText(this.ch(p)) : "not chosen yet"}. Opponent's character: ${this.chars[q] ? charText(this.ch(q)) : "not chosen yet"}.`,
      ...([p, q].some(x => this.buff[x]) ? [`Vampire buffs: ${[p, q].filter(x => this.buff[x]).map(x => `${x === p ? "yours" : "the opponent's"}: ${["break", "shield", "last"].filter(k => this.buff[x][k]).map(k => k.toUpperCase()).join(", ") || "none yet"}`).join("; ")} (BREAK: each of his hits on the opponent's Break heals him 1; SHIELD: duel die d8; LAST: knows the opponent's weak point).${this.buff[p] && this.buff[p].last ? ` The opponent's weak point is ${this.pl[q].weak}.` : ""}`] : []),
      ...([p, q].some(x => this.form[x]) ? [`Demon form: yours ${this.form[p] ? this.form[p].toUpperCase() : "-"}, opponent's ${this.form[q] ? this.form[q].toUpperCase() : "-"} (ELEGANT: dice one size smaller - duel d4, charge d6, escape d2; WINGED: normal dice; DEMONIC: duel hits roll triple dice).`] : []),
      `Your bars: ${bar(B[p], p)}. Opponent's bars: ${bar(B[q], q)}.`,
      `Your hand (position: card): ${P.hand.length ? P.hand.map((c, i) => `${i + 1}:${cardStr(c)}`).join("  ") : "empty"}`,
      `Your weak point (secret, never changes): ${P.weak ?? "not chosen yet"}`,
      `Your deck: ${P.deck.length} cards (you lose if it reaches 0). Your discard pile: ${P.discard.join(", ") || "none"}`,
      `Opponent: ${O.hand.length} cards in hand, deck ${O.deck.length}, discard pile: ${O.discard.join(", ") || "none"}. Their weak point is never shown.`,
      `Your chains on the table: ${chains(p)}. Opponent's chains: ${chains(q)}.`,
      `Weak points you have already guessed wrong: ${named(p)}. Weak points the opponent has guessed wrong against you: ${named(q)}.`,
      `Your d8 pool: ${this.d8[p].join(", ") || "empty"}. Opponent's d8 pool: ${this.d8[q].join(", ") || "empty"}.`,
      ...(this.ch(p).spells || this.ch(q).spells ? [`Spells: burn on you ${this.burn[p]}, on the opponent ${this.burn[q]} (damage at the end of every round to Break, then Shield, then Last, then -1). Frozen moves (duel rounds left): yours ${this.frozenText(p)}, opponent's ${this.frozenText(q)}. Fire stacks (damage when that move is picked): on your moves ${this.fireText(p)}, on the opponent's ${this.fireText(q)}. Power (extra d6 on every duel hit): yours ${this.power[p]}, opponent's ${this.power[q]}.`] : []),
      ...(this.poison[p] || this.poison[q] || this.ch(p).poison || this.ch(q).poison ? [`Poison (damage taken at the end of every round: Break, then Shield, then Last; it drops by 1 every two rounds it deals damage): on you ${this.poison[p]}, on the opponent ${this.poison[q]}.`] : []),
      `Draw by repetition: ${this.repCount} round${this.repCount === 1 ? "" : "s"} in a row where both picked the same move${this.repMove ? ` (${SETTINGS.moves[this.repMove].name})` : ""}. At ${SETTINGS.repetitionDraw} the match ends in a draw.`,
      `Recent events you saw (newest last; run "log" for everything):`,
      ...this.logs[p].slice(-14).map(l => "  " + l),
    ].join("\n");
  }

  // ---------- the match ----------
  async run() {
    for (const p of [0, 1]) {
      if (!this.chars[p]) await this.chooseCharacter(p);
      this.pl[p] = this.makePlayer(p);
      this.bars[p] = { ...this.ch(p).bars };
      if (this.ch(p).forms) { this.form[p] = "elegant"; this.metrics.forms.reached[p].push("elegant"); }
      if (this.ch(p).buffs) this.buff[p] = { break: false, shield: false, last: false };
      if (this.ch(p).gunnerCharges) this.gCharges[p] = this.ch(p).gunnerCharges;
    }
    this.say(`Characters: ${NAME(0)} is ${this.ch(0).name}, ${NAME(1)} is ${this.ch(1).name}.`);
    for (const p of [0, 1]) await this.setup(p);
    while (this.winner === null && !this.over && this.round <= this.maxRounds) {
      const prev = this.bars.map(b => [b.break, b.shield, b.last]);
      await this.turn();
      const damaged = this.bars.some((b, i) => b.break < prev[i][0] || b.shield < prev[i][1] || b.last < prev[i][2]);
      this.noDamageRun = damaged ? 0 : this.noDamageRun + 1;
      this.metrics.longestNoDamageRun = Math.max(this.metrics.longestNoDamageRun, this.noDamageRun);
      if (this.winner === null && !this.over) this.round++;
    }
    this.over = true;
    if (this.winner === null && !this.endReason) this.endReason = `round limit (${this.maxRounds}) reached`;
    return this.result();
  }

  async chooseCharacter(p) {
    const keys = Object.keys(CHARACTERS);
    const res = await this.ask(p, {
      kind: "character",
      prompt: `BEFORE THE MATCH: choose your character. ${keys.map(k => charText(CHARACTERS[k])).join(" | ")}`,
      legal: keys.map(k => `character ${k}`),
      parse: str => { const t = str.trim().toLowerCase().split(/\s+/); return t[0] === "character" && t.length === 2 && CHARACTERS[t[1]] ? { ok: true, value: t[1] } : { ok: false, error: `Use: character ${keys.join(" | ")}.` }; },
    });
    this.chars[p] = res.value;
  }

  async setup(p) {
    const P = this.pl[p], C = SETTINGS.cards;
    const W = this.ch(p).weakPoints;
    const h = await this.ask(p, {
      kind: "setup-weak",
      prompt: `SETUP: secretly choose your weak point (${W.join(", ")}). It is placed face down for the whole match; if the opponent ever empties your Last bar they name one weak point, and if it matches yours they win. Then you draw your starting hand of ${C.handSize} cards.`,
      legal: W.map(w => `weak ${w.toLowerCase()}`),
      parse: str => { const t = str.trim().toLowerCase().split(/\s+/), w = W.find(x => x.toLowerCase() === t[1]); return t[0] === "weak" && t.length === 2 && w ? { ok: true, value: w } : { ok: false, error: `Use: weak ${W.map(x => x.toLowerCase()).join(" | ")}.` }; },
    });
    P.weak = h.value;
    P.hand.push(...P.deck.splice(0, C.handSize));
    this.say(`Your weak point is ${P.weak}. You draw your starting hand: ${P.hand.map(cardStr).join(", ")}.`, [p]);
    this.say(`${NAME(p)} places their weak point face down and draws ${C.handSize} cards.`, [1 - p]);
    const d = await this.ask(p, {
      kind: "setup-discard",
      prompt: `SETUP (mulligan, compulsory): choose one card from your hand to discard; then you draw 1 card. Your hand: ${P.hand.map((c, i) => `${i + 1}:${c}`).join("  ")}.`,
      legal: [`discard <hand position 1-${P.hand.length}>`],
      parse: str => { const t = str.trim().toLowerCase().split(/\s+/), n = Number(t[1]); return t[0] === "discard" && t.length === 2 && Number.isInteger(n) && n >= 1 && n <= P.hand.length ? { ok: true, value: n - 1 } : { ok: false, error: `Use: discard <hand position 1-${P.hand.length}>.` }; },
    });
    const [gone] = P.hand.splice(d.value, 1); P.discard.push(gone);
    const drawn = P.deck.splice(0, C.setupDiscardDraw); P.hand.push(...drawn);
    this.say(`You discard a ${cardStr(gone)} and draw a ${drawn.map(cardStr).join(", ")}.`, [p]);
    this.say(`${NAME(p)} discards a ${cardStr(gone)} and draws a card.`, [1 - p]);
  }

  duelDecision(p) {
    const P = this.pl[p], legal = [];
    if (this.allowed("basic", p)) legal.push(`basic   (card effect, win, lose or tie: after the result you swap one hand card with one card from your own discard pile)`);
    if (this.allowed("heavy", p)) legal.push(`heavy   (card effect, win, lose or tie: after the result you discard one hand card, then draw 1)`);
    if (this.allowed("block", p)) legal.push(`block   (Block draws 1 card from your deck; if Block beats a Basic it deals 1 die of damage${this.barFull(p) ? ` (your ${this.currentBar(p)} bar is full, so no regain)` : ` and you regain ${this.ch(p).blockRegain}`})`);
    if (this.canChain(p)) {
      legal.push(`chain new <hand positions...>   (3 or more cards, all of the same number or in a row; instead of a move${P.hand.includes(0) ? `; a Joker (J) counts as whatever number makes it legal — add "run" or "set" at the end if it could be either` : ""})`);
      if (this.chains[p].length) legal.push(`chain add <your chain number> <hand positions...>   (1 or more cards that keep that chain one same-number chain or one run; instead of a move)`);
    }
    const onlyBlock = legal.length === 1;
    const parse = s => {
      const t = s.trim().toLowerCase().split(/\s+/), err = e => ({ ok: false, error: e });
      const pos = x => { const n = Number(x); return Number.isInteger(n) && n >= 1 && n <= P.hand.length ? n - 1 : null; };
      if (t[0] === "chain") {
        if (!this.canChain(p)) return err("You can't play a chain now (the opponent's Break must be 0 and their Shield still up, or their Last must have been 0 since last round for a Killing Blow chain; and you need a legal play).");
        if (t[1] === "new") {
          const want = { run: "run", set: "same" }[t[t.length - 1]] || null, idx = t.slice(2, want ? -1 : undefined).map(pos);   // Jokers: "... run" / "... set"
          if (idx.some(i => i === null) || new Set(idx).size !== idx.length) return err("Give distinct hand positions.");
          if (!this.chainOptions(p, idx, want).some(o => o.type === "new")) return err("Those cards are not a legal new chain (3 or more cards, all of the same number or in a row).");
          return { ok: true, value: { type: "chain", idx, opt: { type: "new", ...(want ? { want } : {}) } } };
        }
        if (t[1] === "add") {
          const ci = Number(t[2]) - 1, idx = t.slice(3).map(pos);
          if (!idx.length || idx.some(i => i === null) || new Set(idx).size !== idx.length || !this.chains[p][ci]) return err("Use: chain add <your chain number> <distinct hand positions...>.");
          if (!this.chainOptions(p, idx).some(o => o.type === "add" && o.ci === ci)) return err("Those cards do not keep that chain one same-number chain or one run.");
          return { ok: true, value: { type: "chain", idx, opt: { type: "add", ci } } };
        }
        return err("Use \"chain new ...\" or \"chain add ...\".");
      }
      const key = t[0];
      if (!MOVES.includes(key)) return err("Unknown action. Pick one of the legal actions.");
      if (this.isFrozen(p, key) && !this.allowed(key, p)) return err(`${SETTINGS.moves[key].name} is frozen this round.`);
      if (!this.canPick(key, p)) return err(key === "basic" ? "Basic needs a card in your hand and a card in your discard pile." : "Heavy needs a card in your hand.");
      return t.length === 1 ? { ok: true, value: { type: "move", key } } : err(`Just "${key}" (you choose its cards after the result).`);
    };
    if (this.kbReady[p]) this.metrics.kb.noChainRounds[p] += this.canChain(p) ? 0 : 1;
    return { kind: "duel", onlyBlock, kb: this.kbReady[p] && this.canChain(p), prompt: `DUEL: choose your action in secret (the opponent does not see it until both are revealed).${this.kbReady[p] ? (this.canChain(p) ? " KILLING BLOW: the opponent's Last is 0, so a chain you play now is a Killing Blow chain (if it lands, you name their weak point)." : " KILLING BLOW: the opponent's Last is 0, but you have no chain to play this round.") : ""}${MOVES.some(k => this.isFrozen(p, k)) ? ` FROZEN: you can't use ${MOVES.filter(k => this.isFrozen(p, k)).map(k => SETTINGS.moves[k].name).join(" or ")} this round${MOVES.some(k => this.isFrozen(p, k) && this.allowed(k, p)) ? " (Block is your only move, so you may still Block)" : ""}.` : ""}${MOVES.some(k => this.fire[p][k]) ? ` FIRE: picking ${MOVES.filter(k => this.fire[p][k]).map(k => `${SETTINGS.moves[k].name} costs you ${this.fire[p][k]}`).join(", ")} damage on your current bar (win, lose or tie).` : ""}${this.power[p] ? ` POWER: you roll ${this.power[p]} extra d6 on every duel hit.` : ""}${onlyBlock ? " You can only Block." : ""}${this.extraDie[p] ? ` CAVALRYMAN: you roll one extra die on every duel hit${this.bars[p].shield === 0 ? (this.extraDie[p] === "before" ? ", doubled by the comeback (Basic 4, Heavy 6, Block's hit 4)" : ", added after the comeback double (Basic 3, Heavy 5, Block's hit 3)") : " (Basic 2, Heavy 3, Block's hit 2)"}.` : ""}${this.extraDie[1 - p] ? " The opponent (Cavalryman) rolls an extra die on every duel hit." : ""}${this.breakCut[p] ? ` Your maximum Break is lowered to ${this.max(p, "break")}.` : ""}${this.breakCut[1 - p] ? ` The opponent's maximum Break is lowered to ${this.max(1 - p, "break")}.` : ""}${this.bars[p].shield === 0 && !this.extraDie[p] ? (this.form[p] === "demonic" ? " DEMONIC form: your duel damage dice are tripled (Basic 3, Heavy 6, Block's hit 3)." : " Comeback: your Shield is empty, so your duel damage dice are doubled (Basic 2, Heavy 4, Block's hit 2).") : ""}${this.bars[1 - p].shield === 0 ? " The opponent's Shield is empty, so their duel damage dice are doubled." : ""}`, legal, parse };
  }

  async turn() {
    let a, b, replayed = false;
    const lastBefore = this.bars.map(x => x.last);
    // Rules 1.40: the player who landed the last duel hit picks first (Player 1 until anyone has); if they play a chain, the other makes
    // no choice that round; if the second player plays a chain, the first player's secret pick is cancelled
    const first = this.lastHitter ?? 0, second = 1 - first;
    while (true) {
      const picks = [null, null];
      const df = this.duelDecision(first);
      if (df.onlyBlock) this.metrics.onlyBlockRounds[first]++;
      picks[first] = await this.ask(first, df);
      this.noteKey(first, picks[first]);
      if (picks[first].value.type !== "move") { this.repMove = null; this.repCount = 0; await this.special(first, picks[first].value); return this.endOfChainRound(lastBefore); }
      const ds = this.duelDecision(second);
      if (ds.onlyBlock) this.metrics.onlyBlockRounds[second]++;
      picks[second] = await this.ask(second, ds);
      this.noteKey(second, picks[second]);
      if (picks[second].value.type !== "move") { this.repMove = null; this.repCount = 0; this.say(`${NAME(second)} acts instead of a move, so ${NAME(first)}'s secret pick is cancelled.`); await this.special(second, picks[second].value); return this.endOfChainRound(lastBefore); }
      [a, b] = picks;
      // Sci-fi Gunner: a charge can replay a revealed duel round (once per round): both players pick again
      if (replayed || !(await this.offerReplay([a.value.key, b.value.key]))) break;
      replayed = true;
    }
    const deckOut = await this.resolveDuel([a.value, b.value]);
    for (const p of [0, 1]) await this.cardEffect(p, [a.value, b.value][p].key, deckOut);
    for (const p of [0, 1]) for (const k of MOVES) if (this.frozen[p][k] > 0) this.frozen[p][k]--;   // a Freeze lasts its duel rounds
    this.poisonTick();                                   // end of the round: poison and burn, before the Killing Blow check
    this.burnTick();
    // the Killing Blow comes first: whoever emptied the opponent's Last bar this round names a number now
    if (this.winner === null && deckOut.length) this.deckOut(deckOut);
    this.updateKB();
    // draw by repetition (checked after any deck-out loss)
    const [ka, kb] = [a.value.key, b.value.key];
    if (ka === kb) { this.repCount = this.repMove === ka ? this.repCount + 1 : 1; this.repMove = ka; }
    else { this.repMove = null; this.repCount = 0; }
    if (this.winner === null && !this.over && SETTINGS.repetitionDraw && this.repCount >= SETTINGS.repetitionDraw) {
      this.over = true; this.endReason = `draw by repetition (${SETTINGS.repetitionDraw} rounds of ${SETTINGS.moves[ka].name} vs ${SETTINGS.moves[ka].name})`;
      this.say(`Both players picked ${SETTINGS.moves[ka].name} for ${SETTINGS.repetitionDraw} rounds in a row: the match is a draw by repetition.`);
    } else if (this.repCount) this.say(`Draw-by-repetition count: ${this.repCount} of ${SETTINGS.repetitionDraw} (${SETTINGS.moves[ka].name} vs ${SETTINGS.moves[ka].name}).`);
  }
  // A round where a chain was played: poison at the end, then any Killing Blow it started
  async endOfChainRound(lastBefore) {
    this.poisonTick();
    this.burnTick();
    this.updateKB();
  }
  // Rules 1.39: at the end of every round, a player whose opponent's Last is 0 may make a Killing Blow chain from the next round on
  // (instead of a move), every round while it stays 0
  updateKB() {
    for (const p of [0, 1]) {
      const open = this.winner === null && !this.over && this.bars[1 - p].last === 0;
      if (open && !this.kbReady[p]) {
        this.metrics.kb.opened[p]++;
        this.say(`${NAME(p)} can make a Killing Blow from next round: play a chain (new from hand, or added to one of theirs) instead of a move, every round while ${NAME(1 - p)}'s Last is 0. ${NAME(1 - p)} can stop it like any chain.`);
      }
      this.kbReady[p] = open;
    }
  }
  // Burn: at the end of every round it deals its value like poison (Break; once Break is 0, the Shield; once the Shield is gone, Last;
  // leftover lost), then drops by 1
  burnTick() {
    this._burnTick(); this.updateForms();
  }
  _burnTick() {
    for (const p of [0, 1]) {
      const n = this.burn[p]; if (!n || this.winner !== null || this.over) continue;
      const B = this.bars[p], bar = B.shield === 0 ? "last" : B.break > 0 ? "break" : "shield", dmg = Math.min(n, B[bar]);
      B[bar] -= dmg; this.burn[p] = n - 1; this.metrics.spells.burnDamage[1 - p] += dmg;
      let text = `Burn: ${NAME(p)} takes ${dmg} damage to their ${bar}${dmg < n ? ` (${bar} ${dmg ? "only had " + dmg : "was already empty"})` : ""}; burn is now ${this.burn[p]}.`;
      if (bar === "break" && dmg && B.break === 0) text += ` ${NAME(p)} is Broken.`;
      if (bar === "shield" && dmg && B.shield === 0) { text += ` ${NAME(p)}'s Shield is gone: final stage.`; this.stages.shieldGone[p] = true;
        if (this.metrics.attacksToEmptyShield[p] === null) this.metrics.attacksToEmptyShield[p] = this.metrics.attacksOn[p]; this.metrics.spells.burnShields[1 - p]++; }
      if (bar === "last" && dmg && B.last === 0) { text += ` ${NAME(p)}'s Last bar is empty: ${NAME(1 - p)} can try a Killing Blow with a chain from next round.`; this.metrics.spells.burnKBs[1 - p]++; }
      this.say(text);
    }
  }
  // Mage spells: cast by every chain play, once the opponent has stopped it or let it land
  async spellOnStop(att, ch) {
    const vals0 = c => c.kind === "joker";
    const def = 1 - att, S = this.metrics.spells, n = ch.cards.length, on = this.ch(att).spells;
    const has = k => on === true || !!(on && on[k]);          // spells: true, or { freeze, fire, power } (test characters)
    const pickMove = async (kind, text) => (await this.ask(att, {
      kind, prompt: text, legal: MOVES.map(k => `${kind} ${k}`),
      parse: str => { const t = str.trim().toLowerCase().split(/\s+/); return t[0] === kind && t.length === 2 && MOVES.includes(t[1]) ? { ok: true, value: t[1] } : { ok: false, error: `Use: ${kind} basic | heavy | block.` }; },
    })).value;
    if (vals0(ch)) { S.jokerSets[att]++; }
    if (ch.kind !== "run") {   // a same-number chain or a Joker set
      if (!has("freeze")) return;
      const rounds = n >= 4 ? 2 : 1;
      S.freeze[att]++; if (rounds === 2) S.freeze2[att]++;
      const k = await pickMove("freeze", `SPELL — FREEZE: your chain of ${n} casts Freeze, so choose one of ${NAME(def)}'s moves: they can't use it for their next ${rounds} duel round${rounds > 1 ? "s" : ""} (if that leaves them no move, they may still Block).`);
      this.frozen[def][k] = Math.max(this.frozen[def][k] || 0, rounds); S.frozeMove[att][k] = (S.frozeMove[att][k] || 0) + 1;
      if (this.canPick(k, def)) S.freezeBit[att]++;      // they froze a move they could have used
      this.say(`Spell — Freeze: ${NAME(att)} freezes ${NAME(def)}'s ${SETTINGS.moves[k].name} for their next ${rounds} duel round${rounds > 1 ? "s" : ""}.`);
    } else {
      if (!has("fire")) return;
      const add = n - 2;
      const k = await pickMove("fire", `SPELL — FIRE: your run of ${n} puts ${add} fire stack${add > 1 ? "s" : ""} on one of ${NAME(def)}'s moves (they add up and never go away; every duel round they pick that move, they take damage equal to its stacks on their current bar). Choose the move.`);
      this.fire[def][k] += add; S.fire[att]++; S.fireAdded[att] += add; S.fireMove[att][k] = (S.fireMove[att][k] || 0) + add;
      this.say(`Spell — Fire: ${NAME(att)} puts ${add} fire stack${add > 1 ? "s" : ""} on ${NAME(def)}'s ${SETTINGS.moves[k].name} (now ${this.fire[def][k]}).`);
    }
  }
  frozenText(p) { const f = MOVES.filter(k => this.isFrozen(p, k)); return f.length ? f.map(k => `${SETTINGS.moves[k].name} ${this.frozen[p][k]}`).join(", ") : "none"; }
  fireText(p) { const f = MOVES.filter(k => this.fire[p][k]); return f.length ? f.map(k => `${SETTINGS.moves[k].name} ${this.fire[p][k]}`).join(", ") : "none"; }
  noteKey(p, res) {
    const v = res.value;
    if (v.type === "chain") this.keyDecisions.push({ round: this.round, player: p, kind: v.opt.type === "new" ? "start chain" : "extend chain", action: res.action, reason: res.reason || "" });
  }
  deckOut(players) {
    if (players.length === 2) { this.over = true; this.endReason = "both decks ran out in the same round (no winner)"; this.say("Both decks have run out: the match ends with no winner."); return; }
    const p = players[0];
    this.winner = 1 - p; this.endReason = `${NAME(p)}'s deck ran out`;
    this.say(`${NAME(p)}'s deck has run out: ${NAME(p)} loses the match.`);
  }

  // returns the players whose deck reached 0 this round
  // ---------- Sci-fi Gunner's charges ----------
  // A revealed duel round: each Gunner with a charge left may replay it. Returns true if the round is replayed.
  async offerReplay(keys) {
    const M = SETTINGS.moves;
    for (const g of [0, 1]) {
      if (!this.gCharges[g]) continue;
      const q = 1 - g, w = keys[0] === keys[1] ? null : (M[keys[0]].beats === keys[1] ? 0 : 1);
      const res = await this.ask(g, { kind: "replay", ctx: { mine: keys[g], theirs: keys[q], winner: w === null ? "tie" : w === g ? "me" : "them" },
        prompt: `GUNNER CHARGE (${this.gCharges[g]} left): the round is revealed — you played ${M[keys[g]].name}, the opponent played ${M[keys[q]].name} (${w === null ? "a tie" : w === g ? "you win it" : "they win it"}). Spend a charge to replay the round (both players pick again, nothing happens), or keep it?`,
        legal: ["replay", "keep"], parse: t => ["replay", "keep"].includes(t.trim().toLowerCase()) ? { ok: true, value: t.trim().toLowerCase() } : { ok: false, error: "Use \"replay\" or \"keep\"." } });
      if (res.value === "replay") {
        this.gCharges[g]--; this.metrics.gunner.replays[g]++;
        this.keyDecisions.push({ round: this.round, player: g, kind: "gunner replay", action: `${keys[0]} vs ${keys[1]}`, reason: res.reason || "" });
        this.say(`${NAME(g)} spends a Gunner charge (${this.gCharges[g]} left): ${M[keys[0]].name} vs ${M[keys[1]].name} is cancelled and the round is replayed.`);
        return true;
      }
    }
    return false;
  }
  // A roll of dice (kind: "duel", "charge die" or "escape"; roller = who rolled it): a Gunner with a charge left may re-roll the whole roll
  // once. ctx describes what the roll does. Returns the dice that stand.
  async offerReroll(kind, roller, rolls, sides, ctx = {}) {
    for (const g of [0, 1]) {
      if (!this.gCharges[g]) continue;
      const own = roller === g;
      const res = await this.ask(g, { kind: "reroll", ctx: { ...ctx, kind, own, rolls, sides },
        prompt: `GUNNER CHARGE (${this.gCharges[g]} left): ${own ? "your" : "the opponent's"} ${kind === "duel" ? "duel damage" : kind === "charge die" ? "charge die" : "escape dice"} roll is d${sides}: ${rolls.join(", ")}. Spend a charge to re-roll the whole roll (once), or keep it?`,
        legal: ["reroll", "keep"], parse: t => ["reroll", "keep"].includes(t.trim().toLowerCase()) ? { ok: true, value: t.trim().toLowerCase() } : { ok: false, error: "Use \"reroll\" or \"keep\"." } });
      if (res.value === "reroll") {
        const key = `${own ? "own" : "their"} ${kind}`, R = this.metrics.gunner.rerolls[g];
        this.gCharges[g]--; R[key] = (R[key] || 0) + 1;
        const fresh = this.roll(rolls.length, sides);
        this.keyDecisions.push({ round: this.round, player: g, kind: "gunner reroll", action: `${key}: ${rolls.join(",")} -> ${fresh.join(",")}`, reason: res.reason || "" });
        this.say(`${NAME(g)} spends a Gunner charge (${this.gCharges[g]} left) to re-roll ${own ? "their own" : `${NAME(roller)}'s`} ${kind} roll: ${rolls.join(", ")} → ${fresh.join(", ")}.`);
        return fresh;
      }
    }
    return rolls;
  }

  async resolveDuel(mv) {
    const [a, b] = mv.map(m => m.key), M = SETTINGS.moves, B = this.bars;
    let text, vampGrow = null;
    if (a === b) text = `${NAME(0)} and ${NAME(1)} both played ${M[a].name}: nothing happens.`;
    else {

  // Basic / Heavy card effects, chosen after the result (Block's draw already happened in resolveDuel)

  async special(p, v) { return this.chainScene(p, v); }

  async function beat() { const ms = G && G.beat ? G.beat - performance.now() : 0; if (G) G.beat = 0; if (ms > 0 && speed > 0) await sleep(ms); }

  // The sounds of one sentence of the engine, timed with what animate() and the scenes show (ms from now; t is the speed).
  // The scenes (dice, CHAIN BROKEN, CHAIN STOPPED, the Killing Blow, a change of form) play their own sounds.
  function eventSounds(raw, prev, now, major, changed) {
    G.sfxShift = 0;
    if (G.skip || !(speed > 0) || !SND.on) return;
    const t = speed, q = [], add = (id, ms = 0, voiced = false) => q.push([id, ms, voiced]);
    const lost = (p, b) => prev ? prev.bars[p][b] - now.bars[p][b] : 0;
    let lead = false, noShift = false, m;      // lead: a big sound leads this moment, so no stage-change sound on top of it
    // the bars after a hit at `at`: one sound for the hurt, then one for the bar (the biggest news only)
    const bars = (at, small) => [0, 1].forEach(p => {
      const dB = lost(p, 'break'), dS = lost(p, 'shield'), dL = lost(p, 'last'), B = now.bars[p];
      if (!(dB > 0 || dS > 0 || dL > 0)) return;
      const big = dL > 0 && B.last === 0 ? 'last-empty' : dS > 0 ? (B.shield === 0 ? 'shield-empty' : 'shield-hit') : dB > 0 && B.break === 0 ? 'break-empty' : null;
      if (!small) add('hurt', at + 80);
      if (big || !small) add(big || 'damage-number', at + 220);
      if (dS > 0 && B.shield === 0 && !now.form[p]) add('comeback', at + 1000);      // from now on this player rolls double dice (the Demon turns Demonic instead)
    });
    if ((m = raw.match(/^Player 1 played (\w+), Player 2 played (\w+)\. Player (\d) wins/))) {
      const mv = m[3] === '1' ? m[1] : m[2], hit = (mv === 'Block' ? 900 : 360) * t;
      add('reveal'); lead = true;
      if (mv === 'Block') add('block-counter', Math.max(120, hit - 130));      // the clang, then the hit back lands with the strike
      else { add('lunge', 200 * t); add(mv === 'Heavy' ? 'heavy-hit' : 'basic-hit', hit); }
      bars(hit);
      if (/Block also regains/.test(raw)) add('heal', hit + 450);
      if (/ Fire: Player \d's/.test(raw)) add('fire-burn', hit + 620);
    } else if ((m = raw.match(/^Player 1 and Player 2 both played (\w+)/))) {
      add('reveal'); lead = true; if (m[1] !== 'Block') add('lunge', 200 * t);
      add('tie', 420 * t);
      if (/ Fire: Player \d's/.test(raw)) { add('fire-burn', 420 * t + 260); bars(420 * t + 260); }
    } else if ((m = raw.match(/^Player (\d) attacks, spending/))) {
      const hit = 360 * t;
      add('charge-attack', Math.max(0, hit - 360));      // the charge-up ends in the blast, on the hit
      bars(hit);
      if (lost(2 - m[1], 'break') < 0) add('break-refill', hit + 720);
    } else if (/^Player \d's Killing Blow chain landed/.test(raw)) lead = true;      // (kbIntro)
    else if (/the chaining breaks|stops the chaining/.test(raw) || FORM_EVT.test(raw)) lead = true;      // (breakScene, stopScene, formScene)
    else if ((m = raw.match(/^Player \d names \w+: (it is|wrong)/))) { add(m[1] === 'wrong' ? 'kb-wrong' : 'kb-right', 0, true); lead = true; }      // (only when the scene was hurried away)
    else if ((m = raw.match(/^Player \d (plays a new chain|adds .* to chain)/))) {
      const kb = !!G.events[0] && /^It is a KILLING BLOW chain/.test(G.events[0].raw);
      add(kb ? 'kb-chain' : m[1] === 'plays a new chain' ? 'chain-new' : 'chain-add'); if (kb) lead = true;
      if (/ONE JOKER FROM WINNING THE MATCH/.test(raw)) add('joker-warning', kb ? 900 : 450);
    } else if (/'s chain of \d+ poisons/.test(raw)) add('poison-applied', 380);      // told just before the chain itself: heard just after it
    else if ((m = raw.match(/^(Poison|Burn): Player \d takes (\d+) damage/))) { if (m[2] !== '0') { add(m[1] === 'Poison' ? 'poison-tick' : 'fire-burn'); bars(0, true); } }
    else if (/^Spell — Freeze/.test(raw)) add('freeze', 0, true);
    else if (/^Spell — Fire/.test(raw)) add('fire', 0, true);
    else if (/^Spell — Power/.test(raw)) add('power');
    else if (/^Spell — FIVE JOKERS/.test(raw)) { add('five-jokers', 0, true); lead = true; }
    else if (/is complete: it leaves the table/.test(raw)) { add('chain-complete'); add('shuffle-back', 380); }
    else if (/^Player \d (lets it land|can't stop it)/.test(raw)) add('chain-lands');
    else if (/^Player \d charges: d/.test(raw)) { add('charge-die', changed ? 90 : 0); noShift = true; }      // (the dice are already rolling)
    else if (/banks the full pool/.test(raw)) { add('bank'); add('break-refill', 450); }
    else if ((m = raw.match(/^Vampire: Player \d unlocks the (\w+) buff/))) { add('vampire-buff'); if (m[1] === 'LAST') add('vampire-knows', 420); }
    else if (/^Vampire's Break buff: /.test(raw)) add('vampire-heal');
    else if (/^Cavalryman: .* maximum Break drops/.test(raw)) add('cavalry-cut');
    else if (/^Cavalryman: .* gains an extra die/.test(raw)) add('cavalry-die');
    else if (/is cancelled and the round is replayed/.test(raw)) add('gunner-replay');
    else if (/spends a Gunner charge .* to re-roll/.test(raw)) add('gunner-reroll');
    else if (/^Player 2 can make a Killing Blow from next round/.test(raw)) add('kb-danger', Math.max(0, 700 - sfxSince('last-empty')));
    else if ((m = raw.match(/^Draw-by-repetition count: (\d+) of (\d+)/))) { if (Number(m[1]) === Number(m[2]) - 1) add('repetition-warning'); }
    else if (/deck has run out|Both decks have run out/.test(raw)) { add('deck-out'); lead = true; }
    else if (/^You draw your starting hand|^Your weak point is/.test(raw)) add('draw', 260);      // (your weak-point sound came with your click)
    else if (/^You draw a |^Player 2 draws a card/.test(raw)) add('draw');
    else if (/^Player 2 places their weak point/.test(raw)) add('weak-point');
    else if (/^You discard a .* and draw a |^Player 2 discards a .* and draws a card/.test(raw)) add('mulligan');
    else if (/'s Heavy: they discard/.test(raw)) add('discard');
    else if (/'s Basic: they swap/.test(raw)) add('basic-swap');
    if (prev && prev.deck[0] > 3 && now.deck[0] <= 3 && now.deck[0] > 0) add('deck-low', 320);      // your deck: 3 cards or fewer left
    let shift = 0; const at = performance.now();
    if (changed && !lead) { sfx('stage-change', { gap: 450 }); if (!noShift) shift = G.sfxShift = 170; }      // the moment track moved: its sound first, the rest just after
    if (!major && q.length && !noShift) {      // small events come in a burst: heard one after the other (and dropped rather than heard late)
      shift = Math.max(shift, (G.minorAt || 0) - at);
      if (shift > 450 && q.every(c => ['draw', 'discard', 'basic-swap', 'mulligan'].includes(c[0]))) return;
      G.minorAt = at + shift + 110;
    }
    q.forEach(([id, ms, voiced]) => { cue(id, shift + ms, voiced); G.cueEnd = Math.max(G.cueEnd || 0, at + shift + ms); });
  }

  class ArenaMatch extends Match {
    say(text, who = [0, 1]) {
      super.say(text, who);
      if (G && G.match === this && who.includes(0)) G.events.push({ raw: text, snap: snapshot(this) });
    }
  }

  function snapshot(m) {
    const P = m.pl;
    return {
      round: m.round, over: m.over, winner: m.winner, endReason: m.endReason, chars: [...m.chars],
      bars: m.bars.map(b => ({ ...b })), max: [0, 1].map(p => ({ break: m.max(p, 'break'), shield: m.max(p, 'shield'), last: m.max(p, 'last') })),
      hand: P[0].hand.slice(), oppHand: P[1].hand.length, deck: [P[0].deck.length, P[1].deck.length],
      jokersLeft: [0, 1].map(p => P[p].deck.filter(c => c === 0).length),
      discard: [P[0].discard.slice(), P[1].discard.slice()], weak: P[0].weak,
      chains: m.chains.map((cs, p) => cs.map(c => ({ cards: c.cards.slice(), kind: c.kind, jokers: c.jokers || 0, chained: c.chained, oneAway: m.oneAway(c, p), complete: m.isComplete(c, p) }))),
      d8: m.d8.map(x => x.slice()), poison: [...m.poison], burn: [...m.burn],
      frozen: m.frozen.map(f => ({ ...f })), fire: m.fire.map(f => ({ ...f })), power: [...m.power], form: [...m.form],
      buff: m.buff.map(b => b ? { ...b } : null), breakCut: [...m.breakCut], extraDie: [...m.extraDie], gCharges: [...m.gCharges],
      rep: { count: m.repCount, move: m.repMove },
      sides: [0, 1].map(p => Object.fromEntries(DICE.map(k => [k, m.sides(p, k)]))),
      wrong: [0, 1].map(p => m.metrics.killingBlowAttempts.filter(k => k.player === p).map(k => k.named)),
      knowsWeak: m.buff[0] && m.buff[0].last ? P[1].weak : null,
      kbReady: [...(m.kbReady || [false, false])],      // who may try a Killing Blow chain this round
      canPlay: !!(P[0].hand.length && m.findChainPlay(0)),      // you hold a legal chain play (the engine's own search)
      maxRounds: m.maxRounds,
    };
  }

  const nameOf = p => {
    const k = G.chars[p], n = CHARACTERS[k].name;
    return G.chars[0] === G.chars[1] ? `${n} (${p === 0 ? 'you' : 'computer'})` : n;
  };
  // the engine says "Player 1" / "Player 2"; the screen says the characters' names
  const tell = t => t.replace(/Player 1/g, nameOf(0)).replace(/Player 2/g, nameOf(1));

  async function startMatch(mine, theirs) {
    const my = ++nav; screen = 'match';
    await Promise.all([loadArt(mine), loadArt(theirs)]);
    if (nav !== my) return;                          // another screen was opened while the art loaded
    const bot = pickBot();                         // a tournament bot, by the difficulty setting
    G = { chars: [mine, theirs], bot, level, events: [], log: [], mode: 'duel', picks: [], extra: null, lastMoves: [null, null], token: {}, formNow: [null, null] };
    const token = G.token;
    music('battle', { fade: 800 }); G.finalMusic = false;
    G.match = new ArenaMatch({ ask, maxRounds: 60, characters: [mine, theirs] });
    buildArena();
    one('#log').innerHTML = '';
    const result = await G.match.run().catch(e => { console.error(e); return { winner: null, endReason: 'error: ' + e.message }; });
    if (G.token !== token) return;     // a new match was started meanwhile
    await beat();
    await playEvents();
    if (G.token !== token || !one('#arena')) return;
    showEnd(result);
  }

  /* ---------------- answering the engine ---------------- */
  async function ask(p, d) {
    const token = G.token;
    if (p === 1) {                                   // the computer: a tournament bot
      const tries = botAnswer(G.bot, G.match, 1, d, Math.random);
      for (const t of tries) { const r = d.parse(t); if (r.ok) { if (d.kind === 'duel' && r.value.type === 'move') G.lastMoves[1] = r.value.key; return { ...r, action: t }; } }
      for (const t of d.legal) { const r = d.parse(t.split(/\s{2,}|\s+\(/)[0]); if (r.ok) return { ...r, action: t }; }
      throw new Error(`the computer had no legal answer for ${d.kind}`);
    }
    await beat();
    await playEvents();
    if (G.token !== token) return new Promise(() => {});     // abandoned match: never answer
    return decide(d);
  }

  /* ---------------- playing back what happened ---------------- */
  function modeForText(t) {
    if (/Killing Blow|names (Head|Heart|Throat)/.test(t)) return 'kb';
    if (/charges: d|attacks, spending|banks the full pool|chaining breaks|rerolls \d|keeps all: d|pool can hold|'s d\d+ now/.test(t)) return 'charge';
    if (/chain|Spell|poisons|Joker set|JOKER/.test(t)) return 'chain';
    return 'duel';
  }
  // One beat per round: only the big moments (the duel result, a chain, a spell, an attack, a Killing Blow, the end) get a scene;
  // small events (draws, swaps, discards, rolls, counts) just update the screen and the log, with no pause.
  const MAJOR = /played \w+, Player \d played|both played|plays a new chain|adds .* to chain|Spell|attacks, spending|banks the full pool|chaining breaks|is complete|Killing Blow|names (Head|Heart|Throat)|wins the match|ran out|draw by repetition|Gunner charge|unlocks the|takes (his|her) (WINGED|DEMONIC)|Cavalryman:|lets it land|can't stop it|stops the chaining/;
  // The engine tells what a charge attack caused (the Demon's new form, the Vampire's Shield buff, the Cavalryman's cut) just
  // BEFORE the attack sentence, with the Shield already lowered. On screen the attack is told first, so the Shield bar moves with
  // its own sentence and number; what it caused follows. Nothing is changed in the engine: only the order of telling.
  const PRE_ATTACK = /^Cavalryman: |^Vampire: Player \d unlocks the SHIELD buff|^Player \d's Shield (?:has taken damage|is gone): the Demon takes/;
  const ATTACK = /^Player \d attacks, spending/;
  function attackFirst() {
    const q = G.events; if (!q.length || !PRE_ATTACK.test(q[0].raw)) return;
    let j = 0; while (j < q.length && PRE_ATTACK.test(q[j].raw)) j++;
    if (j >= q.length || !ATTACK.test(q[j].raw)) return;
    const [atk] = q.splice(j, 1);
    for (let i = 0; i < j; i++) q[i] = { ...q[i], snap: atk.snap };
    q.unshift(atk);
  }
  // a hit that is acted out: the bars wait for the strike to land (they used to move as soon as the sentence appeared)
  const HIT = /^Player 1 played \w+, Player 2 played \w+\. Player \d wins|^Player 1 and Player 2 both played|^Player \d attacks, spending|is complete: it leaves the table/;
  const release = () => { if (G.held) { G.held = null; renderGauges(); } };
  // the final-stage music: from the moment either fighter is down to the Last bar (their Shield is 0), until the match ends
  function finalMusic() { if (G && !G.finalMusic && G.view && G.view.bars.some(b => b.shield === 0)) { G.finalMusic = true; music('final', { fade: 1500 }); } }
  async function playEvents() {
    while (G.events.length) {
      if (!one('#arena')) { G.events.length = 0; return; }      // the match was left (New match): nothing to show
      attackFirst();
      const e = G.events.shift(), prev = G.view;
      const text = tell(e.raw), major = MAJOR.test(e.raw);
      const fm = e.raw.match(FORM_EVT); if (fm) G.formNow[fm[1] - 1] = fm[2].toLowerCase();      // the form on screen changes with its own sentence
      noteChain(e.raw);
      // a Killing Blow guess: the scene shows the result first; only then do the log, the bars and the text below tell it
      const kb = !G.skip && !G.kbHurry && speed > 0 && e.raw.match(/^Player (\d) names (\w+): (it is|wrong)/);
      if (kb) {
        await kbReveal(kb[1] - 1, kb[2], kb[3] !== 'wrong', e.snap, () => { addLog(text); setMode('kb'); G.view = e.snap; finalMusic(); renderWatching(text); });
        continue;
      }
      addLog(text);
      const modeWas = G.mode;
      if ((major || ROLLS.test(e.raw)) && !fm) setMode(modeForText(e.raw));      // (a change of form keeps the screen as it is)
      G.view = e.snap; finalMusic();
      G.held = major && prev && speed > 0 && !G.skip && HIT.test(e.raw) ? prev : null;      // the gauges keep the old numbers until the hit lands
      renderWatching(text);
      try { eventSounds(e.raw, prev, e.snap, major, modeWas !== G.mode && modeWas !== 'kb' && G.mode !== 'kb'); } catch (err) { /* a sound never stops the game */ }      // (into and out of the Killing Blow: its own sounds lead)
      if (major) { await animate(e.raw, prev, e.snap); release(); }
      else {
        quickPops(prev, e.snap);
        const ms = rollScene(e.raw, prev, e.snap, G.skip ? 0 : speed);      // a charge die, escape dice, a reroll: a short roll you can see
        if (ms) await sleep(ms); else await tick();
      }
    }
  }
  function quickPops(prev, now) {
    if (!prev) return;
    [0, 1].forEach(p => BAR.forEach(b => { const dlt = now.bars[p][b] - prev.bars[p][b]; if (dlt) popAt(p, (dlt > 0 ? '+' : '') + dlt + ' ' + BAR_NAME[b], dlt > 0); }));
  }
  async function animate(raw, prev, now) {
    const t = G.skip ? 0 : speed;
    const F = G.fighters;
    const pops = () => { if (!prev) return; [0, 1].forEach(p => BAR.forEach(b => { const dlt = now.bars[p][b] - prev.bars[p][b]; if (dlt) popAt(p, (dlt > 0 ? '+' : '') + dlt + ' ' + BAR_NAME[b], dlt > 0); })); };
    let m = raw.match(/^Player 1 played (\w+), Player 2 played (\w+)\. Player (\d) wins/);
    if (m) {
      const w = Number(m[3]) - 1, l = 1 - w, mv = w === 0 ? m[1] : m[2];
      revealMoves(m[1], m[2]);
      const dm = raw.match(/: dice ([\d+]+) = (\d+) damage/);          // the winner's damage dice land just before the hit
      if (dm) showRoll(w, sidesIn(prev, now, w, 'duel'), dm[1].split('+').map(Number), { t, land: mv === 'Block' ? 760 : 300, hold: 1000, total: true, sfxDelay: 120 });
      const hitBy = mv === 'Block' ? F[w].pose('blocking', 700 * t).then(() => F[w].pose('attacking', 800 * t)) : F[w].pose('attacking', 1000 * t);
      await sleep((mv === 'Block' ? 900 : 360) * t);
      G.held = null;
      F[l].pose('hurt', 600 * t); renderGauges(); pops(); lostNote(raw, prev, t);
      await hitBy; await sleep(250 * t); return;
    }
    m = raw.match(/^Player 1 and Player 2 both played (\w+)/);
    if (m) {
      revealMoves(m[1], m[1]);
      const a = m[1] === 'Block' ? 'blocking' : 'attacking';
      await Promise.all([F[0].pose(a, 800 * t), F[1].pose(a, 800 * t)]);
      G.held = null;
      renderGauges(); pops(); await sleep(400 * t); return;
    }
    m = raw.match(/^Player (\d) attacks, spending/);
    if (m) {
      const a = Number(m[1]) - 1;
      const go = F[a].pose('attacking', 1000 * t); await sleep(360 * t);
      G.held = null;
      F[1 - a].pose('hurt', 600 * t); renderGauges(); pops(); lostNote(raw, prev, t); await go; return;
    }
    m = raw.match(/^Player (\d)'s Killing Blow chain landed/);
    if (m) { renderGauges(); if (t > 0) await kbIntro(m[1] - 1); return; }
    if (/is complete: it leaves the table/.test(raw)) { await recycleScene(raw, prev, now, t); return; }
    if (/the chaining breaks/.test(raw)) { renderGauges(); pops(); await breakScene(raw, prev, now, t); return; }
    if (/stops the chaining/.test(raw)) { renderGauges(); pops(); if (!(await stopScene(raw, prev, now, t))) await sleep(550 * t); return; }
    m = raw.match(FORM_EVT);
    if (m) {
      renderGauges(); pops();
      const next = G.events[0] && G.events[0].raw.match(FORM_EVT);      // two forms in one hit: the first one passes quickly
      await formScene(m[1] - 1, m[2].toLowerCase(), now, t, !!(next && next[1] === m[1])); return;
    }
    renderGauges();
    rollScene(raw, prev, now, t);
    if (prev) {
      [0, 1].forEach(p => { if (BAR.some(b => now.bars[p][b] < prev.bars[p][b])) F[p].pose('hurt', 600 * t); });
      pops();
    }
    await sleep((/plays a new chain|adds .* to chain|Spell|Killing Blow|wins the match|names/.test(raw) ? 1000 : 550) * t);
  }
  /* ---------------- the Killing Blow scene ---------------- */
  // A landed Killing Blow chain: the screen goes dark, the two fighters come in, the attacker steps up to the face-down
  // weak-point card (kbIntro). Once a weak point is named the card turns over (kbReveal): right ends the match, wrong and the
  // defender survives. Every word and number comes from the engine's own sentences. A click hurries the scene along.
  const kbArt = (k, action, form) => { const a = ART[k] || {}, src = (a[action] && a[action][0]) || (a.standing && a.standing[0]); return src ? `<img src="${src}" alt="">` : `<canvas width="40" height="48" data-ph="${k}" data-form="${form || ''}"></canvas>`; };
  function kbDraw(el, p, action) {
    const box = one(`.kbfig.p${p} .kbmove`, el); if (!box) return;
    box.innerHTML = kbArt(G.chars[p], action, G.formNow[p]);
    all('canvas[data-ph]', box).forEach(cv => drawPlaceholder(cv, cv.dataset.ph, cv.dataset.form));
  }
  function kbOpen(att, held) {
    const arena = one('#arena'); if (!arena) return null;
    all('.kbscene', arena).forEach(x => x.remove());
    const def = 1 - att, el = document.createElement('div');
    el.className = `kbscene${held ? ' held snap s1 s2 s3' : ''}`; el.setAttribute('role', 'status');
    el.style.setProperty('--t', speed);
    el.innerHTML = `<i class="kbrays"></i><i class="kbar top"></i><i class="kbar bot"><span>Click to skip</span></i>
      ${[0, 1].map(p => `<div class="kbfig p${p} ${p ? 'r' : 'l'} ${p === att ? 'att' : 'def'}"><div class="kbmove"></div><span class="kbname">${esc(nameOf(p))}${p === att ? '' : ' · Last 0'}</span></div>`).join('')}
      <div class="kbtitle"><b>Killing Blow</b><span class="kbsub">${esc(nameOf(att))} strikes at ${esc(nameOf(def))}’s weak point</span></div>
      <div class="kbcard"><div class="kbflip"><span class="kbback"></span><span class="kbfront"><b></b><small></small></span></div></div>
      <span class="kblabel">${esc(nameOf(def))}’s weak point</span><i class="kbflash"></i>`;
    el.onclick = () => { el._hurry = true; G.kbHurry = true; sfxStop('kb-scene'); };
    arena.appendChild(el);
    [0, 1].forEach(p => kbDraw(el, p, 'standing'));
    if (held) { void el.offsetWidth; el.classList.remove('snap'); }       // already in place: no walking in again
    return (G.kbScene = el);
  }
  // a pause inside the scene: Speed fast shortens it; Skip, a click on the scene or a new match end it at once
  async function kbWait(el, ms) {
    const end = performance.now() + ms * speed;
    while (performance.now() < end && !el._hurry && !G.skip && speed > 0 && el.isConnected) await sleep(Math.min(50, end - performance.now()));
  }
  async function kbClose(el) {
    if (G.kbScene === el) G.kbScene = null;
    if (!el.isConnected) return;
    el.classList.add('out');
    if (!el._hurry && !G.skip && speed > 0) await sleep(220 * speed);
    el.remove();
  }
  async function kbIntro(att) {
    G.kbHurry = false;
    const el = kbOpen(att); if (!el) return;
    cue('kb-scene', 0, true);                                 // heartbeats while the fighters come in, then the slam
    await kbWait(el, 250); el.classList.add('s1');            // the fighters come in
    await kbWait(el, 450); el.classList.add('s2');            // the title lands
    await kbWait(el, 650); el.classList.add('s3');            // the attacker steps up; the weak-point card drops, face down
    await kbWait(el, 1050);
    if (att === 0 || el._hurry || !el.isConnected) await kbClose(el);       // your Killing Blow: the screen comes back so you can name the weak point
  }
  async function kbReveal(att, named, hit, snap, apply) {
    const def = 1 - att;
    let el = G.kbScene && G.kbScene.isConnected && !G.kbScene._hurry ? G.kbScene : null;
    if (!el) el = kbOpen(att, true);
    if (!el) { apply(); return; }
    one('.kbsub', el).textContent = `${nameOf(att)} names…`;

  }
  // A hit whose number is bigger than what the bar could lose: say where the rest went (bars never go below 0, nothing carries over).
  // Every number is read from the engine's sentence and from the bars before the hit.
  function lostNote(raw, prev, t) {
    if (!prev || !(t > 0)) return;
    let m = raw.match(/= (\d+) damage to Player (\d)'s (break|last)\./), rolled, p, bar;
    if (m) { rolled = Number(m[1]); p = m[2] - 1; bar = m[3]; }
    else if ((m = raw.match(/: (\d+) - (\d+) = (\d+) damage to Player (\d)'s Shield\./))) {
      rolled = Number(m[3]); p = m[4] - 1; bar = 'shield';
      if (rolled === 0) { noteAt(p, Number(m[1]) > 0 ? `No damage: the escape die (${m[2]}) blocked all ${m[1]}` : 'No damage'); return; }
    } else return;
    const had = prev.bars[p][bar];
    if (rolled > had) noteAt(p, had > 0 ? `${BAR_NAME[bar]} had only ${had} left: the other ${rolled - had} is lost` : `${BAR_NAME[bar]} is already 0: the ${rolled} does nothing`);
  }
  function noteAt(p, text) {
    const arena = one('#arena'), f = G.fighters[p].el, el = document.createElement('div'); if (!arena) return;
    el.className = 'popnote'; el.textContent = text; el.setAttribute('role', 'status');
    el.style.left = Math.max(206, Math.min(1074 - 300, f.offsetLeft + f.offsetWidth / 2 - 150)) + 'px'; el.style.top = (f.offsetTop + 124) + 'px';
    arena.appendChild(el); setTimeout(() => el.remove(), 2400);
  }
  function addLog(text) {
    const li = document.createElement('li'); li.textContent = text; one('#log').appendChild(li);
    G.log.push(text);
  }

  /* ---------------- drawing the arena ---------------- */
  function buildArena() {
    const frame = one('#frame');
    frame.innerHTML = `<div class="scene on" id="arena">
      <div class="stage"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i></div>

        <div class="sprite"><div class="mover"></div></div>

  function setMode(mode) {

  }

  // the special rules in play for one player, as short badges under their bars
  function badges(v, p) {
    const k = v.chars[p], c = CHARACTERS[k], out = [];
    const b = (cls, text, tip) => out.push(`<span class="${cls}" title="${esc(tip || text)}">${esc(text)}</span>`);
    MOVES.forEach(m => { if (v.frozen[p][m] > 0) b('', `${MOVE_NAME[m]} frozen (${v.frozen[p][m]})`, `Freeze: ${MOVE_NAME[m]} can't be picked for ${plural(v.frozen[p][m], 'more duel round')}.`); });
    MOVES.forEach(m => { if (v.fire[p][m] > 0) b('hot', `Fire ×${v.fire[p][m]} on ${MOVE_NAME[m]}`, `Fire: picking ${MOVE_NAME[m]} costs ${v.fire[p][m]} damage on the current bar, win, lose or tie. It never goes away.`); });
    if (v.poison[p]) b('hot', `Poisoned ${v.poison[p]}`, `Poison: ${v.poison[p]} damage at the end of every round (Break, then Shield, then Last).`);
    if (v.burn[p]) b('hot', `Burn ${v.burn[p]}`);
    if (v.power[p]) b('pow', `Power +${v.power[p]} d6`, `Power: ${v.power[p]} extra d6 on every duel hit.`);
    if (c.deck.jokers) b('pow', `${v.jokersLeft[p]} Joker${v.jokersLeft[p] === 1 ? '' : 's'} in deck`);
    if (v.buff[p]) { const on = BAR.filter(x => v.buff[p][x]); b('pow', on.length ? `Buffs: ${on.map(x => BAR_NAME[x]).join(', ')}` : 'No buffs yet', 'Vampire buffs: Break (hits on Break heal him), Shield (duel die d8), Last (knows the weak point).'); }
    if (v.kbReady && v.kbReady[1 - p] && v.bars[p].last === 0) b('hot', p === 0 ? 'Killing Blow danger' : 'Killing Blow chance', p === 0 ? 'Your Last is 0: every round the computer may play a Killing Blow chain. Keep cards to stop it: if it lands, they name your weak point.' : 'Their Last is 0: every round you may play a chain as a Killing Blow. If it lands, you name their weak point.');
    if (v.breakCut[p]) b('hot', `Max Break −${v.breakCut[p]}`, `A Cavalryman lowered this player's maximum Break by ${v.breakCut[p]}.`);
    if (v.extraDie[p]) b('pow', 'Extra die on hits', 'Cavalryman: one extra die on every duel hit.');
    if (c.gunnerCharges) b('pow', `Gunner charges: ${v.gCharges[p]}`, 'Replay a revealed duel round, or re-roll a whole roll of dice.');
    if (c.dice && !v.form[p]) b('', `Dice d${c.dice.duel || 6} / d${c.dice.attack || 8} / d${c.dice.defend || 4}`, 'Duel / charge / escape dice.');
    if (v.bars[p].shield === 0 && !v.form[p]) b('pow', 'Comeback: double dice', 'Shield empty: duel damage dice are doubled.');
    return out.join('');
  }

  function meter(v, p, i) {
    const b = BAR[i], val = v.bars[p][b], max = v.max[p][b], pct = max ? Math.min(100, val / max * 100) : 0;
    const cur = (v.bars[p].shield === 0 ? 2 : 0) === i;
    // a decision that would change this bar (your attack, or theirs): a marker at the value it would fall to
    const pv = G.preview && G.preview.p === p && G.preview.bar === b && G.preview.to !== val ? G.preview : null;
    const mark = pv ? `<i class="pv${max && pv.to / max > .8 ? ' hi' : ''}" style="bottom:${max ? Math.min(100, pv.to / max * 100) : 0}%" data-to="${pv.to}"><b>${pv.to}</b></i>` : '';
    return `<div class="meter${cur ? ' cur' : ''}${val === 0 ? ' empty' : ''}${pv ? ' prev' : ''}" style="--max:${Math.max(1, max)}"${pv ? ` title="${esc(pv.tip)}"` : ''}>
      <span class="val"><b>${val}</b>/${max}</span>
      <div class="tube"><i class="trail" style="height:${pct}%"></i><i class="fill k${i}" style="height:${pct}%"></i><i class="ticks"></i>${mark}</div>
      <span class="name">${BAR_NAME[b]}</span></div>`;
  }
  // the Demon's form in his gauge: its name on a band in the form's colour, three steps (past, now, to come) and the dice he rolls now
  function formBox(v, p, form) {
    const at = FORM_ORDER.indexOf(form), s = diceFor(v.chars[p], form);
    return `<div class="formbox ${form}" title="${esc(formTip(form, s))}"><b>${pic(FORMS[form].art, 2)}<span>${FORMS[form].name}</span><span class="fsteps" aria-label="Form ${at + 1} of 3">${FORM_ORDER.map((f, i) => `<i class="${f}${i <= at ? ' on' : ''}${i === at ? ' now' : ''}"></i>`).join('')}</span></b><small>${esc(formDice(form, s))}</small></div>`;
  }
  const ico = (art, name, tip, right) => `<span class="ico${right ? ' right' : ''}" tabindex="0" role="img" aria-label="${esc(name)}">${pic(art, 2)}<span class="tip"><b>${esc(name)}</b>${tip}</span></span>`;
  // which moves draw from the deck, and how many cards (read from the engine's settings): Block draws, Heavy discards then draws
  const drawsOf = k => { const m = SETTINGS.moves[k]; return (m.draw || 0) + (m.effect === 'cycle' ? 1 : 0); };
  const DRAW_MOVES = MOVES.filter(k => drawsOf(k) > 0);
  const lowDeck = n => n <= SETTINGS.cards.handSize;      // a deck this small is called out (the same mark as the deck-low sound)
  // the deck: always on screen as a number under the bars (it used to be behind an icon)
  function deckChip(v, p) {
    const me = p === 0, n = v.deck[p], k = v.chars[p], jk = CHARACTERS[k].deck.jokers;
    const last = SETTINGS.deckOutLoses && DRAW_MOVES.some(m => drawsOf(m) >= n);
    const tip = `${plural(n, 'card')} left${jk ? `, ${v.jokersLeft[p]} of them Jokers` : ''}. ${SETTINGS.deckOutLoses ? `A deck that reaches 0 loses the match, right after its last card is drawn (${DRAW_MOVES.map(m => MOVE_NAME[m]).join(' and ')} each draw ${drawsOf(DRAW_MOVES[0])}). ` : ''}A completed chain is shuffled back into its builder’s deck.${last ? ` ${me ? 'Your' : 'Their'} next ${DRAW_MOVES.map(m => MOVE_NAME[m]).join(' or ')} draws the last card: ${me ? 'you lose' : 'they lose'}.` : ''}`;
    return `<span class="ico deckchip${last ? ' last' : lowDeck(n) ? ' low' : ''}${me ? '' : ' right'}" tabindex="0" role="img" data-deck="${n}" aria-label="${me ? 'Your' : 'Their'} deck: ${plural(n, 'card')}">${pic('deck', 2)}<b>${n}</b><span class="tip"><b>${me ? 'Your deck' : 'Their deck'}</b>${esc(tip)}</span></span>`;
  }

  /* ---------------- the goal: what you are trying to do right now, beside the moment track ---------------- */
  // Read from one snapshot of the match (the engine's numbers) and the engine's settings; no rule is decided here.
  function objective(v, kind) {
    const me = 0, them = 1, o = v.bars[them], own = v.bars[me], mx = v.max[them], c = CHARACTERS[v.chars[them]], mineC = CHARACTERS[v.chars[me]];
    const L = SETTINGS.chain.minLength, restart = Math.ceil(mx.last * SETTINGS.killingBlow.restartFraction);
    const collect = `collect ${L} of one number or ${L} in a row${v.chains[me].length ? ', or a card that extends one of your chains' : ''}`;
    let step, key, line;
    if (v.over || v.winner !== null) { step = -1; key = 'over'; line = 'The match is over.'; }
    else if (!v.weak) { step = 0; key = 'setup'; line = 'Setup: choose your secret weak point, then swap one card.'; }
    else if (o.last === 0) {
      step = 3;
      if (!v.kbReady[me]) { key = 'kb-next'; line = 'Their Last is 0: from next round, a chain you play is your Killing Blow.'; }
      else if (v.canPlay) { key = 'kb'; line = 'Killing Blow: play a chain now. If it lands, name their weak point to win.'; }
      else { key = 'kb-nochain'; line = `Their Last is 0 but you hold no chain: ${collect} for the Killing Blow.`; }
    } else if (o.shield === 0) { step = 2; key = 'last'; line = `Their Shield is gone: win duel rounds to empty their Last (${o.last} left). Then a chain is your Killing Blow.`; }
    else if (o.break === 0) {
      step = 1;
      if (v.canPlay) { key = 'chain'; line = `Their Break is 0: play a chain. If it lands, your Charge hits their Shield (${o.shield} left).`; }
      else { key = 'chain-nochain'; line = `Their Break is 0 but you hold no chain: ${collect}.`; }
    } else { step = 0; key = 'break'; line = `Win duel rounds to empty their Break (${o.break} left). At 0 you can play a chain.`; }
    // the moment you are in right now comes first: a chain played on you, a Charge, your Killing Blow
    if (step >= 0 && v.weak) {
      if (kind === 'killing-blow') { key = 'name'; line = 'Your Killing Blow chain landed: name their weak point to win.'; }
      else if (kind === 'defend' && own.last === 0 && v.kbReady[them]) { key = 'defend-kb'; line = 'Their Killing Blow chain: stop it with cards, or they name your weak point.'; }
      else if (kind === 'defend') { key = 'defend'; line = `They played a chain on you: stop it with cards, or their Charge hits your Shield (${own.shield} left).`; }
      else if (kind === 'charge') { key = 'charge'; line = `Your chain landed. Attack to hit their Shield (${o.shield} left), or charge again for a bigger hit.`; }
      else if (kind === 'keep') { key = 'escape'; line = `You are chained: roll all your escape dice the same to break free, or their attack hits your Shield (${own.shield} left).`; }
    }
    const dice = v.sides[me], W = c.weakPoints;
    const steps = [
      { name: `1 · Break ${o.break}/${mx.break}`, text: `Their first bar. You hurt it by winning duel rounds (Basic beats Heavy, Heavy beats Block, Block beats Basic). While it is 0 and their Shield is up, you may play a chain instead of a move: ${L} or more cards of one number, or in a row.` },
      { name: `2 · Shield ${o.shield}/${mx.shield}`, text: `Duel hits never touch it: you need a chain. They can stop a chain by discarding as many cards as it is long. If it lands, you Charge: roll d${dice.attack}s into a pool, then attack for the pool minus their highest escape die. After every Charge their Break refills to ${mx.break}.${mineC.poison ? ' Your poison can hurt it too.' : ''}` },
      { name: `3 · Last ${o.last}/${mx.last}`, text: `The final stage. Once their Shield is 0, your duel hits go to their Last instead of their Break, and ordinary chains stop. With no Shield they roll ${c.forms ? 'triple' : SETTINGS.comebackDice === 2 ? 'double' : SETTINGS.comebackDice + ' times the'} duel dice (the comeback).` },
      { name: '4 · Killing Blow', text: `From the round after their Last reaches 0, and while it stays 0, a chain you play is a Killing Blow chain. They can still stop it with cards. If it lands there is no Charge: you name ${W.length > 1 ? `one weak point (${W.join(', ')})` : `their weak point (always the ${W[0]})`}. Right: you win.${W.length > 1 ? ` Wrong: their Last restarts at ${restart}.` : ''}` },
    ];
    const other = `${SETTINGS.deckOutLoses ? 'A deck that reaches 0 cards loses the match. ' : ''}The same move from both players ${SETTINGS.repetitionDraw} rounds in a row is a draw. No winner after ${v.maxRounds} rounds. The computer is after the same goal against you.`;
    return { step, key, line, steps, other };
  }
  function renderGoal(v) {
    const el = one('#goal'); if (!el) return;
    el.hidden = !TIPS.on;                            // the Goal box is one of the hints (Settings: Hints)
    const g = objective(v, pending ? pending.d.kind : null), html = `<b>Goal</b><span class="gline">${esc(g.line)}</span><span class="gmore" aria-hidden="true">?</span>`
      + `<div class="tip gtip"><b>How you win</b>${g.steps.map((s, i) => `<p class="${i === g.step ? 'now' : i < g.step ? 'done' : ''}"><strong>${esc(s.name)}${i === g.step ? ' ◂ you are here' : ''}</strong>${esc(s.text)}</p>`).join('')}<p class="other">${esc(g.other)}</p></div>`;
    if (el._html === html) return;
    el._html = html; el.innerHTML = html; el.dataset.step = g.step; el.dataset.key = g.key;
    // text-fit: the sentence always stays inside its two lines
    const s = one('.gline', el); for (let f = 16; f >= 12 && s.scrollHeight > 38; f--) s.style.fontSize = f + 'px';
  }
  function renderGauges() {
    const v = G.held || G.view;
    renderGoal(v);
    one('#round').textContent = `Round ${v.round}`;
    const glide = speed > 0 && !G.skip && !stillMotion();
    [0, 1].forEach(p => {
      const me = p === 0, k = v.chars[p], name = CHARACTERS[k].name, disc = v.discard[p];
      const form = formShown(p); if (form && G.fighters) G.fighters[p].setForm(form);
      // where each bar is right now (even half-way through a move), so the new bars glide on from there
      const was = glide ? all('#g' + p + ' .tube').map(t => { const h = t.getBoundingClientRect().height || 1; return ['.trail', '.fill'].map(s => one(s, t).getBoundingClientRect().height / h * 100); }) : [];
      const icons = deckChip(v, p)
        + ico('discard', 'Discard pile', disc.length ? disc.map(cardStr).join(', ') + '.' : 'Empty.', !me)
        + ico('rules', `${name} rules`, rulesFor(k).map(esc).join('<br>'), !me)
        + (me ? ico('weak', 'Your weak point', `${v.weak || 'not chosen yet'}. Only you see it.`)
              + ico('history', 'What just happened', G.log.slice(-2).map(esc).join('<br>') || 'Nothing yet.')
          : ico('hand', 'Their hand', `${plural(v.oppHand, 'card')}, face down.`, true));
      one('#g' + p).innerHTML = `<div class="gauge${me ? ' me' : ''}"><h4>${esc(name)}</h4><div class="who">${me ? 'you, Player 1' : 'Player 2, computer'}</div>
        <div class="meters">${[0, 1, 2].map(i => meter(v, p, i)).join('')}</div>
        ${form ? formBox(v, p, form) : ''}<div class="fx">${badges(v, p)}</div><div class="icons">${icons}</div></div>`;
      if (was.length) {
