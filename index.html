* { box-sizing: border-box; }

/* chunky button used for the header controls */

.viewport { width: 100%; overflow: hidden; }
.frame { position: relative; width: 1280px; height: 720px; background: var(--screen); transform-origin: 0 0; }
.scene { display: none; position: absolute; inset: 0; }
.scene.on { display: block; }

/* shared edge recipes, set as variables so themes can drop the bevel */
:root { --notch-3: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink);
        --notch-4: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink);
        --bevel-3: inset 3px 3px 0 var(--bevel-hi), inset -3px -3px 0 var(--bevel-lo);
        --bevel-4: inset 4px 4px 0 var(--bevel-hi), inset -4px -4px 0 var(--bevel-lo); }

.panel { position: absolute; padding: 14px 16px; background: var(--panel); color: var(--text); box-shadow: var(--notch-4), var(--bevel-4); }
.panel h4 { margin: 0 0 10px; font: 700 15px/1.2 var(--f-label); color: var(--accent); letter-spacing: .02em; }

.panel .dim, .dim { color: var(--dim); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* top strip */
.round { position: absolute; left: 210px; top: 12px; font: 700 15px/1.2 var(--f-label); color: var(--text); text-shadow: 2px 2px 0 var(--ink); }
.track { position: absolute; left: 440px; top: 8px; width: 400px; display: flex; gap: 6px; }
.track span { font: 700 12px/1 var(--f-label); padding: 10px 9px; background: var(--panel-dark); color: var(--dim); box-shadow: var(--notch-3); margin: 3px 0; }
.track span.on { background: var(--accent); color: var(--accent-ink); }

/* prompt bar: the one place that says what to do */
.prompt { position: absolute; left: 20px; width: 1240px; height: 46px; padding: 0 14px; display: flex; align-items: center; gap: 16px; background: var(--prompt); color: var(--prompt-ink); box-shadow: var(--notch-4), var(--bevel-4); }
.prompt b { font: var(--title-weight, 700) var(--prompt-size, 16px)/1 var(--f-title); background: var(--accent); color: var(--accent-ink); padding: 9px 12px; white-space: nowrap; letter-spacing: var(--title-track, 0); }
.prompt span { font: 600 22px/1.1 var(--f-text); }

/* stage */
.stage { position: absolute; left: 200px; top: 50px; width: 880px; overflow: hidden; background: var(--stage); box-shadow: var(--notch-4); }

.turn { position: absolute; font: 700 14px/1 var(--f-label); background: var(--accent); color: var(--accent-ink); padding: 9px 11px; box-shadow: var(--notch-3); animation: bob 1.2s steps(1) infinite; }
.pop { position: absolute; z-index: 30; font: 700 34px/1 var(--f-label); color: var(--pop); text-shadow: 4px 4px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); pointer-events: none; animation: pop 1s steps(8) forwards; }
@keyframes pop { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -70px; } }
@media (prefers-reduced-motion: reduce) { .sprite, .turn { animation: none; } }

/* gauges (the three bars of each player) */
.gauge { display: flex; flex-direction: column; gap: 8px; height: 100%; }
.gauge h4 { margin: 0; font: var(--title-weight, 700) var(--name-size, 17px)/1.15 var(--f-title); color: var(--text); letter-spacing: var(--title-track, 0); }

.meter { width: 46px; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; }
.meter.s { width: 36px; }
.meter .val { font: 600 14px/1 var(--f-text); color: var(--dim); white-space: nowrap; }
.meter .val b { font-size: 23px; font-weight: 700; color: var(--text); }
.meter.s .val { font-size: 11px; } .meter.s .val b { font-size: 17px; }
.meter.s .name { font-size: 13px; }
.meter .name { font: 500 15px/1 var(--f-text); color: var(--dim); white-space: nowrap; }
.meter.cur .name { color: var(--text); font-weight: 700; }
.meter.cur .name::before { content: ""; display: inline-block; border-left: 6px solid var(--accent); border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-right: 3px; }
.meter.key .name { text-decoration: underline; text-underline-offset: 3px; color: var(--text); }
.tube { position: relative; flex: 1; width: 100%; min-height: 0; overflow: hidden; background: var(--tube); box-shadow: var(--notch-3); }
.tube i { position: absolute; left: 0; right: 0; bottom: 0; display: block; }
.tube .fill { transition: height .25s steps(6); background-image: linear-gradient(90deg, #ffffff80 0 16%, transparent 16% 70%, #00000050 70%); }
.tube .fill.k0 { background-color: var(--bar-break); } .tube .fill.k1 { background-color: var(--bar-shield); } .tube .fill.k2 { background-color: var(--bar-last); }
.tube .trail { background: var(--trail); transition: height .7s steps(10) .55s; }
.tube .ticks { top: 0; background-image: repeating-linear-gradient(to top, transparent 0, transparent calc(100% / var(--max) - 2px), var(--tube-line) calc(100% / var(--max) - 2px), var(--tube-line) calc(100% / var(--max))); }
.meter.empty .val b { color: var(--warn); }
.fx { display: flex; flex-direction: column; gap: 4px; }
.fx span { position: relative; padding-left: 15px; font: 500 17px/1.15 var(--f-text); }
.fx span::before { content: ""; position: absolute; left: 0; top: 4px; width: 9px; height: 9px; background: var(--bar-shield); }
.fx span.hot::before { background: var(--bar-last); } .fx span.pow::before { background: var(--bar-break); }

/* hover icons */
.icons { display: flex; flex-wrap: wrap; gap: 8px; }
.ico { position: relative; width: 28px; height: 28px; display: grid; place-items: center; background: var(--panel-dark); color: var(--text); font: 700 13px/1 var(--f-label); cursor: help; box-shadow: var(--notch-3); margin: 3px; }

.cards { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding-top: 14px; }
.card { position: relative; width: 48px; height: 68px; margin: 3px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: var(--card); color: var(--card-ink); box-shadow: 0 -3px 0 var(--card-edge), 0 3px 0 var(--card-edge), -3px 0 0 var(--card-edge), 3px 0 0 var(--card-edge), inset 3px 3px 0 var(--card-hi), inset -3px -3px 0 var(--card-lo); }
.card b { font: 700 24px/1 var(--f-label); }
.card.l { width: 60px; height: 84px; } .card.l b { font-size: 31px; }
.card.s { width: 30px; height: 42px; padding: 0; justify-content: center; margin: 2px; } .card.s b { font-size: 16px; }
.card.x { width: 20px; height: 28px; padding: 0; justify-content: center; margin: 2px; } .card.x b { font-size: 11px; }
.card.joker { justify-content: center; background: var(--joker); }
.card.back { justify-content: center; background-color: var(--back-a); background-image: repeating-conic-gradient(var(--back-b) 0 25%, transparent 0 50%); background-size: 10px 10px; }
.card.sel { transform: translateY(-12px); --card-edge: var(--accent); }
.card.sel::after { content: "discard"; position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font: 500 17px/1 var(--f-text); color: var(--text); white-space: nowrap; }
.card.die { justify-content: center; } .card.die b { font-size: 31px; }
.card.die.d8 { background: var(--die); }
.card.die.keep { --card-edge: var(--accent); transform: translateY(-8px); }
.card.die.plus { background: transparent; color: var(--dim); box-shadow: none; outline: 4px dashed var(--dim); outline-offset: -4px; }

/* action buttons: always the lower right of the dock */
.actions { position: absolute; display: flex; flex-direction: column; gap: 10px; }
.btn { position: relative; display: block; width: 100%; padding: 8px 14px; text-align: left; border: 0; cursor: pointer; background: var(--btn); color: var(--btn-ink); font-family: var(--f-text); box-shadow: var(--notch-4), var(--bevel-4); }
.btn:hover:not(.off) { background: var(--btn-hi); }
.btn:active:not(.off) { transform: translateY(4px); }
.btn b { display: block; font: var(--title-weight, 700) var(--btn-size, 17px)/1.1 var(--f-title); letter-spacing: var(--title-track, 0); }
.btn small { display: block; margin-top: 4px; font: 500 18px/1.15 var(--f-text); }
.btn.icon { padding-left: 62px; }
.btn.icon .spr { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn.main:hover { background: var(--accent); filter: brightness(1.08); }

.btn.off b { text-decoration: line-through; }
.btn.mid { text-align: center; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 7px; background: var(--warn); color: var(--warn-ink); font: 700 15px/1.2 var(--f-text); }
.row.nowrap { flex-wrap: nowrap; gap: 12px; }

.more summary { display: inline-block; cursor: pointer; list-style: none; font: 500 17px/1.2 var(--f-text); color: var(--dim); border-bottom: 2px dotted var(--dim); padding: 2px 0; }

.more summary::before { content: "\25B8  "; } .more[open] summary::before { content: "\25BE  "; }
.more .body { position: absolute; left: -6px; bottom: 34px; width: 372px; padding: 12px 14px; background: var(--tip); color: var(--tip-ink); z-index: 70; box-shadow: var(--notch-3); }
.more .body p { margin: 0 0 6px; font: 500 18px/1.25 var(--f-text); color: var(--tip-ink); }
.more .body p:last-child { margin: 0; }

/* themes choose the case of titles (arcade shouts, castle does not) */
.top h1, .prompt b, .btn b, .gauge h4 { text-transform: var(--title-case, none); }

/* icon squares: a small picture, with its name first in the hover card */
.ico .spr { display: block; }
.tip b { display: block; margin-bottom: 2px; font: 700 15px/1.2 var(--f-label); }

/* real sprites (only on pages that set FABLE_SPRITES) */
.sprite img { display: block; width: auto; image-rendering: pixelated; }
.fighter.r img { transform: scaleX(-1); }
.sprite.flash img { filter: brightness(0) invert(1); }

/* ---- bright arena ---- */

/* BRIGHT ARENA (a cooler recolour of Sunny valley: ice-white panels, clear sky, pale stone, crimson banners).

:root {

  --warn: #d8362e; --warn-ink: #ffffff; --tip: #14324a; --tip-ink: #fff8e0;
  --card: #ffffff; --card-ink: #14324a; --card-edge: #14324a; --card-hi: #ffffff; --card-lo: #dbe4ee; --joker: #ffd3e6; --back-a: #d8362e; --back-b: #ffd76a; --die: #bfe6f7;
  --btn: #2f8fd6; --btn-hi: #46a6ea; --btn-ink: #ffffff; --btn-off: #dfe6ee; --btn-off-ink: #93a1b0; --go: #4fc23f; --go-ink: #0f2e12;
  --c1: #d8362e; --c2: #35b4ec; --c3: #ffbe1f; --c4: #ffcf9e; --c5: #f4f8ff;
  --notch-3: 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink);
  --notch-4: 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink);
  --bevel-3: inset 0 0 0 2px var(--bevel-hi);
  --bevel-4: inset 0 0 0 3px var(--bevel-hi), inset 0 0 0 5px #ffffff;

  --m-robe: #a53dff; --m-robe2: #7a22c9; --m-hat: #a53dff; --m-trim: #ffe23a; --m-skin: #ffcf9e; --m-beard: #ffffff; --m-wood: #a8642b; --m-orb: #1fe0ff; --m-dark: #0f0f2d;
  --gold-text: linear-gradient(#fffbd6 0%, #ffdc5c 45%, #ff9d1c 100%);
  --text-edge: drop-shadow(1px 0 0 #14324a) drop-shadow(-1px 0 0 #14324a) drop-shadow(0 1px 0 #14324a) drop-shadow(0 -1px 0 #14324a) drop-shadow(0 3px 0 #14324a);
}
body { color: #fff8e0; }
.note a { color: #ffe27a; }
.caption, .log, .note { color: #fff8e0; }

/* slanted gold display lettering with a navy outline */

.btn { --bevel-hi: #8fd0fa; --bevel-4: inset 0 0 0 2px var(--bevel-hi); }

.prompt span { font: 800 21px/1.1 var(--f-text); }
.panel h4 { font: 400 21px/1.1 var(--f-label); color: #c8322c; letter-spacing: .02em; }

  radial-gradient(ellipse 34% 46% at 12% 92%, #ffffff40 0 60%, transparent 61%),
  radial-gradient(ellipse 30% 40% at 92% 6%, #ffffff40 0 60%, transparent 61%),
  repeating-conic-gradient(#46a3ee 0 25%, #4fabf3 0 50%) 0 0 / 40px 40px; }

.stage { background: linear-gradient(#3f9df0 0 24%, #6ab8f6 24% 46%, #9bd3fb 46% 66%, #cfeaff 66% 100%); }

/* Jersey 15 has one weight: never fake a bold, and size the numbers up */
body { font-synthesis: none; }
.top h1, .chip, .panel h4, .round, .track span, .prompt b, .turn, .plate, .meter .val, .meter .val b, .meter .name, .meter.cur .name, .card b, .btn b, .gauge h4, .tag, .pop, .tip b, .panel b[style], .panel p[style] { font-weight: 400; }

.meter .name { font: 400 18px/1 var(--f-label); } .meter.s .name { font-size: 15px; }
.tag { font: 400 18px/1.1 var(--f-label); padding: 1px 7px 2px; }
.tip b { font: 400 20px/1.1 var(--f-label); }
.panel b[style] { font-size: 28px !important; } .panel p[style*="f-label"] { font-size: 30px !important; }

/* ---- the playable game: additions on top of the bright-arena design ---- */

.chip { font: 400 20px/1 var(--f-label); }

/* fighters: art size per moment, motion wrapper */

/* standing still: a slow, smooth breath (up 4px and back) instead of a jump */

.fighter.r.bob .sprite { animation-delay: -1.4s; }
.turn { animation: breathe .7s ease-in-out infinite alternate; }
.mover { display: flex; align-items: flex-end; justify-content: center; height: 100%; }

/* the moves revealed in the middle of the stage */

/* clickable cards and dice */

.card.sel::after { content: attr(data-tag); }

.cards.small { gap: 2px; padding-top: 4px; }

/* dock panels */
.panel { overflow: visible; }
#dInfo, #dHand { overflow: hidden; }
#dInfo:has(details[open]) { overflow: visible; }
.feed p { font: 500 17px/1.25 var(--f-text); margin: 0 0 5px; }

.chainrow .num { font: 400 18px/1 var(--f-label); margin-right: 4px; }
.chainrow .tag { font-size: 14px; }
.total { font: 400 26px/1 var(--f-label); margin-left: 6px; }
.note2 { margin-top: 10px !important; font-size: 18px !important; }

/* ---- the character select: a roster strip and one picture card per side ---- */
.s-n { fill: #4fc23f; }
.select { background: transparent; }
.seltitle { position: absolute; left: 20px; top: 8px; font: 400 40px/1 var(--f-title); color: #fff8e0; text-shadow: 3px 3px 0 var(--ink); }
.selcol { position: absolute; top: 54px; width: 606px; }
.selrow { display: flex; align-items: stretch; gap: 6px; height: 110px; }
.rowhead { width: 76px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; }
.rowlabel { font: 400 26px/1 var(--f-title); color: #fff8e0; text-shadow: 2px 2px 0 var(--ink); }

.chip.rand { margin: 2px; padding: 8px 0; width: 72px; font-size: 18px; text-align: center; }
.tiles { display: flex; gap: 4px; }

  background: var(--panel); color: var(--text); box-shadow: var(--notch-3), var(--bevel-3); }
.tile:hover { background: #fff; }
.tile.on { background: linear-gradient(#ffe27a, #ffb52e); box-shadow: var(--notch-3), inset 0 0 0 2px #fff3b8, 0 0 0 5px #fff8e0; z-index: 1; }
.tile:focus-visible { outline: 3px dashed var(--accent); outline-offset: 4px; }
.tile .art { height: 72px; display: flex; align-items: flex-end; }
.tile .art img, .tile .art canvas { height: 72px; width: auto; image-rendering: pixelated; }
.tile .tname { font: 400 14px/13px var(--f-label); text-align: center; height: 28px; display: flex; align-items: center; }

.fcard { left: 0; top: 122px; width: 606px; height: 464px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ftop { display: flex; gap: 14px; height: 152px; }
.fart { position: relative; width: 150px; height: 152px; display: flex; align-items: flex-end; justify-content: center; box-shadow: var(--notch-3);
  background: linear-gradient(#6ab8f6 0 40%, #9bd3fb 40% 78%, #eef3f9 78% 100%); }
.fart img, .fart canvas { height: 144px; width: auto; image-rendering: pixelated; }
.fcard.right .fart img, .fcard.right .fart canvas { transform: scaleX(-1); }
.fart .soon { position: absolute; left: 0; top: 0; padding: 2px 6px 3px; font: 400 15px/1 var(--f-label); color: var(--tag-ink); background: var(--tag); }
.fid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fwho { font: 800 14px/1 var(--f-text); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.fid h3 { margin: 2px 0 6px; font: 400 42px/.9 var(--f-title); color: var(--text); white-space: nowrap; }
.hbars { display: grid; gap: 7px; margin-top: auto; }
.hbar { display: flex; align-items: center; gap: 8px; }
.hbar .hn { width: 58px; font: 400 22px/1 var(--f-label); }
.hbar .segs { display: flex; gap: 2px; padding: 3px; background: var(--tube); }
.hbar .segs i { display: block; width: 20px; height: 20px; background: #2b4d68; }
.hbar .segs i.on { background-image: linear-gradient(#ffffffaa 0 16%, #ffffff33 16% 34%, transparent 34% 76%, #00000040 76%); }
.hbar.k0 i.on { background-color: var(--bar-break); } .hbar.k1 i.on { background-color: var(--bar-shield); } .hbar.k2 i.on { background-color: var(--bar-last); }
.hbar > b { font: 400 32px/.8 var(--f-label); min-width: 30px; }

.frow { display: flex; align-items: center; gap: 12px; padding-top: 8px; border-top: 2px solid var(--panel-dark); }
.frow.top { align-items: flex-start; flex: 1; min-height: 0; }
.fl { flex: none; width: 58px; font: 400 21px/1 var(--f-label); color: #c8322c; }
.frow.top .fl { padding-top: 4px; }
.fdeck { display: flex; align-items: center; gap: 6px; }
.fdeck .strip { display: flex; }
.fdeck .card { margin: 2px; flex: none; box-shadow: 0 0 0 2px var(--card-edge); }
.fdeck .card.none { background: transparent; box-shadow: none; outline: 2px dashed #b9c9d8; outline-offset: -2px; }
.fdeck .times { font: 400 26px/1 var(--f-label); }
.fdeck .plus { font: 400 24px/1 var(--f-label); color: var(--dim); margin-left: 4px; }
.fdeck .tot { margin-left: 8px; font: 800 15px/1 var(--f-text); color: var(--dim); white-space: nowrap; }
.fdeck .tot b { font: 400 30px/.8 var(--f-label); color: var(--text); margin-right: 2px; }
.fdice { display: flex; gap: 10px; }
.pdie { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 58px; }
.pdie > b { width: 46px; height: 42px; display: grid; place-items: center; font: 400 28px/1 var(--f-label); background: #fff; box-shadow: var(--notch-3), inset -4px -4px 0 #dbe4ee;
  clip-path: polygon(0 -3px, 100% -3px, calc(100% + 3px) 0, calc(100% + 3px) 100%, 100% calc(100% + 3px), 0 calc(100% + 3px), -3px 100%, -3px 0); }
.pdie.up > b { background: linear-gradient(#ffe27a, #ffb52e); box-shadow: var(--notch-3), inset -4px -4px 0 #e8951f; }
.pdie.down > b { background: #cfd9e4; color: #4f6f80; box-shadow: var(--notch-3), inset -4px -4px 0 #a9b8c8; }
.pdie > small, .fstat > small, .fweak > small { font: 800 13px/1 var(--f-text); color: var(--dim); white-space: nowrap; }
.pdie small i { font-style: normal; margin-left: 3px; }
.pdie.up small i { color: #c8780a; } .pdie.down small i { color: #c8322c; }
.fstat { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center; gap: 4px 6px; margin-left: 10px; padding-left: 14px; border-left: 2px solid var(--panel-dark); }
.fstat > b { font: 400 34px/.8 var(--f-label); }
.fstat > small { grid-column: 1 / 3; text-align: center; }
.fweak { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-left: auto; padding-left: 14px; border-left: 2px solid var(--panel-dark); }
.fweak .wp { display: flex; gap: 4px; height: 42px; align-items: center; }
.fweak .wp i { font: 400 18px/1 var(--f-label); font-style: normal; padding: 5px 6px 6px; color: #9fb0bf; background: #e6edf4; text-decoration: line-through; }
.fweak .wp i.on { color: #fff; background: #c8322c; text-decoration: none; box-shadow: var(--notch-3); }
.powers { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; }
.power { display: flex; align-items: center; gap: 10px; padding: 5px 6px 5px 5px; background: var(--panel-dark); box-shadow: var(--notch-3); min-width: 0; }
.power .pico { flex: none; width: 54px; height: 54px; display: grid; place-items: center; background: #fff; box-shadow: inset 0 0 0 2px #8fd0fa; }
.power .ptxt { min-width: 0; display: grid; gap: 3px; }
.power .ptxt b { font: 400 26px/.9 var(--f-label); white-space: nowrap; }
.power .ptxt small { font: 800 14px/1.1 var(--f-text); color: #35566b; }
/* the full sentence, on hover, keyboard focus or tap */
.hint { position: relative; cursor: help; }
.hint .tip { left: 0; bottom: calc(100% + 8px); width: 320px; z-index: 80; }
.fcard.right .hint .tip { left: auto; right: 0; }
.hint:hover .tip, .hint:focus .tip { display: block; }
.hint:hover, .hint:focus { outline: 3px solid var(--accent); outline-offset: 3px; }
.select:has(.hint:hover) .hint:focus:not(:hover) .tip { display: none; }      /* one sentence at a time */
.selhint { position: absolute; left: 20px; top: 664px; width: 420px; display: flex; align-items: center; gap: 10px; color: #fff8e0; font: 800 16px/1.2 var(--f-text); text-shadow: 1px 1px 0 var(--ink); }
.selhint .spr { flex: none; }

/* the match log under the screen */
.logbox { margin-top: 10px; color: #fff8e0; font: 500 16px/1.35 var(--f-text); }
.logbox summary { cursor: pointer; font: 400 22px/1 var(--f-label); }
.logbox ol { max-height: 260px; overflow: auto; background: #0f2a52; padding: 10px 10px 10px 40px; }

.btn.main.off { background: var(--btn-off); color: var(--btn-off-ink); }

/* ---- a chain can be played: make it impossible to miss ---- */
/* the prompt and your hand glow */
@keyframes glow { from { box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 7px #ffbe1f; } to { box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 7px #fff8e0; } }
#prompt.glow, #dHand.glow { animation: glow .5s ease-in-out infinite alternate; }
#dHand.glow h4 { color: #1f8a3a; }
/* a big sign across the stage when the decision starts */
.chainsign { position: absolute; left: 200px; top: 176px; width: 880px; z-index: 40; pointer-events: none; padding: 8px 0 16px; text-align: center;
  background: linear-gradient(#1f5fa8f2, #14324af2); box-shadow: 0 -6px 0 #ffbe1f, 0 6px 0 #ffbe1f, 0 -9px 0 var(--ink), 0 9px 0 var(--ink); animation: signshow 2.3s ease-out forwards; }
.chainsign b { display: flex; justify-content: center; align-items: center; gap: 22px; font: 400 104px/1 var(--f-title); letter-spacing: .03em;
  background-image: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--text-edge); }
.chainsign span { display: block; margin-top: 2px; font: 800 24px/1.1 var(--f-text); color: #fff8e0; }
@keyframes signshow { 0% { opacity: 0; transform: scale(1.5, .2); } 9% { opacity: 1; transform: scale(1.06); } 15% { transform: scale(1); } 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-26px); } }
@keyframes signfade { 0%, 82% { opacity: 1; } 100% { opacity: 0; } }
/* the "Your turn" tag says it too */
.turn.chain { font-size: 26px; padding: 6px 12px 7px; background: linear-gradient(#b6f08a, #4fc23f); box-shadow: var(--notch-3), 0 0 0 5px #fff8e0; }
/* your hand: cards that can go into a chain are gold with a star, the suggested ones pulse, the others step back */
.cards .card.can { --card-edge: #e8951f; background: linear-gradient(#fffbe0, #ffe27a); }
.cards .card.can::before { content: "\2605"; position: absolute; right: -9px; top: -11px; z-index: 2; width: 22px; height: 22px; display: grid; place-items: center; font: 400 17px/1 var(--f-label); color: #14324a; background: #ffbe1f; box-shadow: var(--notch-3); }
.cards .card.cant { opacity: .6; }
@keyframes cardcall { from { transform: translateY(0); filter: drop-shadow(0 0 0 #ffbe1f); } to { transform: translateY(-9px); filter: drop-shadow(0 0 7px #ff9d1c); } }
.cards .card.best:not(.sel) { animation: cardcall .45s ease-in-out infinite alternate; }
.cards .card.best:nth-child(2n) { animation-delay: -.15s; }
/* with a chain ready: the three moves on one line each, and under them the chain buttons */
.actions:has(.chainzone) { gap: 6px; }
.actions .btn.line { height: 36px; padding: 0 10px 0 50px; display: flex; align-items: center; gap: 12px; white-space: nowrap; overflow: hidden; }
.actions .btn.line .spr { left: 12px; width: 26px; height: auto; max-height: 26px; }
.actions .btn.line b { font-size: 25px; }
.actions .btn.line small { margin: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.actions .btn.line .tag { font-size: 15px; }
.actions .chainzone { flex: 1; min-height: 0; margin-top: 2px; display: grid; gap: 6px 8px; grid-auto-rows: 1fr; }
.actions .chainzone.n2, .actions .chainzone.n3, .actions .chainzone.n4 { grid-template-columns: 1fr 1fr; }
.actions .chainzone.n5 { grid-template-columns: 1fr 1fr 1fr; }
.actions .chainzone .btn { height: 100%; padding: 2px 10px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.actions .chainzone .btn b { font-size: 28px; white-space: nowrap; }
.actions .chainzone .btn small { margin-top: 2px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions .chainzone.n2 .btn b { font-size: 24px; } .actions .chainzone.n2 .btn small { font-size: 14px; }
.actions .chainzone.n3 .btn, .actions .chainzone.n4 .btn, .actions .chainzone.n5 .btn { flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; padding: 0 8px; }
.actions .chainzone.n3 .btn b, .actions .chainzone.n4 .btn b, .actions .chainzone.n5 .btn b { font-size: 20px; }
.actions .chainzone.n3 .btn small, .actions .chainzone.n4 .btn small, .actions .chainzone.n5 .btn small { margin: 0; font-size: 13px; }
.actions .chainzone.n5 .btn small { display: none; }
.actions .chainzone .btn.chaincta { padding-left: 72px; }
.actions .chainzone .btn.chaincta .spr { left: 16px; }
/* the big green button that picks the cards for you, and the buttons that play them */
.btn.chaincta { background: linear-gradient(#c5f59a, #4fc23f); --bevel-hi: #eaffd6; padding-top: 7px; padding-bottom: 8px; animation: ctacall .5s ease-in-out infinite alternate; }
.btn.chaincta:hover { background: linear-gradient(#d6ffb0, #62d451); }
.actions .chainzone .btn.chaincta b { font-size: 38px; background: none; color: #14324a; filter: none; }
.actions .chainzone .btn.chaincta small { color: #14324a; font-size: 16px; margin-top: 0; }
@keyframes ctacall { from { box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 3px #ffbe1f; transform: scale(1); } to { box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 9px #fff8e0; transform: scale(1.025); } }
.actions .btn.go { animation: ctacall .5s ease-in-out infinite alternate; }
.actions .btn.go b { background: none; color: #14324a; filter: none; }
.actions .btn.go small { color: #14324a; }
@media (prefers-reduced-motion: reduce) {
  #prompt.glow, #dHand.glow { animation: none; box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 7px #ffbe1f; }
  .chainsign { animation: signfade 2.3s linear forwards; }
  .cards .card.best:not(.sel) { animation: none; transform: translateY(-6px); filter: drop-shadow(0 0 5px #ff9d1c); }
  .btn.chaincta, .actions .btn.go { animation: none; box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 6px #ffbe1f; }
}

/* ---- smooth movement (the theme's stepped moves, eased) ---- */
/* bars: the fill glides to its new height, the pale trail follows a moment later */
.tube .fill { transition: height .3s ease-out; }
.tube .trail { transition: height .5s ease-in-out .4s; }
/* damage and healing numbers: pop in, hold, float up and fade */
@keyframes popup { 0% { opacity: 0; transform: translateY(12px) scale(.7); } 14% { opacity: 1; transform: translateY(0) scale(1.08); } 24% { transform: translateY(0) scale(1); } 65% { opacity: 1; } 100% { opacity: 0; transform: translateY(-64px) scale(1); } }
.pop { animation: popup 1s ease-out forwards; }
/* cards lift under the pointer instead of jumping */
button.card { transition: transform .12s ease-out; }
/* the screen changes size between duel, chain, charge and Killing Blow: glide there */
.stage, .gp, .fighter, .fighter .sprite, .prompt, #dInfo, #dHand, #dAct, .turn { transition: left .22s ease-out, top .22s ease-out, width .22s ease-out, height .22s ease-out; }
.mover img, .mover canvas { transition: height .22s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .fighter.bob .sprite, .turn { animation: none; }
  .pop { animation: popfade 1s linear forwards; }
  .tube .fill, .tube .trail, button.card, .stage, .gp, .fighter, .fighter .sprite, .prompt, #dInfo, #dHand, #dAct, .turn, .mover img, .mover canvas { transition: none; }
}
@keyframes popfade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

/* ---- the table: both players' chains and the opponent's hand, always on screen at the top of the stage ---- */
.table { position: absolute; top: 56px; z-index: 5; max-width: 420px; max-height: 70px; overflow: hidden; display: flex; align-items: flex-start; gap: 8px; padding: 1px 8px; background: #14324ae0; color: #fff8e0; box-shadow: var(--notch-3); }
.table.grow { max-height: none; }
#t0 { left: 208px; } #t1 { right: 208px; }
.table .lbl { font: 400 18px/1 var(--f-label); color: #ffe27a; white-space: nowrap; }
.tlist { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 0 12px; min-width: 0; }
.tlist .lbl, .tchain, .tlist .none { height: 34px; display: flex; align-items: center; }
.tlist .none { font: 700 15px/1 var(--f-text); color: #c9dcef; white-space: nowrap; }
.tchain .num { font: 400 17px/1 var(--f-label); margin-right: 1px; }
.tchain .dim { font: 700 13px/1 var(--f-text); color: #c9dcef; white-space: nowrap; margin-left: 2px; }
.tcards { display: flex; }
.table .card { margin: 3px; box-shadow: 0 0 0 2px var(--card-edge); flex: none; }
.table.d1 .tcards .card + .card { margin-left: -7px; }
.table.d1 .tcards .card:not(:last-child) { align-items: flex-start; padding-left: 3px; }
.table .tag { font: 400 15px/14px var(--f-label); margin-left: 3px; max-width: 98px; padding: 1px 6px 2px; text-wrap: balance; }
.table .tag.wide { max-width: 126px; }
.table.d2 { max-height: 84px; }
.table.d2 .tlist { zoom: .8; }
.turn { z-index: 6; }
/* the opponent's hand: face-down cards and a big number, beside their fighter, under their chains */

.thand .fan { display: flex; }
.thand .card { margin: 4px 0 4px 2px; flex: none; box-shadow: 0 0 0 2px var(--card-edge); }
.thand .nocard { background: transparent; box-shadow: none; outline: 2px dashed #c9dcef; outline-offset: -2px; }
.thand .count { font: 400 46px/1 var(--f-label); background-image: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--text-edge); min-width: 22px; text-align: center; }

/* the in-match rules icon: a wide card, so the longest character (the Mage) stays inside the screen */
.ico[aria-label$=" rules"] .tip { width: 440px; }

/* ---- every text readable and inside its box ---- */
/* the small line on blue buttons: a dark edge behind the pale letters */
.btn:not(.main):not(.go):not(.chaincta):not(.off) small { text-shadow: 1px 1px 0 #14324a, 0 1px 0 #14324a; }
/* buttons you can't press yet: still easy to read why */
.btn.off b, .btn.main.off b { color: #6f7f8f; }
.btn.off small, .btn.main.off small { color: #3d5263; }
/* a message about a wrong action: its own pale box at the foot of the buttons, never on the bare stage */
.actions .err { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; margin: 0 !important; padding: 4px 10px 5px; font: 800 15px/1.2 var(--f-text) !important; color: #a3201a; background: #fff8e0; box-shadow: var(--notch-3); }
#dHand .err { color: #a3201a; }
.actions { gap: 6px; }
/* character select: crossed-out weak points and the small arrows, darker */
.fweak .wp i { color: #5f7486; }
.pdie.up small i { color: #9a5c00; } .pdie.down small i { color: #b3261f; }
/* a full hand: the cards overlap on one line (the number stays in view; the card under the pointer comes to the front) */
.cards.tight { flex-wrap: nowrap; gap: 0; }

.cards.tight .card:not(:last-child) { align-items: flex-start; padding-left: 5px; }
.cards.tight .card.sel::after { content: "\2713"; left: 2px; transform: none; bottom: -22px; font: 800 18px/1 var(--f-text); color: #1f8a3a; }
.cards.tight .card.can::before { right: auto; left: -8px; }
/* many dice in one box: drawn smaller so they stay on one line */
.row.m { gap: 6px; } .row.m .card.die { width: 48px; height: 68px; } .row.m .card.die b { font-size: 38px; }
.row.s { gap: 3px; } .row.s .card.die { width: 34px; height: 48px; margin: 2px; box-shadow: 0 0 0 2px var(--card-edge); } .row.s .card.die b { font-size: 28px; }
.row.m .total, .row.s .total { font-size: 22px; }
.tag.dsize { margin: 0 4px 0 0; }
.card.die.coin { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(#ffe27a, #ffb52e); box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 3px #fff3b8; }

/* ---- dice you can see being rolled: a short tumble over the roller's side of the stage ---- */
.roll { position: absolute; top: 212px; width: 384px; z-index: 26; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.roll.p0 { left: 222px; } .roll.p1 { left: 674px; }
.roll .rwho { max-width: 100%; padding: 3px 10px 4px; font: 400 20px/1 var(--f-label); color: #fff8e0; background: #14324ae6; box-shadow: var(--notch-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roll .rdice { display: flex; align-items: center; justify-content: center; gap: 8px; }
.roll .rd { width: 46px; height: 46px; display: grid; place-items: center; font-style: normal; background: #fff; color: #14324a; box-shadow: var(--notch-3), inset -4px -4px 0 #dbe4ee, 3px 5px 0 #14324a55; }
.roll .rd b { font: 400 36px/1 var(--f-label); }
.roll.atk .rd { background: var(--die); box-shadow: var(--notch-3), inset -4px -4px 0 #8fcbe6, 3px 5px 0 #14324a55; }
.roll .rd.coin { border-radius: 50%; background: linear-gradient(#ffe27a, #ffb52e); box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 3px #fff3b8, 3px 5px 0 #14324a55; }
.roll .rd.kept { opacity: .75; box-shadow: var(--notch-3), inset -4px -4px 0 #dbe4ee; }
.roll .rd.coin.kept { box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 3px #fff3b8; }
.roll.many .rdice { gap: 5px; } .roll.many .rd { width: 34px; height: 34px; } .roll.many .rd b { font-size: 27px; }
.roll .rsum { margin-left: 4px; font: 400 40px/1 var(--f-title); background-image: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--text-edge); visibility: hidden; white-space: nowrap; }
.roll.done .rsum { visibility: visible; }
@keyframes tumble { 0% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-16px) rotate(90deg); } 50% { transform: translateY(0) rotate(180deg); } 75% { transform: translateY(-9px) rotate(270deg); } 100% { transform: translateY(0) rotate(360deg); } }
@keyframes coinflip { 0% { transform: translateY(0) scaleY(1); } 25% { transform: translateY(-20px) scaleY(.08); } 50% { transform: translateY(-26px) scaleY(1); } 75% { transform: translateY(-12px) scaleY(.08); } 100% { transform: translateY(0) scaleY(1); } }
@keyframes landed { 0% { transform: scale(1.35); } 60% { transform: scale(.94); } 100% { transform: scale(1); } }
.roll .rd.go { animation: tumble .3s linear infinite; }
.roll .rd.go:nth-child(2n) { animation-delay: -.11s; } .roll .rd.go:nth-child(3n) { animation-delay: -.2s; }
.roll .rd.coin.go { animation-name: coinflip; animation-duration: .26s; }
.roll .rd.landed { animation: landed .18s ease-out; }
@media (prefers-reduced-motion: reduce) { .roll .rd.go, .roll .rd.landed { animation: none; } }
/* the Fire mark on a move sits in the button's top right corner, so the line under the name never wraps */
.actions .btn small .tag { position: absolute; right: 10px; top: 7px; margin: 0; text-shadow: none; }
.actions .btn.line small .tag { top: 50%; transform: translateY(-50%); }
.actions .btn.line:has(.tag) { padding-right: 86px; }
/* the "What just happened" icon: the last two events on a wide card, so long sentences stay on the screen */
.ico[aria-label="What just happened"] .tip { width: 440px; }

/* ---- rules 1.39: the Killing Blow is a chain ---- */
/* the chain-ready alert in its Killing Blow colours: red and gold instead of green */
@keyframes glowkb { from { box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 7px #e8443a; } to { box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 7px #ffbe1f; } }
#prompt.glow.kb, #dHand.glow.kb { animation-name: glowkb; }
#prompt.kb { background: #8a1f2b; --bevel-4: inset 0 0 0 2px #e8443a; }
#dHand.glow.kb h4 { color: #a3201a; }
.turn.chain.kb { background: linear-gradient(#ffd76a, #ff8a3a); }
.chainsign.kb { background: linear-gradient(#a3201af2, #3a0f1ef2); }

.btn.chaincta.kb:hover { background: linear-gradient(#fff0a8, #ff9d52); }

/* short notes about the Killing Blow in the left box */
.panel p.kbnote { margin: 4px 0 6px; padding: 4px 8px 5px; font: 800 15px/1.2 var(--f-text); color: #14324a; background: #ffe27a; box-shadow: var(--notch-3); }
.panel p.kbnote.soft { background: var(--panel-dark); }
.panel p.kbnote.bad { color: #fff; background: #a3201a; }
/* letting a Killing Blow chain land: a red button */
.btn.danger { background: linear-gradient(#e8564a, #a3201a); --bevel-hi: #ffb0a0; }
.btn.danger:hover { background: linear-gradient(#f06a5e, #b52a22); }

/* the scene: dark screen, the two fighters, the title, the face-down weak-point card, the reveal */
.kbscene { position: absolute; inset: 0; z-index: 60; overflow: hidden; cursor: pointer; --t: 1;
  background: radial-gradient(ellipse 62% 58% at 50% 58%, #6a1634f2 0%, #1c1440f7 55%, #080c1cfb 100%); animation: kbin calc(.25s * var(--t)) ease-out both; }
.kbscene.out { animation: kbout calc(.22s * var(--t)) ease-in both; }
@keyframes kbin { from { opacity: 0; } } @keyframes kbout { to { opacity: 0; } }
.kbrays { position: absolute; left: 50%; top: 58%; width: 1700px; height: 1700px; margin: -850px; background: repeating-conic-gradient(#ffbe1f24 0 5deg, transparent 0 15deg);
  -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 58%); mask-image: radial-gradient(circle, #000 12%, transparent 58%); animation: kbspin 50s linear infinite; }
@keyframes kbspin { to { transform: rotate(360deg); } }
.kbar { position: absolute; left: 0; right: 0; height: 58px; background: #05080f; z-index: 4; }
.kbar.top { top: 0; box-shadow: 0 4px 0 #ffbe1f; animation: kbbart calc(.3s * var(--t)) ease-out both; }
.kbar.bot { bottom: 0; box-shadow: 0 -4px 0 #ffbe1f; animation: kbbarb calc(.3s * var(--t)) ease-out both; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; }
.kbar span { font: 800 15px/1 var(--f-text); color: #c9dcef; }
@keyframes kbbart { from { transform: translateY(-64px); } } @keyframes kbbarb { from { transform: translateY(64px); } }
.kbfig { position: absolute; bottom: 76px; width: 340px; z-index: 2; display: flex; flex-direction: column; align-items: center; opacity: 0; --d: 1;
  transform: translateX(calc(-480px * var(--d))); transition: transform calc(.45s * var(--t)) cubic-bezier(.2, .8, .3, 1), opacity calc(.2s * var(--t)) linear; }
.kbfig.l { left: 110px; } .kbfig.r { right: 110px; --d: -1; }
.kbscene.s1 .kbfig { opacity: 1; transform: none; }
.kbscene.s3 .kbfig.att { transform: translateX(calc(96px * var(--d))); z-index: 3; }
.kbscene.snap .kbfig, .kbscene.snap .kbsub { transition: none; }
.kbmove { height: 336px; display: flex; align-items: flex-end; }
.kbmove img, .kbmove canvas { display: block; height: 336px; width: auto; image-rendering: pixelated; }
.kbfig.r .kbmove img, .kbfig.r .kbmove canvas { transform: scaleX(-1); }
.kbname { margin-top: 8px; padding: 3px 12px 4px; font: 400 24px/1 var(--f-label); color: var(--plate-ink); background: var(--plate); box-shadow: var(--notch-3); white-space: nowrap; }
.kbfig.def .kbname { color: #fff; background: #a3201a; }
.kbtitle { position: absolute; left: 0; right: 0; top: 70px; z-index: 5; text-align: center; pointer-events: none; }
.kbtitle b { display: block; opacity: 0; font: 400 136px/1 var(--f-title); letter-spacing: .05em; text-transform: uppercase;
  background-image: linear-gradient(#fff3b8 0%, #ffbe1f 48%, #ff6a3a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--text-edge) drop-shadow(0 6px 0 #05080f); }
.kbscene.s2 .kbtitle b { opacity: 1; animation: kbslam calc(.42s * var(--t)) cubic-bezier(.2, .9, .3, 1.2) both; }
.kbscene.held .kbtitle b { animation: none; }
.kbscene.s5 .kbtitle b { animation: kbslam2 calc(.42s * var(--t)) cubic-bezier(.2, .9, .3, 1.2) both; }
.kbscene.miss .kbtitle b { background-image: linear-gradient(#ffffff 0%, #c9dcef 55%, #7fa6c9 100%); }
@keyframes kbslam { 0% { opacity: 0; transform: scale(2.6); } 60% { opacity: 1; transform: scale(.94); } 100% { transform: scale(1); } }
@keyframes kbslam2 { 0% { opacity: 0; transform: scale(2.6); } 60% { opacity: 1; transform: scale(.94); } 100% { transform: scale(1); } }
.kbsub { display: block; max-width: 1080px; margin: 2px auto 0; font: 800 26px/1.15 var(--f-text); color: #fff8e0; text-shadow: 2px 2px 0 #05080f; text-wrap: balance; opacity: 0; transition: opacity calc(.25s * var(--t)) linear; }
.kbscene.s3 .kbsub { opacity: 1; }
.kbcard { position: absolute; left: 574px; top: 296px; width: 132px; height: 184px; z-index: 3; perspective: 700px; opacity: 0; }
.kbscene.s3 .kbcard { opacity: 1; animation: kbdrop calc(.45s * var(--t)) cubic-bezier(.3, 1.3, .5, 1) both; }
.kbscene.held .kbcard { animation: none; }
.kbscene.s4 .kbcard { animation: kbshake .08s linear infinite alternate; }
.kbscene.s5 .kbcard { animation: none; }
@keyframes kbdrop { from { opacity: 0; transform: translateY(-420px) rotate(-14deg); } }
@keyframes kbshake { from { transform: translate(-3px, 1px) rotate(-1.5deg); } to { transform: translate(3px, -1px) rotate(1.5deg); } }
.kbflip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform calc(.36s * var(--t)) ease-in-out; }
.kbscene.s5 .kbflip { transform: rotateY(180deg); }
.kbflip > span { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 0 0 4px #14324a, 0 0 0 8px #ffbe1f, 0 0 0 11px #05080f; }
.kbback { background-color: var(--back-a); background-image: repeating-conic-gradient(var(--back-b) 0 25%, transparent 0 50%); background-size: 22px 22px; }
.kbfront { transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(#fffbe0, #ffd76a); color: #14324a; }
.kbfront b { font: 400 46px/1 var(--f-label); }
.kbfront small { font: 800 14px/1 var(--f-text); text-transform: uppercase; letter-spacing: .04em; color: #a3201a; }
.kbscene.miss .kbfront { background: #e6edf4; }
.kbscene.miss .kbfront b { color: #3d5263; text-decoration: line-through 4px #c8322c; }
.kbscene.miss .kbfront small { color: #3d5263; }
.kblabel { position: absolute; left: 440px; width: 400px; top: 498px; z-index: 3; text-align: center; font: 400 22px/1 var(--f-label); color: #ffe27a; text-shadow: 2px 2px 0 #05080f; opacity: 0; transition: opacity calc(.25s * var(--t)) linear; }
.kbscene.s3 .kblabel { opacity: 1; }
.kbflash { position: absolute; inset: 0; z-index: 6; background: #fff; opacity: 0; pointer-events: none; }
/* right: a white flash, the attacker lunges through, the defender is thrown back */
.kbscene.hit .kbflash { animation: kbflash calc(.55s * var(--t)) ease-out; }
@keyframes kbflash { 0% { opacity: 0; } 12% { opacity: .95; } 100% { opacity: 0; } }
.kbscene.hit .kbfig.att { z-index: 4; transform: translateX(calc(560px * var(--d))); transition-duration: calc(.2s * var(--t)); transition-timing-function: cubic-bezier(.6, 0, .9, .4); }
.kbscene.hit .kbfig.def .kbmove { animation: kbfall calc(.6s * var(--t)) calc(.16s * var(--t)) cubic-bezier(.2, .7, .3, 1) both; transform-origin: 50% 100%; }
@keyframes kbfall { 0% { filter: brightness(0) invert(1); } 25% { filter: brightness(0) invert(1); } 100% { transform: translateX(calc(-90px * var(--d))) rotate(calc(-24deg * var(--d))); filter: grayscale(1) brightness(.55); } }

.kbscene.miss .kbfig.att { transform: none; }
.kbscene.miss .kbfig.att .kbmove { filter: brightness(.6); transition: filter calc(.3s * var(--t)) linear; }
.kbscene.miss .kbfig.def .kbmove { animation: kbhop calc(.5s * var(--t)) calc(.3s * var(--t)) ease-out; }
@keyframes kbhop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-34px); } 70% { transform: translateY(0); } 85% { transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) {
  #prompt.glow.kb, #dHand.glow.kb { animation: none; box-shadow: var(--notch-4), var(--bevel-4), 0 0 0 7px #e8443a; }
  .kbrays, .kbar.top, .kbar.bot, .kbscene.s2 .kbtitle b, .kbscene.s5 .kbtitle b, .kbscene.s3 .kbcard, .kbscene.s4 .kbcard, .kbscene.hit .kbflash, .kbscene.miss .kbfig.def .kbmove { animation: none; }
  .kbfig, .kbflip { transition: none; }
  .kbscene .kbfig { transform: none; }
  .kbscene.s3 .kbfig.att, .kbscene.hit .kbfig.att { transform: translateX(calc(96px * var(--d))); }
  .kbscene.hit .kbfig.def .kbmove { animation: none; filter: grayscale(1) brightness(.55); }
}
.kbscene.hit .kblabel, .kbscene.hit .kbfig.att .kbname { opacity: 0; transition: none; }

/* ---- escape dice: all the same (they lock together) or not (a short "no break") ---- */
.roll .rnote { padding: 2px 10px 3px; font: 400 20px/1 var(--f-label); color: #dbe9f6; background: #14324ae6; box-shadow: var(--notch-3); white-space: nowrap; visibility: hidden; }
.roll.done .rnote { visibility: visible; }
.roll .rnote.yes { color: #14324a; background: linear-gradient(#ffe27a, #ffb52e); font-size: 24px; }
.roll .rd.odd { opacity: .6; outline: 2px dashed #e8443a; outline-offset: 3px; }
.roll .rdice { transition: gap .15s ease-out; }
.roll.match .rdice { gap: 3px; }
.roll.match .rd, .brk .rd { background: linear-gradient(#fffbe0, #ffe27a); animation: matchglow .28s ease-in-out infinite alternate; }
@keyframes matchglow { from { box-shadow: var(--notch-3), 0 0 0 3px #ffbe1f; } to { box-shadow: var(--notch-3), 0 0 0 6px #fff8e0, 0 0 14px 6px #ffbe1f; } }

/* ---- the chaining breaks: the dice lock, the chain's cards snap apart, the Break bar refills ---- */
.brk { position: absolute; left: 200px; top: 134px; width: 880px; z-index: 42; padding: 4px 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; --t: 1; --edge: #8fe3ff;
  background: linear-gradient(#123a6cf5, #0c2140f5); box-shadow: 0 -6px 0 var(--edge), 0 6px 0 var(--edge), 0 -9px 0 var(--ink), 0 9px 0 var(--ink); animation: kbin calc(.18s * var(--t)) ease-out both; }
.brk.mine { --edge: #7fe08a; background: linear-gradient(#1f6a3cf5, #0f3a2af5); }
.brk.out { animation: kbout calc(.18s * var(--t)) ease-in both; }
.btitle { font: 400 78px/1 var(--f-title); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; opacity: 0;
  background-image: linear-gradient(#ffffff 0%, #c9efff 50%, #5cc4ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: var(--text-edge); }
.brk.mine .btitle { background-image: linear-gradient(#ffffff 0%, #d6ffb0 50%, #62d451 100%); }
.brk.s2 .btitle { opacity: 1; animation: kbslam calc(.36s * var(--t)) cubic-bezier(.2, .9, .3, 1.2) both; }
.bmid { display: flex; align-items: flex-end; justify-content: center; gap: 44px; }
.brk.theirs .bmid { flex-direction: row-reverse; }
.bdice, .bchain { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.bcap { font: 400 20px/1 var(--f-label); color: #fff8e0; white-space: nowrap; }
.bd { display: flex; align-items: center; gap: 6px; height: 50px; }
.bd em { font: 400 34px/1 var(--f-label); font-style: normal; color: #ffe27a; animation: kbin calc(.2s * var(--t)) calc(.25s * var(--t)) linear both; }
.brk .rd { width: 46px; height: 46px; display: grid; place-items: center; font-style: normal; color: #14324a; }
.brk .rd b { font: 400 36px/1 var(--f-label); }
.brk .rd.coin { border-radius: 50%; }
.brk .bd .rd { animation: lockin calc(.32s * var(--t)) cubic-bezier(.3, 1.4, .5, 1) both, matchglow .28s ease-in-out calc(.32s * var(--t)) infinite alternate; }
@keyframes lockin { from { transform: translateY(-22px) scale(1.3) rotate(-12deg); } }
.bcards { display: flex; align-items: center; height: 50px; }
.bcards .half { display: flex; align-items: center; }
.bcards .card { margin: 2px; flex: none; box-shadow: 0 0 0 2px var(--card-edge); }
.bcards .lnk { flex: none; width: 9px; height: 7px; margin: 0 -1px; background: #c9dcef; box-shadow: 0 0 0 2px var(--ink); z-index: 1; position: relative; }
.brk.s2 .bcards .lnk { opacity: 0; }
.brk.s2 .bcards .lnk.mid { opacity: 1; width: 0; background: none; box-shadow: none; }
.brk.s2 .bcards .lnk.mid::after { content: "\2726"; position: absolute; left: -22px; top: -26px; width: 44px; font: 400 48px/1 var(--f-label); text-align: center; color: #fff8e0; text-shadow: 0 0 0 #14324a, 2px 2px 0 #14324a; animation: snapstar calc(.6s * var(--t)) ease-out both; }
@keyframes snapstar { 0% { transform: scale(.2) rotate(0); opacity: 1; } 40% { transform: scale(1.5) rotate(40deg); opacity: 1; } 100% { transform: scale(.9) rotate(90deg); opacity: 0; } }
.brk.s2 .bcards .h1 { animation: snapl calc(.5s * var(--t)) cubic-bezier(.2, .8, .3, 1) both; }
.brk.s2 .bcards .h2 { animation: snapr calc(.5s * var(--t)) cubic-bezier(.2, .8, .3, 1) both; }
@keyframes snapl { 35% { transform: translate(-44px, -10px) rotate(-12deg); } 100% { transform: translate(-22px, 2px) rotate(-5deg); } }

/* the form's name: on the fighter's plate, and in his gauge with three steps and his dice */

<body>
<div class="page">
  <div class="top">
    <h1>1v1 Break</h1>
    <button class="chip" id="menu" type="button" title="Back to the start page">Menu</button>
    <button class="chip" id="newMatch" type="button">New match</button>
    <button class="chip" id="settingsBtn" type="button" title="Sound, computer difficulty and hints">Settings</button>
    <button class="chip" id="speed" type="button" aria-pressed="false">Speed: normal</button>
    <span class="note" id="topNote"></span>
  </div>
  <div class="viewport"><div class="frame" id="frame"></div></div>
  <details class="logbox"><summary>Match log</summary><ol id="log"></ol></details>
</div>
<script>
// ---- referee/engine.mjs (copied by tools/build-game.mjs; edit the original, not this copy) ----
const ENGINE = (() => {
// Headless rules engine for 1v1 Break: the same rules as game.html, no screen.
// Rules version: v1.23 (characters: Default, Swordsman, Archer with poison, Mage with spells, Dragonborn Paladin with bigger dice, Demon with three forms, Vampire with buffs, Cavalryman who lowers the opponent's maximum Break, Sci-fi Gunner with a d14 charge die; comeback: an empty Shield doubles duel dice; a winning Block always hits; completed chains leave the table; decks 1-10 x4, a secret weak point per player (Head, Heart or Throat), chains start with three cards,
// Killing Blow = name one weak point; plus the v1.5 card effects, the deck-out loss and the draw by repetition).
// A Match asks players for decisions through an async ask(player, decision) callback.
// Players are 0 (Player 1, picks first) and 1 (Player 2).

const SETTINGS = {
  barMax: { break: 10, shield: 12, last: 8 },   // Default's bars; each character has its own (CHARACTERS[...].bars)
  diceSides: 6,
  cards: { handSize: 3, setupDiscardDraw: 1 },   // the number deck itself belongs to the character (below)
  deckOutLoses: true,          // a player whose deck reaches 0 cards loses (both in the same round: no winner)
  repetitionDraw: 3,           // both players pick the same move as each other, the same move each time, this many rounds in a row: draw
  comebackDice: 2,             // a player whose Shield is empty rolls this many times the dice for duel damage (Basic, Heavy, Block's hit)
  // a chain starts with three cards (all the same number, or in a row); it grows by adding cards of the same number
  // or the next number up or down, and stays the same type. A play adds any number of cards.
  chain: { minLength: 3, onlyWhileShieldUp: true },
  charge: { attackSides: 8, defendSides: 4, loseHighestOnBreak: false, keepMinimum: 1, poolLimitIsChainLength: true },
  killingBlow: { restartFraction: 0.5 },   // name one weak point; right = win, wrong = the defender's Last restarts at this fraction of THEIR Last maximum
  moves: {
    // card effects (win, lose or tie; cards chosen after the result): swap = one hand card with one card of your own discard pile,
    // cycle = discard one hand card then draw 1, draw = draw 1
    basic: { name: "Basic", beats: "heavy", dice: 1, effect: "swap" },
    heavy: { name: "Heavy", beats: "block", dice: 2, effect: "cycle" },
    block: { name: "Block", beats: "basic", hitDice: 1, heals: true, draw: 1 },   // a winning Block always hits for hitDice, and regains (the character's blockRegain) unless the blocker's bar is full
  },
};

// Characters: each has its own number deck, weak points, Block healing and completed-chain rule. Players choose one before the match.
//   deck: numbers minNumber..maxNumber, `copies` of each (numbers are used only for hands and chains)
//   complete: a same-number chain is complete at `same` cards (and can never hold more); a run is complete when it covers runFrom..runTo
//   bars: the character's Break / Shield / Last (start and maximum). After a Charge the defender's Break refills to their own full Break;
//         after a wrong Killing Blow the defender's Last restarts at half of their own Last maximum.
//   poison: every chain play he makes (new or extended, stopped or landed) poisons the opponent by the chain's length after the play
//         (3 cards = 1, 4 = 2, 5 or more = 3). Poison adds up and lasts all match. At the end of every round the poisoned player takes
//         that much damage: to Break; once Break is 0, to the Shield; once the Shield is 0, to Last (the Shield gone means Last,
//         whatever Break shows). Leftover damage is lost.
//         Poison can empty any bar, so it can open the way to a chain or start a Killing Blow.
//   spells (Mage, rules 1.37): every chain play she makes casts a spell, whether the opponent stops it or lets it land:
//         Freeze (a same-number chain: 3 cards = 1 duel round, 4 = 2): the Mage chooses one of the opponent's moves; they can't use it
//         for that many of their duel rounds (several moves can be frozen at once; the same move keeps the longer freeze; if that leaves
//         them no move, they may still Block). Fire (a run): the Mage chooses one of the opponent's moves and puts (run length - 2) fire
//         stacks on it; they add up and never go away; every duel round the opponent picks that move (win, lose or tie) they take damage
//         equal to its stacks on their current bar (Break, or Last once the Shield is gone). Power (a completed chain, when its cards go
//         back into her deck): one more d6 on every duel hit for the rest of the match (they add up; doubled by the comeback too).
//         The spell goes off once the opponent has stopped the chain or let it land (before any Charge); a landed chain still leads
//         to the normal Charge.
//   poisonDecay / poisonDecayEvery: every poisonDecayEvery-th round in which poison deals damage, the poison on that player drops by
//         poisonDecay (never below 0). The count of damaging rounds starts again when the poison reaches 0.
const CHARACTERS = {
  default: { name: "Default", deck: { minNumber: 1, maxNumber: 10, copies: 4 }, weakPoints: ["Head", "Heart", "Throat"], blockRegain: 2,
             complete: { same: 4, runFrom: 1, runTo: 10 }, bars: { break: 10, shield: 12, last: 8 }, poison: null },
  swordsman: { name: "Swordsman", deck: { minNumber: 1, maxNumber: 8, copies: 5 }, weakPoints: ["Head", "Heart", "Throat"], blockRegain: 3,
               complete: { same: 4, runFrom: 1, runTo: 8 }, bars: { break: 10, shield: 12, last: 8 }, poison: null },
  // Archer: bars are 70% of Default's, rounded (10 -> 7, 12 -> 8, 8 -> 6)
  archer: { name: "Archer", deck: { minNumber: 1, maxNumber: 8, copies: 4 }, weakPoints: ["Head", "Heart", "Throat"], blockRegain: 2,
            complete: { same: 4, runFrom: 1, runTo: 8 }, bars: { break: 7, shield: 8, last: 6 }, poison: { 3: 1, 4: 2, 5: 3 }, poisonDecay: 1, poisonDecayEvery: 2 },   // poison by chain length (5 = 5 or more); it drops by poisonDecay every poisonDecayEvery rounds it deals damage
  // Mage: every chain play she makes casts a spell, stopped or landed (Freeze / Fire, see spellOnStop); a completed chain gives Power
  // (rules 1.38) deck 1-7 x4 plus 5 Jokers (33 cards); a Joker takes whatever number makes the play legal; a chain of only Jokers is a
  // Joker set (only Jokers extend it, up to 5; it casts Freeze; never complete); five Jokers in a set that LANDS win the match
  mage: { name: "Mage", deck: { minNumber: 1, maxNumber: 7, copies: 4, jokers: 5 }, weakPoints: ["Head", "Heart", "Throat"], blockRegain: 2,
          complete: { same: 4, runFrom: 1, runTo: 7 }, bars: { break: 7, shield: 8, last: 6 }, poison: null, spells: true, jokerWin: 5 },   // bars like the Archer's (70% of Default)
  // Dragonborn Paladin: Default's deck, bars 10% bigger than Default (rounded), and bigger dice: every d6 he rolls is a d8 (duel damage),
  // every d8 a d10 (charge), every d4 a d6 (his dice to break free of a chain)
  paladin: { name: "Dragonborn Paladin", deck: { minNumber: 1, maxNumber: 10, copies: 4 }, weakPoints: ["Heart"],   // one weak point: always the Heart
               blockRegain: 2,
             complete: { same: 4, runFrom: 1, runTo: 10 }, bars: { break: 11, shield: 13, last: 9 }, poison: null, dice: { duel: 8, attack: 10, defend: 6 } },
  // Demon: Default's deck, bars and weak points, and three forms: Elegant (start: every die one size smaller: duel d4, charge d6, escape d2),
  // Winged (from the first time his Shield takes damage: normal dice, for good), Demonic (from when his Shield reaches 0: triple duel dice)
  demon: { name: "Demon", deck: { minNumber: 1, maxNumber: 10, copies: 4 }, weakPoints: ["Head", "Heart", "Throat"], blockRegain: 2,
           complete: { same: 4, runFrom: 1, runTo: 10 }, bars: { break: 10, shield: 12, last: 8 }, poison: null, forms: true },
  // Vampire: deck 1-12 x4 (48 cards), Default's bars, one weak point (always the Heart). Three permanent buffs, each unlocked by his first
  // hit of that kind: BREAK (his first duel hit that damages the opponent's Break): from then on (that hit included), every duel hit of his
  // that damages the opponent's Break heals his current bar by 2; if that bar is already full, his Break goes 2 above its maximum.
  // SHIELD (his first charge attack that damages the opponent's
  // Shield): his duel die becomes a d8. LAST (his first duel hit that damages the opponent's Last): he learns the opponent's weak point.
  vampire: { name: "Vampire", deck: { minNumber: 1, maxNumber: 12, copies: 4 }, weakPoints: ["Heart"], blockRegain: 2,
             complete: { same: 4, runFrom: 1, runTo: 12 }, bars: { break: 10, shield: 12, last: 8 }, poison: null, buffs: { shieldDie: 8, breakHeal: 1 } },
  // Cavalryman (pegasus rider): Default's deck, bars and weak points. Charge specialist: every charge attack of his that damages the
  // opponent's Shield lowers the opponent's maximum Break by 2 for the rest of the match (stacking, down to 0; a Break above the new maximum
  // drops to it). When he empties the opponent's Shield he gains one extra die on all his duel hits for the rest of the match. With the
  // comeback double: if his own Shield was already empty, double then +1 (Basic 3, Heavy 5); if it empties later, the extra die is doubled
  // too (Basic 4, Heavy 6).
  cavalryman: { name: "Cavalryman", deck: { minNumber: 1, maxNumber: 10, copies: 4 }, weakPoints: ["Head", "Heart", "Throat"], blockRegain: 2,
             complete: { same: 4, runFrom: 1, runTo: 10 }, bars: { break: 10, shield: 12, last: 8 }, poison: null, cavalry: { breakCut: 2 } },
  // Sci-fi Gunner: the Archer's deck (1-8 x4, 32 cards; complete at four of a number or the run 1-8), bars Break 10 / Shield 12 / Last 6 (Default's Break and Shield),
  // all three weak points, and a d14 charge die (duel d6 and escape d4 as normal). One GUNNER CHARGE per match (it never comes back):
  // each one either replays a duel round once it is revealed (both players pick again; not a chain round, a Charge or a Killing Blow) or
  // re-rolls one whole roll of dice, his or the opponent's (a duel damage roll, a charge die, or the escape dice after the keep-and-reroll).
  // Each round / roll can be changed only once. They can never change a Killing Blow guess.
  gunner: { name: "Sci-fi Gunner", deck: { minNumber: 1, maxNumber: 8, copies: 4 }, weakPoints: ["Head", "Heart", "Throat"], blockRegain: 2,
             complete: { same: 4, runFrom: 1, runTo: 8 }, bars: { break: 10, shield: 12, last: 6 }, poison: null, dice: { duel: 6, attack: 14, defend: 4 }, gunnerCharges: 1 },
};
const cardStr = c => c === 0 ? "J" : String(c);   // 0 = a Joker (the Mage's wild card)
const charText = c => `${c.name}: deck ${c.deck.minNumber}-${c.deck.maxNumber} x${c.deck.copies}${c.deck.jokers ? ` + ${c.deck.jokers} Jokers (J: each one counts as whatever number makes the chain play legal; a chain of only Jokers is a Joker set, extended only by Jokers, up to ${c.jokerWin}; a Joker set of ${c.jokerWin} that LANDS wins the match)` : ""} (${(c.deck.maxNumber - c.deck.minNumber + 1) * c.deck.copies + (c.deck.jokers || 0)} cards), bars Break ${c.bars.break} / Shield ${c.bars.shield} / Last ${c.bars.last}, weak points ${c.weakPoints.join("/")}, Block regains ${c.blockRegain}, a chain is complete at ${c.complete.same} of one number (never more) or the full run ${c.complete.runFrom}-${c.complete.runTo}${c.spells ? "; Spells on every chain play she makes (stopped or landed): Freeze (a same-number chain: she picks one of the opponent's moves they can't use for 1 duel round with 3 cards, 2 with 4), Fire (a run: she puts run length - 2 fire stacks on one of the opponent's moves; they never go away, and every duel round the opponent picks that move they take that much damage on their current bar), Power (every chain she completes gives her one more d6 on every duel hit for the rest of the match, doubled by comeback too)" : ""}${c.buffs ? "; Buffs, each unlocked for good by his first damaging hit on that bar: BREAK (each of his hits on the opponent's Break heals his current bar 2, or takes his Break 2 above its maximum), SHIELD (duel die d8), LAST (learns the opponent's weak point)" : ""}${c.cavalry ? `; Charge specialist: every charge attack of his that damages the opponent's Shield lowers the opponent's maximum Break by ${c.cavalry.breakCut} for the rest of the match (stacking, down to 0; a Break above the new maximum drops to it); when he empties the opponent's Shield he gains one extra die on all his duel hits (Basic, Heavy, Block's hit) for the rest of the match (if his own Shield was already empty: double, then +1; if it empties later: the extra die is doubled too)` : ""}${c.forms ? "; Three forms: ELEGANT from the start (every die one size smaller: duel d4, charge d6, escape d2), WINGED from the first Shield damage (normal dice, for good), DEMONIC once his Shield is 0 (duel hits roll triple dice)" : ""}${c.gunnerCharges ? `; ${c.gunnerCharges} Gunner charge${c.gunnerCharges > 1 ? "s" : ""} per match (never refilled): each replays a revealed duel round (both pick again) or re-rolls one whole roll of dice, his or the opponent's (duel damage, a charge die, or the final escape dice); each round or roll only once; never a Killing Blow guess` : ""}${c.dice ? `; Dice: duel d${c.dice.duel} (normal d6), charge d${c.dice.attack} (normal d8), escape d${c.dice.defend} (normal d4)` : ""}${c.poison ? "; Poison: every chain play he makes poisons the opponent (chain of 3 = 1, 4 = 2, 5+ = 3 per round, adding up; it drops by 1 every two rounds it deals damage; it hits Break, then Shield, then Last)" : ""}`;

const sum = a => a.reduce((x, y) => x + y, 0);
const NAME = p => `Player ${p + 1}`;
const MOVES = ["basic", "heavy", "block"];

class Match {
  // characters: [key, key] chosen in advance, or leave a seat null to ask that player before the match
  constructor({ ask, rng = Math.random, maxRounds = 60, characters = [null, null] }) {
    this.ask = ask; this.rng = rng; this.maxRounds = maxRounds;
