  }
  // A roll of dice (kind: "duel", "charge die" or "escape"; roller = who rolled it): a Gunner with a charge left may re-roll the whole roll
  // once. ctx describes what the roll does. Returns the dice that stand.
  async offerReroll(kind, roller, rolls, sides, ctx = {}) {
    for (const g of [0, 1]) {
      if (!this.gCharges[g]) continue;
      const own = roller === g;
      const res = await this.ask(g, { kind: "reroll", ctx: { ...ctx, kind, own, rolls, sides },
        prompt: `GUNNER CHARGE (${this.gCharges[g]} left): ${own ? "your" : "the opponent's"} ${kind === "duel" ? "duel damage" : kind === "charge die" ? "charge die" : "escape dice"} roll is d${sides}: ${rolls.join(", ")}. Spend a charge to re-roll the whole roll (once), or keep it?`,
        legal: ["reroll", "keep"], parse: t => ["reroll", "keep"].includes(t.trim().toLowerCase()) ? { ok: true, value: t.trim().toLowerCase() } : { ok: false, error: "Use \"reroll\" or \"keep\"." } });
      if (res.value === "reroll") {
        const key = `${own ? "own" : "their"} ${kind}`, R = this.metrics.gunner.rerolls[g];
        this.gCharges[g]--; R[key] = (R[key] || 0) + 1;
        const fresh = this.roll(rolls.length, sides);
        this.keyDecisions.push({ round: this.round, player: g, kind: "gunner reroll", action: `${key}: ${rolls.join(",")} -> ${fresh.join(",")}`, reason: res.reason || "" });
        this.say(`${NAME(g)} spends a Gunner charge (${this.gCharges[g]} left) to re-roll ${own ? "their own" : `${NAME(roller)}'s`} ${kind} roll: ${rolls.join(", ")} → ${fresh.join(", ")}.`);
        return fresh;
      }
    }
    return rolls;
  }

  async resolveDuel(mv) {
    const [a, b] = mv.map(m => m.key), M = SETTINGS.moves, B = this.bars;
    let text, vampGrow = null;
    if (a === b) text = `${NAME(0)} and ${NAME(1)} both played ${M[a].name}: nothing happens.`;
    else {
      const w = M[a].beats === b ? 0 : 1, l = 1 - w, m = M[mv[w].key];
      const head = `${NAME(0)} played ${M[a].name}, ${NAME(1)} played ${M[b].name}.`;
      // every win hits the loser's current bar (Basic 1 die, Heavy 2 dice, Block 1 die); Block also regains unless the blocker's bar is full
      const regain = m.heals ? this.ch(w).blockRegain : 0, healBar = this.currentBar(w), canHeal = !!regain && !this.barFull(w);
      const comeback = B[w].shield === 0 ? (this.form[w] === "demonic" ? 3 : SETTINGS.comebackDice) : 1;   // comeback: an empty Shield rolls double (the Demonic form triple)
      const base = (m.dice || m.hitDice) + this.power[w], xd = this.extraDie[w], nDice = xd === "before" ? (base + 1) * comeback : xd === "after" ? base * comeback + 1 : base * comeback;   // Cavalryman's extra die
      if (xd) this.metrics.cavalry.extraDieHits[w]++;
      if (this.power[w]) this.metrics.spells.powerHits[w]++;
      const bar = this.currentBar(l), dS = this.sides(w, "duel");
      let rolls = this.roll(nDice, dS);
      if (this.gCharges[0] || this.gCharges[1]) rolls = await this.offerReroll("duel", w, rolls, dS, { target: l, bar, barLeft: B[l][bar], move: mv[w].key });
      const total = sum(rolls);
      const barBefore = B[l][bar];
      B[l][bar] = Math.max(0, B[l][bar] - total);
      if (this.buff[w] && B[l][bar] < barBefore) vampGrow = { w, bar };
      if (m.heals) this.metrics.blockCounters[w]++;
      text = `${head} ${NAME(w)} wins${comeback > 1 ? " (comeback: their Shield is empty, so double dice)" : ""}${xd ? ` (Cavalryman's extra die${comeback > 1 ? (xd === "before" ? ", doubled too" : ", added after the double") : ""})` : ""}: dice ${rolls.join("+")} = ${total} damage to ${NAME(l)}'s ${bar}.`;
      if (m.heals) {
        if (canHeal) { B[w][healBar] = Math.max(B[w][healBar], Math.min(this.max(w, healBar), B[w][healBar] + regain)); text += ` ${NAME(w)}'s Block also regains ${regain} ${healBar}.`; }
        else text += ` ${NAME(w)}'s ${healBar} bar is already full, so no regain.`;
      }
      if (bar === "break" && B[l].break === 0) text += ` ${NAME(l)} is Broken.`;
      if (bar === "last" && B[l].last === 0) text += ` ${NAME(l)}'s Last bar is empty: ${NAME(w)} can try a Killing Blow with a chain from next round.`;
    }
    // Mage's Fire: a player who picked a move with fire stacks on it takes that much damage on their current bar (win, lose or tie)
    for (const p of [0, 1]) {
      const st = this.fire[p][mv[p].key]; if (!st) continue;
      const bar = this.currentBar(p), before = B[p][bar], dmg = Math.min(st, before), S = this.metrics.spells;
      B[p][bar] = before - dmg; S.fireHits[1 - p]++; S.fireDamage[1 - p] += dmg;
      text += ` Fire: ${NAME(p)}'s ${SETTINGS.moves[mv[p].key].name} burns them for ${st}${dmg < st ? ` (only ${dmg} left on their ${bar})` : ""} on their ${bar} (now ${B[p][bar]}).`;
      if (bar === "break" && dmg && B[p].break === 0) text += ` ${NAME(p)} is Broken.`;
      if (bar === "last" && dmg && B[p].last === 0) { text += ` ${NAME(p)}'s Last bar is empty: ${NAME(1 - p)} can try a Killing Blow with a chain from next round.`; S.fireKBs[1 - p]++; }
    }
    this.say(text);
    const out = [];
    [0, 1].forEach(p => {
      const m = M[mv[p].key], P = this.pl[p];
      if (!m.draw) return;
      if (P.deck.length) { const c = P.deck.shift(); P.hand.push(c); this.say(`You draw a ${cardStr(c)} (deck ${P.deck.length} left).`, [p]); this.say(`${NAME(p)} draws a card (deck ${P.deck.length} left).`, [1 - p]); }
      if (SETTINGS.deckOutLoses && P.deck.length === 0) out.push(p);
    });
    // Vampire: his first damaging hit on the opponent's Break / Last unlocks that buff for good; with the Break buff, every damaging hit on
    // their Break heals him
    if (vampGrow) {
      this.unlockBuff(vampGrow.w, vampGrow.bar);
      if (vampGrow.bar === "break" && this.buff[vampGrow.w].break) this.breakHeal(vampGrow.w);
    }
    return out;
  }

  // Basic / Heavy card effects, chosen after the result (Block's draw already happened in resolveDuel)
  async cardEffect(p, key, deckOut) {
    const e = SETTINGS.moves[key].effect, P = this.pl[p];
    if (e === "swap" && P.hand.length && P.discard.length) {
      const res = await this.ask(p, {
        kind: "basic-swap",
        prompt: `BASIC card effect: swap one card from your hand with one card from your own discard pile. Hand: ${P.hand.map((c, i) => `${i + 1}:${c}`).join("  ")}. Discard pile: ${P.discard.map((c, i) => `${i + 1}:${c}`).join("  ")}.`,
        legal: [`swap <hand position 1-${P.hand.length}> <discard position 1-${P.discard.length}>`],
        parse: str => {
          const t = str.trim().toLowerCase().split(/\s+/), h = Number(t[1]), d = Number(t[2]);
          if (t[0] !== "swap" || t.length !== 3 || !Number.isInteger(h) || h < 1 || h > P.hand.length || !Number.isInteger(d) || d < 1 || d > P.discard.length) return { ok: false, error: `Use: swap <hand position 1-${P.hand.length}> <discard position 1-${P.discard.length}>.` };
          return { ok: true, value: [h - 1, d - 1] };
        },
      });
      const [h, d] = res.value, out = P.hand[h], inn = P.discard[d];
      P.hand[h] = inn; P.discard.splice(d, 1); P.discard.push(out);
      this.say(`${NAME(p)}'s Basic: they swap a ${cardStr(out)} from their hand for the ${cardStr(inn)} from their discard pile.`);
    } else if (e === "cycle" && P.hand.length) {
      const res = await this.ask(p, {
        kind: "heavy-cycle",
        prompt: `HEAVY card effect: discard one card from your hand, then draw 1. Hand: ${P.hand.map((c, i) => `${i + 1}:${c}`).join("  ")}. Your deck: ${P.deck.length} cards (you lose if it reaches 0).`,
        legal: [`discard <hand position 1-${P.hand.length}>`],
        parse: str => { const t = str.trim().toLowerCase().split(/\s+/), n = Number(t[1]); return t[0] === "discard" && t.length === 2 && Number.isInteger(n) && n >= 1 && n <= P.hand.length ? { ok: true, value: n - 1 } : { ok: false, error: `Use: discard <hand position 1-${P.hand.length}>.` }; },
      });
      const [gone] = P.hand.splice(res.value, 1); P.discard.push(gone);
      this.say(`${NAME(p)}'s Heavy: they discard a ${cardStr(gone)}.`);
      if (P.deck.length) { const c = P.deck.shift(); P.hand.push(c); this.say(`You draw a ${cardStr(c)} (deck ${P.deck.length} left).`, [p]); this.say(`${NAME(p)} draws a card (deck ${P.deck.length} left).`, [1 - p]); }
      if (SETTINGS.deckOutLoses && P.deck.length === 0 && !deckOut.includes(p)) deckOut.push(p);
    }
  }

  async special(p, v) { return this.chainScene(p, v); }

  async chainScene(att, v) {
    const def = 1 - att, P = this.pl[att], vals = v.idx.map(i => P.hand[i]);
    [...v.idx].sort((x, y) => y - x).forEach(i => P.hand.splice(i, 1));
    let ch;
    if (v.opt.type === "add") ch = this.chains[att][v.opt.ci];
    else { ch = { cards: [], kind: null, chained: false }; this.chains[att].push(ch); }
    if (vals.includes(0) || ch.kind === "joker" || ch.jokers) {   // Mage's Jokers
      const plan = this.planChain(v.opt.type === "add" ? ch : null, vals, att, v.opt.want || null);
      Object.assign(ch, { cards: plan.cards, kind: plan.kind, real: plan.real, jokers: plan.jokers, chained: false });
    } else { ch.cards = ch.cards.concat(vals).sort((x, y) => x - y); ch.kind = this.validChain(ch.cards, att); ch.chained = false; }
    const ci = this.chains[att].indexOf(ch), n = ch.cards.length;
        // Poison: every chain play poisons the opponent by the chain's length after the play
    const dose = this.poisonFor(att, n);
    if (dose) {
      this.poison[1 - att] += dose; this.metrics.poison.applied[att] += dose; this.metrics.poison.plays[att]++;
      this.say(`${NAME(att)}'s chain of ${n} poisons ${NAME(1 - att)} for ${dose} more: ${NAME(1 - att)} now takes ${this.poison[1 - att]} poison damage at the end of every round.`);
    }
    this.stages.chain++;
    this.say(`${NAME(att)} ${v.opt.type === "add" ? `adds ${vals.map(cardStr).join(", ")} to chain #${ci + 1}` : `plays a new chain (their chain #${ci + 1})`}: ${this.chainStr(ch)} (${n} links)${ch.kind === "joker" ? `, a JOKER SET (${ch.cards.length} of ${this.ch(att).jokerWin}: if ${this.ch(att).jokerWin} land, ${NAME(att)} wins)` : ""}${this.isComplete(ch, att) ? ", which COMPLETES it (it leaves the table once this play is resolved)" : this.oneAway(ch, att) ? (ch.kind === "joker" ? ", ONE JOKER FROM WINNING THE MATCH" : ", ONE CARD FROM COMPLETE") : ""}.`);
    const D = this.pl[def], kb = this.kbReady[att] && this.bars[def].last === 0;
    if (kb) { this.metrics.kb.chains[att]++; this.say(`It is a KILLING BLOW chain: if ${NAME(def)} lets it land, ${NAME(att)} names a weak point.`); }
    const res = await this.ask(def, {
      kind: "defend", kb,
      prompt: `${kb ? "KILLING BLOW " : ""}CHAIN: ${NAME(att)} played chain ${this.chainStr(ch)} (${n} links) on you.${kb ? " Your Last is 0: if it lands, they name one weak point and win if it is yours." : ""}${ch.kind === "joker" && n >= this.ch(att).jokerWin ? " FIVE JOKERS: if it lands, they win the match." : ""} Stop the chaining by discarding exactly ${n} cards from your hand, or let it land (${kb ? "no Charge: they make the Killing Blow" : `you are chained and a Charge starts with ${n} d4 for you; their d8 pool can hold at most ${n} dice`}).`,
      legal: D.hand.length >= n ? [`stop <${n} distinct hand positions>`, "land"] : ["land   (you hold too few cards to stop it)"],

          if (idx.length !== n || idx.some(x => !Number.isInteger(x) || x < 1 || x > D.hand.length) || new Set(idx).size !== n) return { ok: false, error: `Give exactly ${n} distinct hand positions.` };
          return { ok: true, value: idx.map(x => x - 1) };
        }
        return { ok: false, error: "Use \"stop ...\" or \"land\"." };
      },
    });
    this.keyDecisions.push({ round: this.round, player: def, kind: res.value ? "stop chain" : "let chain land", action: res.action, reason: res.reason || "" });
    if (res.value) {
      const gone = res.value.map(i => D.hand[i]);
      [...res.value].sort((x, y) => y - x).forEach(i => D.hand.splice(i, 1));
      D.discard.push(...gone); this.metrics.chainsStopped++; if (kb) this.metrics.kb.stopped[att]++;
      this.say(`${NAME(def)} discards ${gone.map(cardStr).join(", ")} and stops the chaining.${this.isComplete(ch, att) ? "" : " The chain stays on the table."}`);

  }

  async chargeScene(att, ci) {
    const def = 1 - att, C = SETTINGS.charge, ch = this.chains[att][ci], n = ch.cards.length, pool = this.d8[att];
    const aS = this.sides(att, "attack"), dS = this.sides(def, "defend"), E = this.metrics.escape;
    this.stages.charge++; E.charges[def]++;
    const elegantDef = this.form[def] === "elegant"; if (elegantDef) E.chargesElegant[def]++;
    if (C.poolLimitIsChainLength && pool.length >= n) {
      pool.sort((x, y) => y - x); const dropped = pool.splice(n - 1);
      this.say(`${NAME(att)}'s d8 pool can hold at most ${n} dice with this chain, so they drop ${dropped.join(", ")} (pool now ${pool.join("+") || "empty"}).`);
    }
    let charges = 0, d4 = [];
    while (true) {
      if (charges > 0) {
        const full = pool.length >= n, total = sum(pool), hi = Math.max(...d4), dmg = Math.max(0, total - hi), bank = full && !!this.ch(att).forms;   // Demon (rules 1.39): may bank a full pool
        const res = await this.ask(att, {
          kind: "charge",
          prompt: `CHARGE: your d${aS} pool is ${pool.join("+")} = ${total} (${pool.length} of at most ${n} dice). ${NAME(def)}'s d${dS}: ${d4.join(", ")} (highest ${hi}). Attack now for ${total} - ${hi} = ${dmg} Shield damage (spends every die in the pool)` +
            (full ? (bank ? ". Your pool is full: attack, or BANK it (end the Charge without attacking and keep your dice for your next Charge; their Break refills)." : ". Your pool is full, so you must attack.") : `, or charge again (roll another d${aS}; the opponent rolls ${n} new d${dS} and if they all match the chaining breaks, you keep your pool).`),
          legal: full ? (bank ? ["attack", "bank"] : ["attack"]) : ["charge", "attack"],
          parse: s => { const t = s.trim().toLowerCase(); return t === "attack" || (t === "charge" && !full) || (t === "bank" && bank) ? { ok: true, value: t } : { ok: false, error: full ? (bank ? "Your pool is full: attack or bank." : "Your pool is full: attack.") : "Use \"charge\" or \"attack\"." }; },
        });
        if (res.value === "bank") {
          this.keyDecisions.push({ round: this.round, player: att, kind: "bank", action: `bank ${pool.join("+")}`, reason: res.reason || "" });
          this.metrics.bank[att]++; ch.chained = false;
          this.bars[def].break = Math.max(this.bars[def].break, this.max(def, "break"));
          this.say(`${NAME(att)} banks the full pool (${pool.join("+")} = ${total}) instead of attacking: the Charge ends and they keep their d${aS} for their next Charge. ${NAME(def)}'s Break is back to ${this.bars[def].break}.${this.isComplete(ch, att) ? "" : " The chain stays on the table."}`);
          this.retireIfComplete(att, ch);
          return;
        }
        if (res.value === "attack") {
          this.keyDecisions.push({ round: this.round, player: att, kind: "attack", action: `attack: ${total} - ${hi} = ${dmg}`, reason: res.reason || "" });
          this.d8[att] = [];
          E.attacks[def]++; E.blocked[def] += Math.min(hi, total); E.d8Faced[def] += total;
          this.bars[def].shield = Math.max(0, this.bars[def].shield - dmg);
          this.updateForms();
          if (this.buff[att] && dmg > 0) this.unlockBuff(att, "shield");
          if (this.ch(att).cavalry && dmg > 0) this.cavalryHit(att, def);
          this.bars[def].break = Math.max(this.bars[def].break, this.max(def, "break"));
          this.metrics.attacksOn[def]++;
          if (this.bars[def].shield === 0 && this.metrics.attacksToEmptyShield[def] === null) this.metrics.attacksToEmptyShield[def] = this.metrics.attacksOn[def];
          this.say(`${NAME(att)} attacks, spending every d${aS}: ${total} - ${hi} = ${dmg} damage to ${NAME(def)}'s Shield. ${NAME(def)}'s Break is back to ${this.bars[def].break}.${this.bars[def].shield === 0 ? ` ${NAME(def)}'s Shield is gone: final stage.` : ""}`);
          if (this.bars[def].shield === 0) this.stages.shieldGone[def] = true;
          this.retireIfComplete(att, ch);
          return;
        }
        this.keyDecisions.push({ round: this.round, player: att, kind: "charge again", action: "charge", reason: res.reason || "" });
      }
      let got = this.roll(1, aS);
      if (this.gCharges[0] || this.gCharges[1]) got = await this.offerReroll("charge die", att, got, aS, { pool: sum(pool), shieldLeft: this.bars[def].shield });
      pool.push(...got); charges++; E.chargeRolls[def]++;
      d4 = this.roll(n, dS);
      this.say(`${NAME(att)} charges: d${aS} = ${got[0]} (pool ${pool.join("+")} = ${sum(pool)}, ${pool.length}/${n} dice). ${NAME(def)} rolls ${n} d${dS}: ${d4.join(", ")}.`);
      if (!d4.every(v => v === d4[0])) {

//  - REPLAY a revealed duel round he is losing if the opponent played Heavy, or if their hit could empty his current bar;
//  - RE-ROLL his own duel damage if it falls short of emptying the opponent's current bar, could have emptied it, and is below average;
//  - RE-ROLL the opponent's duel damage if it would empty his current bar, or (on his Last) if it is above average;
//  - RE-ROLL his own charge die if it shows a quarter of its sides or less; the opponent's if it shows more than three quarters;

  // placeholder figure: blocks on a 40 x 48 grid in the character's colours, with a one-pixel outline

  function drawPlaceholder(cv, key, form) {

    const c = cv.getContext('2d'), [main, dark, trim] = F ? FORMS[F].look : (COLOURS[key] || COLOURS.swordsman);

  /* A fighter on the stage. pose(action, ms): several frames are played in order; a single frame (or none: the standing

  const MODES = {
    duel: { dockY: 450, fw: 330, fh: 340, scale: 2, step: 0 },
    chain: { dockY: 400, fw: 290, fh: 290, scale: 1.5, step: 1 },

  /* ---------------- the match ---------------- */
  let G = null;            // the current game: { match, bot, chars, view, events, fighters, mode, ... }
  let speed = 1;           // 1 normal, 0.45 fast

  /* ---------------- sound ---------------- */
  // Every sound is made in code (SFX, from game-src/sounds.js): no sound files. One audio output, opened on the first click
  // (browsers allow no sound before that): sounds -> volume -> limiter -> speakers. Nothing here ever stops the game:
  // with no audio, with Sound off, or at speed 0 (the quick self-play test) sfx() simply does nothing.
  const SND = { on: true, vol: 50, ctx: null, master: null, live: [], last: {}, click: null, log: null };
  try {
    if (localStorage.getItem('break-sound-on') === '0') SND.on = false;
    const v = localStorage.getItem('break-sound-volume'), n = Number(v);
    if (v !== null && v !== '' && n >= 0 && n <= 100) SND.vol = Math.round(n);
  } catch (e) { /* no storage: the defaults */ }

  const volGain = () => Math.pow(SND.vol / 100, 1.6);

  // called on a click: opens (or wakes) the audio output

  // Play the sound chosen for a moment (an id from sounds/approved.json). o.delay: milliseconds from now.
  // The same sound never starts twice within 60 ms (o.gap changes that), and only a few sounds ring at once: the oldest is cut.
  function sfx(id, o = {}) {
    try {
      if (!HAVE_SFX || !SND.on || !(speed > 0)) return;
      const recipe = SFX.SOUNDS[id]; if (!recipe) return;
      const now = performance.now(), delay = Math.max(0, o.delay || 0), at = now + delay;
      if (SND.last[id] !== undefined && Math.abs(at - SND.last[id]) < (o.gap || 60)) return;

      if (ctx.state !== 'running') { if (!SND.click) return; ctx.resume().catch(() => {}); }      // still asleep and no click to wake it: stay silent

  function cue(id, delay, voiced) { if (G && G.skip) return; (voiced ? announce : sfx)(id, { delay }); }
  function sfxStop(id) {      // id: only that sound; no id: every sound
    try { SND.live = SND.live.filter(v => { if (id && v.id !== id) return true; v.h.stop(); if (v.note && SND.ctx && v.end - .1 > SND.ctx.currentTime) v.note.cut = true; return false; }); } catch (e) { SND.live = []; }
  }
  // how long ago (ms) a sound last started; how long (ms) one of these sounds will still ring
  const sfxSince = id => SND.last[id] === undefined ? Infinity : performance.now() - SND.last[id];
  const sfxRinging = ids => { try { return SND.ctx ? Math.max(0, ...SND.live.filter(v => ids.includes(v.id)).map(v => (v.end - SND.ctx.currentTime) * 1000)) : 0; } catch (e) { return 0; } };
  // a click whose result makes its own sound at once (a chain laid down, dice rolled): no button click on top of it
  const quietClick = () => { if (SND.click) SND.click.sounded = true; };
  // a short beat, so two sounds that follow each other are heard one after the other
  async function beat() { const ms = G && G.beat ? G.beat - performance.now() : 0; if (G) G.beat = 0; if (ms > 0 && speed > 0) await sleep(ms); }

  // The sounds of one sentence of the engine, timed with what animate() and the scenes show (ms from now; t is the speed).
  // The scenes (dice, CHAIN BROKEN, CHAIN STOPPED, the Killing Blow, a change of form) play their own sounds.
  function eventSounds(raw, prev, now, major, changed) {
    G.sfxShift = 0;
    if (G.skip || !(speed > 0) || !SND.on) return;
    const t = speed, q = [], add = (id, ms = 0, voiced = false) => q.push([id, ms, voiced]);
    const lost = (p, b) => prev ? prev.bars[p][b] - now.bars[p][b] : 0;
    let lead = false, noShift = false, m;      // lead: a big sound leads this moment, so no stage-change sound on top of it
    // the bars after a hit at `at`: one sound for the hurt, then one for the bar (the biggest news only)
    const bars = (at, small) => [0, 1].forEach(p => {
      const dB = lost(p, 'break'), dS = lost(p, 'shield'), dL = lost(p, 'last'), B = now.bars[p];
      if (!(dB > 0 || dS > 0 || dL > 0)) return;
      const big = dL > 0 && B.last === 0 ? 'last-empty' : dS > 0 ? (B.shield === 0 ? 'shield-empty' : 'shield-hit') : dB > 0 && B.break === 0 ? 'break-empty' : null;
      if (!small) add('hurt', at + 80);
      if (big || !small) add(big || 'damage-number', at + 220);
      if (dS > 0 && B.shield === 0 && !now.form[p]) add('comeback', at + 1000);      // from now on this player rolls double dice (the Demon turns Demonic instead)
    });
    if ((m = raw.match(/^Player 1 played (\w+), Player 2 played (\w+)\. Player (\d) wins/))) {
      const mv = m[3] === '1' ? m[1] : m[2], hit = (mv === 'Block' ? 900 : 360) * t;
      add('reveal'); lead = true;
      if (mv === 'Block') add('block-counter', Math.max(120, hit - 130));      // the clang, then the hit back lands with the strike
      else { add('lunge', 200 * t); add(mv === 'Heavy' ? 'heavy-hit' : 'basic-hit', hit); }
      bars(hit);
      if (/Block also regains/.test(raw)) add('heal', hit + 450);
      if (/ Fire: Player \d's/.test(raw)) add('fire-burn', hit + 620);
    } else if ((m = raw.match(/^Player 1 and Player 2 both played (\w+)/))) {
      add('reveal'); lead = true; if (m[1] !== 'Block') add('lunge', 200 * t);
      add('tie', 420 * t);
      if (/ Fire: Player \d's/.test(raw)) { add('fire-burn', 420 * t + 260); bars(420 * t + 260); }
    } else if ((m = raw.match(/^Player (\d) attacks, spending/))) {
      const hit = 360 * t;
      add('charge-attack', Math.max(0, hit - 360));      // the charge-up ends in the blast, on the hit
      bars(hit);
      if (lost(2 - m[1], 'break') < 0) add('break-refill', hit + 720);
    } else if (/^Player \d's Killing Blow chain landed/.test(raw)) lead = true;      // (kbIntro)
    else if (/the chaining breaks|stops the chaining/.test(raw) || FORM_EVT.test(raw)) lead = true;      // (breakScene, stopScene, formScene)
    else if ((m = raw.match(/^Player \d names \w+: (it is|wrong)/))) { add(m[1] === 'wrong' ? 'kb-wrong' : 'kb-right', 0, true); lead = true; }      // (only when the scene was hurried away)
    else if ((m = raw.match(/^Player \d (plays a new chain|adds .* to chain)/))) {
      const kb = !!G.events[0] && /^It is a KILLING BLOW chain/.test(G.events[0].raw);
      add(kb ? 'kb-chain' : m[1] === 'plays a new chain' ? 'chain-new' : 'chain-add'); if (kb) lead = true;
      if (/ONE JOKER FROM WINNING THE MATCH/.test(raw)) add('joker-warning', kb ? 900 : 450);
    } else if (/'s chain of \d+ poisons/.test(raw)) add('poison-applied', 380);      // told just before the chain itself: heard just after it
    else if ((m = raw.match(/^(Poison|Burn): Player \d takes (\d+) damage/))) { if (m[2] !== '0') { add(m[1] === 'Poison' ? 'poison-tick' : 'fire-burn'); bars(0, true); } }
    else if (/^Spell — Freeze/.test(raw)) add('freeze', 0, true);
    else if (/^Spell — Fire/.test(raw)) add('fire', 0, true);
    else if (/^Spell — Power/.test(raw)) add('power');
    else if (/^Spell — FIVE JOKERS/.test(raw)) { add('five-jokers', 0, true); lead = true; }
    else if (/is complete: it leaves the table/.test(raw)) { add('chain-complete'); add('shuffle-back', 380); }
    else if (/^Player \d (lets it land|can't stop it)/.test(raw)) add('chain-lands');
    else if (/^Player \d charges: d/.test(raw)) { add('charge-die', changed ? 90 : 0); noShift = true; }      // (the dice are already rolling)
    else if (/banks the full pool/.test(raw)) { add('bank'); add('break-refill', 450); }
    else if ((m = raw.match(/^Vampire: Player \d unlocks the (\w+) buff/))) { add('vampire-buff'); if (m[1] === 'LAST') add('vampire-knows', 420); }
    else if (/^Vampire's Break buff: /.test(raw)) add('vampire-heal');
    else if (/^Cavalryman: .* maximum Break drops/.test(raw)) add('cavalry-cut');
    else if (/^Cavalryman: .* gains an extra die/.test(raw)) add('cavalry-die');
    else if (/is cancelled and the round is replayed/.test(raw)) add('gunner-replay');
    else if (/spends a Gunner charge .* to re-roll/.test(raw)) add('gunner-reroll');
    else if (/^Player 2 can make a Killing Blow from next round/.test(raw)) add('kb-danger', Math.max(0, 700 - sfxSince('last-empty')));
    else if ((m = raw.match(/^Draw-by-repetition count: (\d+) of (\d+)/))) { if (Number(m[1]) === Number(m[2]) - 1) add('repetition-warning'); }
    else if (/deck has run out|Both decks have run out/.test(raw)) { add('deck-out'); lead = true; }
    else if (/^You draw your starting hand|^Your weak point is/.test(raw)) add('draw', 260);      // (your weak-point sound came with your click)
    else if (/^You draw a |^Player 2 draws a card/.test(raw)) add('draw');
    else if (/^Player 2 places their weak point/.test(raw)) add('weak-point');
    else if (/^You discard a .* and draw a |^Player 2 discards a .* and draws a card/.test(raw)) add('mulligan');
    else if (/'s Heavy: they discard/.test(raw)) add('discard');
    else if (/'s Basic: they swap/.test(raw)) add('basic-swap');
    if (prev && prev.deck[0] > 3 && now.deck[0] <= 3 && now.deck[0] > 0) add('deck-low', 320);      // your deck: 3 cards or fewer left
    let shift = 0; const at = performance.now();
    if (changed && !lead) { sfx('stage-change', { gap: 450 }); if (!noShift) shift = G.sfxShift = 170; }      // the moment track moved: its sound first, the rest just after
    if (!major && q.length && !noShift) {      // small events come in a burst: heard one after the other (and dropped rather than heard late)
      shift = Math.max(shift, (G.minorAt || 0) - at);
      if (shift > 450 && q.every(c => ['draw', 'discard', 'basic-swap', 'mulligan'].includes(c[0]))) return;
      G.minorAt = at + shift + 110;
    }
    q.forEach(([id, ms, voiced]) => { cue(id, shift + ms, voiced); G.cueEnd = Math.max(G.cueEnd || 0, at + shift + ms); });
  }

  class ArenaMatch extends Match {
    say(text, who = [0, 1]) {
      super.say(text, who);
      if (G && G.match === this && who.includes(0)) G.events.push({ raw: text, snap: snapshot(this) });
    }
  }

  function snapshot(m) {
    const P = m.pl;
    return {
      round: m.round, over: m.over, winner: m.winner, endReason: m.endReason, chars: [...m.chars],
      bars: m.bars.map(b => ({ ...b })), max: [0, 1].map(p => ({ break: m.max(p, 'break'), shield: m.max(p, 'shield'), last: m.max(p, 'last') })),
      hand: P[0].hand.slice(), oppHand: P[1].hand.length, deck: [P[0].deck.length, P[1].deck.length],
      jokersLeft: [0, 1].map(p => P[p].deck.filter(c => c === 0).length),
      discard: [P[0].discard.slice(), P[1].discard.slice()], weak: P[0].weak,
      chains: m.chains.map((cs, p) => cs.map(c => ({ cards: c.cards.slice(), kind: c.kind, jokers: c.jokers || 0, chained: c.chained, oneAway: m.oneAway(c, p), complete: m.isComplete(c, p) }))),
      d8: m.d8.map(x => x.slice()), poison: [...m.poison], burn: [...m.burn],
      frozen: m.frozen.map(f => ({ ...f })), fire: m.fire.map(f => ({ ...f })), power: [...m.power], form: [...m.form],
      buff: m.buff.map(b => b ? { ...b } : null), breakCut: [...m.breakCut], extraDie: [...m.extraDie], gCharges: [...m.gCharges],
      rep: { count: m.repCount, move: m.repMove },
      sides: [0, 1].map(p => Object.fromEntries(DICE.map(k => [k, m.sides(p, k)]))),
      wrong: [0, 1].map(p => m.metrics.killingBlowAttempts.filter(k => k.player === p).map(k => k.named)),
      knowsWeak: m.buff[0] && m.buff[0].last ? P[1].weak : null,
      kbReady: [...(m.kbReady || [false, false])],      // who may try a Killing Blow chain this round
    };
  }

  const nameOf = p => {
    const k = G.chars[p], n = CHARACTERS[k].name;
    return G.chars[0] === G.chars[1] ? `${n} (${p === 0 ? 'you' : 'computer'})` : n;
  };
  // the engine says "Player 1" / "Player 2"; the screen says the characters' names
  const tell = t => t.replace(/Player 1/g, nameOf(0)).replace(/Player 2/g, nameOf(1));

  async function startMatch(mine, theirs) {
    await Promise.all([loadArt(mine), loadArt(theirs)]);
    const bots = makeBots(64, Math.random), bot = bots[Math.floor(Math.random() * bots.length)];
    G = { chars: [mine, theirs], bot, events: [], log: [], mode: 'duel', picks: [], extra: null, lastMoves: [null, null], token: {}, formNow: [null, null] };
    const token = G.token;
    G.match = new ArenaMatch({ ask, maxRounds: 60, characters: [mine, theirs] });
    buildArena();
    one('#log').innerHTML = '';
    const result = await G.match.run().catch(e => { console.error(e); return { winner: null, endReason: 'error: ' + e.message }; });
    if (G.token !== token) return;     // a new match was started meanwhile
    await beat();
    await playEvents();
    if (G.token !== token || !one('#arena')) return;
    showEnd(result);
  }

  /* ---------------- answering the engine ---------------- */
  async function ask(p, d) {
    const token = G.token;
    if (p === 1) {                                   // the computer: a tournament bot
      const tries = botAnswer(G.bot, G.match, 1, d, Math.random);
      for (const t of tries) { const r = d.parse(t); if (r.ok) { if (d.kind === 'duel' && r.value.type === 'move') G.lastMoves[1] = r.value.key; return { ...r, action: t }; } }
      for (const t of d.legal) { const r = d.parse(t.split(/\s{2,}|\s+\(/)[0]); if (r.ok) return { ...r, action: t }; }
      throw new Error(`the computer had no legal answer for ${d.kind}`);
    }
    await beat();
    await playEvents();
    if (G.token !== token) return new Promise(() => {});     // abandoned match: never answer
    return decide(d);
  }

  /* ---------------- playing back what happened ---------------- */
  function modeForText(t) {
    if (/Killing Blow|names (Head|Heart|Throat)/.test(t)) return 'kb';
    if (/charges: d|attacks, spending|banks the full pool|chaining breaks|rerolls \d|keeps all: d|pool can hold|'s d\d+ now/.test(t)) return 'charge';
    if (/chain|Spell|poisons|Joker set|JOKER/.test(t)) return 'chain';
    return 'duel';
  }
  // One beat per round: only the big moments (the duel result, a chain, a spell, an attack, a Killing Blow, the end) get a scene;
  // small events (draws, swaps, discards, rolls, counts) just update the screen and the log, with no pause.
  const MAJOR = /played \w+, Player \d played|both played|plays a new chain|adds .* to chain|Spell|attacks, spending|banks the full pool|chaining breaks|is complete|Killing Blow|names (Head|Heart|Throat)|wins the match|ran out|draw by repetition|Gunner charge|unlocks the|takes (his|her) (WINGED|DEMONIC)|Cavalryman:|lets it land|can't stop it|stops the chaining/;
  async function playEvents() {
    while (G.events.length) {
      if (!one('#arena')) { G.events.length = 0; return; }      // the match was left (New match): nothing to show
      const e = G.events.shift(), prev = G.view;
      const text = tell(e.raw), major = MAJOR.test(e.raw);
      const fm = e.raw.match(FORM_EVT); if (fm) G.formNow[fm[1] - 1] = fm[2].toLowerCase();      // the form on screen changes with its own sentence
      noteChain(e.raw);
      // a Killing Blow guess: the scene shows the result first; only then do the log, the bars and the text below tell it
      const kb = !G.skip && !G.kbHurry && speed > 0 && e.raw.match(/^Player (\d) names (\w+): (it is|wrong)/);
      if (kb) {
        await kbReveal(kb[1] - 1, kb[2], kb[3] !== 'wrong', e.snap, () => { addLog(text); setMode('kb'); G.view = e.snap; renderWatching(text); });
        continue;
      }
      addLog(text);
      const modeWas = G.mode;
      if ((major || ROLLS.test(e.raw)) && !fm) setMode(modeForText(e.raw));      // (a change of form keeps the screen as it is)
      G.view = e.snap;
      renderWatching(text);
      try { eventSounds(e.raw, prev, e.snap, major, modeWas !== G.mode && modeWas !== 'kb' && G.mode !== 'kb'); } catch (err) { /* a sound never stops the game */ }      // (into and out of the Killing Blow: its own sounds lead)
      if (major) await animate(e.raw, prev, e.snap);
      else {
        quickPops(prev, e.snap);
        const ms = rollScene(e.raw, prev, e.snap, G.skip ? 0 : speed);      // a charge die, escape dice, a reroll: a short roll you can see
        if (ms) await sleep(ms); else await tick();
      }
    }
  }
  function quickPops(prev, now) {
    if (!prev) return;
    [0, 1].forEach(p => BAR.forEach(b => { const dlt = now.bars[p][b] - prev.bars[p][b]; if (dlt) popAt(p, (dlt > 0 ? '+' : '') + dlt + ' ' + BAR_NAME[b], dlt > 0); }));
  }
  async function animate(raw, prev, now) {
    const t = G.skip ? 0 : speed;
    const F = G.fighters;
    const pops = () => { if (!prev) return; [0, 1].forEach(p => BAR.forEach(b => { const dlt = now.bars[p][b] - prev.bars[p][b]; if (dlt) popAt(p, (dlt > 0 ? '+' : '') + dlt + ' ' + BAR_NAME[b], dlt > 0); })); };
    let m = raw.match(/^Player 1 played (\w+), Player 2 played (\w+)\. Player (\d) wins/);
    if (m) {
      const w = Number(m[3]) - 1, l = 1 - w, mv = w === 0 ? m[1] : m[2];
      revealMoves(m[1], m[2]);
      const dm = raw.match(/: dice ([\d+]+) = (\d+) damage/);          // the winner's damage dice land just before the hit
      if (dm) showRoll(w, sidesIn(prev, now, w, 'duel'), dm[1].split('+').map(Number), { t, land: mv === 'Block' ? 760 : 300, hold: 1000, total: true, sfxDelay: 120 });
      const hitBy = mv === 'Block' ? F[w].pose('blocking', 700 * t).then(() => F[w].pose('attacking', 800 * t)) : F[w].pose('attacking', 1000 * t);
      await sleep((mv === 'Block' ? 900 : 360) * t);
      F[l].pose('hurt', 600 * t); renderGauges(); pops();
      await hitBy; await sleep(250 * t); return;
    }
    m = raw.match(/^Player 1 and Player 2 both played (\w+)/);
    if (m) {
      revealMoves(m[1], m[1]);
      const a = m[1] === 'Block' ? 'blocking' : 'attacking';
      await Promise.all([F[0].pose(a, 800 * t), F[1].pose(a, 800 * t)]);
      renderGauges(); pops(); await sleep(400 * t); return;
    }
    m = raw.match(/^Player (\d) attacks, spending/);
    if (m) {
      const a = Number(m[1]) - 1;
      const go = F[a].pose('attacking', 1000 * t); await sleep(360 * t);
      F[1 - a].pose('hurt', 600 * t); renderGauges(); pops(); await go; return;
    }
    m = raw.match(/^Player (\d)'s Killing Blow chain landed/);
    if (m) { renderGauges(); if (t > 0) await kbIntro(m[1] - 1); return; }
    if (/the chaining breaks/.test(raw)) { renderGauges(); pops(); await breakScene(raw, prev, now, t); return; }
    if (/stops the chaining/.test(raw)) { renderGauges(); pops(); if (!(await stopScene(raw, prev, now, t))) await sleep(550 * t); return; }
    m = raw.match(FORM_EVT);
    if (m) {
      renderGauges(); pops();
      const next = G.events[0] && G.events[0].raw.match(FORM_EVT);      // two forms in one hit: the first one passes quickly
      await formScene(m[1] - 1, m[2].toLowerCase(), now, t, !!(next && next[1] === m[1])); return;
    }
    renderGauges();
    rollScene(raw, prev, now, t);
    if (prev) {
      [0, 1].forEach(p => { if (BAR.some(b => now.bars[p][b] < prev.bars[p][b])) F[p].pose('hurt', 600 * t); });
      pops();
    }
    await sleep((/plays a new chain|adds .* to chain|Spell|Killing Blow|wins the match|names/.test(raw) ? 1000 : 550) * t);
  }
  /* ---------------- the Killing Blow scene ---------------- */
  // A landed Killing Blow chain: the screen goes dark, the two fighters come in, the attacker steps up to the face-down
  // weak-point card (kbIntro). Once a weak point is named the card turns over (kbReveal): right ends the match, wrong and the
  // defender survives. Every word and number comes from the engine's own sentences. A click hurries the scene along.
  const kbArt = (k, action, form) => { const a = ART[k] || {}, src = (a[action] && a[action][0]) || (a.standing && a.standing[0]); return src ? `<img src="${src}" alt="">` : `<canvas width="40" height="48" data-ph="${k}" data-form="${form || ''}"></canvas>`; };
  function kbDraw(el, p, action) {
    const box = one(`.kbfig.p${p} .kbmove`, el); if (!box) return;
    box.innerHTML = kbArt(G.chars[p], action, G.formNow[p]);
    all('canvas[data-ph]', box).forEach(cv => drawPlaceholder(cv, cv.dataset.ph, cv.dataset.form));
  }
  function kbOpen(att, held) {
    const arena = one('#arena'); if (!arena) return null;
    all('.kbscene', arena).forEach(x => x.remove());
    const def = 1 - att, el = document.createElement('div');
    el.className = `kbscene${held ? ' held snap s1 s2 s3' : ''}`; el.setAttribute('role', 'status');
    el.style.setProperty('--t', speed);
    el.innerHTML = `<i class="kbrays"></i><i class="kbar top"></i><i class="kbar bot"><span>Click to skip</span></i>
      ${[0, 1].map(p => `<div class="kbfig p${p} ${p ? 'r' : 'l'} ${p === att ? 'att' : 'def'}"><div class="kbmove"></div><span class="kbname">${esc(nameOf(p))}${p === att ? '' : ' · Last 0'}</span></div>`).join('')}
      <div class="kbtitle"><b>Killing Blow</b><span class="kbsub">${esc(nameOf(att))} strikes at ${esc(nameOf(def))}’s weak point</span></div>
      <div class="kbcard"><div class="kbflip"><span class="kbback"></span><span class="kbfront"><b></b><small></small></span></div></div>
      <span class="kblabel">${esc(nameOf(def))}’s weak point</span><i class="kbflash"></i>`;
    el.onclick = () => { el._hurry = true; G.kbHurry = true; sfxStop('kb-scene'); };
    arena.appendChild(el);
    [0, 1].forEach(p => kbDraw(el, p, 'standing'));
    if (held) { void el.offsetWidth; el.classList.remove('snap'); }       // already in place: no walking in again
    return (G.kbScene = el);
  }
  // a pause inside the scene: Speed fast shortens it; Skip, a click on the scene or a new match end it at once
  async function kbWait(el, ms) {
    const end = performance.now() + ms * speed;
    while (performance.now() < end && !el._hurry && !G.skip && speed > 0 && el.isConnected) await sleep(Math.min(50, end - performance.now()));
  }
  async function kbClose(el) {
    if (G.kbScene === el) G.kbScene = null;
    if (!el.isConnected) return;
    el.classList.add('out');
    if (!el._hurry && !G.skip && speed > 0) await sleep(220 * speed);
    el.remove();
  }
  async function kbIntro(att) {
    G.kbHurry = false;
    const el = kbOpen(att); if (!el) return;
    cue('kb-scene', 0, true);                                 // heartbeats while the fighters come in, then the slam
    await kbWait(el, 250); el.classList.add('s1');            // the fighters come in
    await kbWait(el, 450); el.classList.add('s2');            // the title lands
    await kbWait(el, 650); el.classList.add('s3');            // the attacker steps up; the weak-point card drops, face down
    await kbWait(el, 1050);
    if (att === 0 || el._hurry || !el.isConnected) await kbClose(el);       // your Killing Blow: the screen comes back so you can name the weak point
  }
  async function kbReveal(att, named, hit, snap, apply) {
    const def = 1 - att;
    let el = G.kbScene && G.kbScene.isConnected && !G.kbScene._hurry ? G.kbScene : null;
    if (!el) el = kbOpen(att, true);
    if (!el) { apply(); return; }
    one('.kbsub', el).textContent = `${nameOf(att)} names…`;
    one('.kbfront b', el).textContent = named;
    one('.kbfront small', el).textContent = hit ? 'weak point!' : 'not this one';
    el.classList.add('s3', 's4');                              // a beat of suspense: the card trembles
    await kbWait(el, 850);
    one('.kbtitle b', el).textContent = hit ? `${named}!` : 'Wrong!';
    one('.kbsub', el).textContent = hit ? `It is ${nameOf(def)}’s weak point: ${nameOf(att)} wins the match`
      : `Not the ${named}. ${nameOf(def)} survives: Last restarts at ${snap.bars[def].last}`;
    if (hit) { kbDraw(el, att, 'attacking'); kbDraw(el, def, 'hurt'); }
    one(`.kbfig.p${def} .kbname`, el).textContent = hit ? nameOf(def) : `${nameOf(def)} · Last ${snap.bars[def].last}`;
    el.classList.add('s5', hit ? 'hit' : 'miss');              // the card turns over
    if (!el._hurry && el.isConnected) cue('kb-flip');
    await kbWait(el, 380);
    apply();
    if (!G.skip) sfxStop('kb-scene');
    cue(hit ? 'kb-right' : 'kb-wrong', 0, true);
    await kbWait(el, 1500);
    await kbClose(el);
  }

  /* ---------------- dice you can see being rolled ---------------- */
  // Every value shown comes from the engine's own sentence; the faces that flash by while a die tumbles are only for show.

  function setMode(mode) {

  // the special rules in play for one player, as short badges under their bars

  function meter(v, p, i) {
    const b = BAR[i], val = v.bars[p][b], max = v.max[p][b], pct = max ? Math.min(100, val / max * 100) : 0;

  const ico = (art, name, tip, right) => `<span class="ico${right ? ' right' : ''}" tabindex="0" role="img" aria-label="${esc(name)}">${pic(art, 2)}<span class="tip"><b>${esc(name)}</b>${tip}</span></span>`;
  function renderGauges() {

  }

  // The table, always on screen at the top of the stage: each player's chains above their fighter, and the opponent's hand

  function tableHtml(v, p) {

  }
  // the opponent's hand: a fan of face-down cards (at most 9 drawn, squeezed to fit) and the number, beside their fighter
  function oppHandHtml(v) {

    const fan = shown ? Array.from({ length: shown }, (_, i) => `<span class="card s back"${i ? ` style="margin-left:${step - 30}px"` : ''}></span>`).join('') : '<span class="card s nocard"></span>';

  function setPrompt(title, say) {
    one('#prompt b').textContent = title; one('#prompt span').textContent = say;
    one('#prompt').classList.remove('glow', 'kb'); one('#dHand').classList.remove('glow', 'kb');

  }
  // the "What happened" list shows only whole sentences: the oldest ones are dropped until the rest fits its box
  function fitFeed() {
    const p = one('#dInfo'), f = p && one('.feed', p); if (!f) return;
    const room = parseFloat(p.style.height) || p.clientHeight;

    for (let s = 16; s >= 13 && over(); s--) f.firstElementChild.style.fontSize = s + 'px';      // one very long sentence: smaller letters
  }
  // many cards or dice: squeeze them so they stay on one line, inside their box
  function fitDock() {

      const kids = all('.card', c), n = kids.length;
      c.classList.remove('tight'); c.style.zoom = '';

      const fits = () => r.offsetHeight < dice[0].offsetHeight + 24 && last.offsetTop + last.offsetHeight + 12 <= room;      // one line, and nothing pushed out of the box

  }
  function renderWatching(text) {
    renderGauges();
    one('#turn').style.display = 'none';

    one('#dInfo').innerHTML = `<h4>What happened</h4><div class="feed">${G.log.slice(-4).reverse().map(l => `<p>${esc(l)}</p>`).join('')}</div>`;
    fitFeed();

    fitDock();
    if (!one('#skip')) one('#dAct').innerHTML = G.view.over ? '' : `<button type="button" class="btn mid" id="skip"><b>Skip ▸▸</b><small>Jump to your next decision</small></button>`;
  }

  /* ---------------- your decisions ---------------- */
  let pending = null;      // { d, resolve, render }
  function decide(d) {
    return new Promise(resolve => {
      G.view = snapshot(G.match); G.picks = []; G.extra = null; G.error = ''; G.skip = false; G.kbHurry = false;
      pending = { d, resolve };
      const modeWas = G.mode;
      render();
      // the sounds of a new decision: the moment track if it moved, then "your turn" (or the Chain ready / Killing Blow ready alert)
      let wait = Math.min(900, Math.max(0, (G.minorAt || 0) - performance.now(), (G.cueEnd || 0) + 150 - performance.now()));      // after the sounds of what just happened
      if (modeWas !== G.mode) { sfx('stage-change', { delay: wait, gap: 450 }); wait += 200; }

    });
  }
  function submit(action) {

    if (!r.ok) { G.error = r.error; sfx('error'); render(); return; }
    const { d, resolve } = pending; pending = null;
    sfxStop('your-turn');
    if (d.kind === 'setup-weak') sfx('weak-point');
    else if (d.kind === 'duel' && r.value.type === 'move') { sfx('lock-in'); G.beat = performance.now() + 220 * speed; }      // then the reveal, a beat later
    else if (!(['killing-blow', 'replay', 'reroll'].includes(d.kind) || action === 'keep all') || action === 'replay' || action === 'reroll') quietClick();      // what it does is heard at once
    if (d.kind === 'duel' && r.value.type === 'move') G.lastMoves[0] = r.value.key;
    if (d.kind === 'keep') G.kept = r.value;

  }
  function onClick(e) {
    if (e.target.closest('#skip')) { const sk = e.target.closest('#skip'); if (!sk.classList.contains('off')) { G.skip = true; sfxStop(); sfx('button'); sk.classList.add('off'); } return; }      // the skipped events stay silent
    const t = e.target.closest('[data-pick],[data-act],[data-chainpick]');
    if (!t || !pending) return;

    if (t.dataset.act !== undefined) {
      if (t.classList.contains('off')) { sfx(pending.d.kind === 'duel' && G.view.frozen[0][t.dataset.act] > 0 ? 'frozen-click' : 'error'); return; }
      submit(t.dataset.act); return;

  }
  const btn = (act, title, sub, o = {}) => `<button type="button" class="btn ${o.cls || ''}${o.icon ? ' icon' : ''}${o.off ? ' off' : ''}" data-act="${esc(act)}"${o.off ? ' aria-disabled="true"' : ''}>${o.icon ? pic(o.icon, 3) : ''}<b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</button>`;
  const more = (label, lines) => `<details class="more"><summary>${label}</summary><div class="body">${lines.map(l => `<p>${l}</p>`).join('')}</div></details>`;
  // o.chain (from chainHints): cards that can go into a chain are gold, the suggested ones pulse, the rest are dimmed
  const handHtml = (v, o = {}) => `<div class="cards">${v.hand.map((n, i) => card(n, { pick: o.pickable ? i : undefined, sel: G.picks.includes(i), selTag: o.selTag,
    cls: o.chain ? (o.chain.usable.has(i) ? 'can' + (!G.picks.length && o.chain.suggest.includes(i) ? ' best' : '') : 'cant') : '' })).join('') || '<span class="dim">empty</span>'}</div>`;
  const defendSize = d => Number((d.prompt.match(/discarding exactly (\d+) cards/) || [])[1] || 0);

  function render() {
    if (!pending) return;

    renderGauges();
    const turn = one('#turn'); turn.style.display = ''; turn.textContent = '▼ Your turn'; turn.classList.remove('chain');
    const info = one('#dInfo'), hand = one('#dHand'), act = one('#dAct');
    const err = G.error ? `<p class="err">${esc(G.error)}</p>` : '';
    const theirName = esc(nameOf(them));

    switch (d.kind) {

        break;
      }
      case 'setup-discard':

        info.innerHTML = setup ? `<h4>Mulligan</h4><p>Every player must swap one card at the start.</p><p class="dim">Deck: ${plural(v.deck[me], 'card')}.</p>` : `<h4>What happened</h4><div class="feed">${G.log.slice(-3).reverse().map(l => `<p>${esc(l)}</p>`).join('')}</div>`;
        fitFeed();
        hand.innerHTML = `<h4>Your hand: pick 1 to discard</h4>${handHtml(v, { pickable: true })}`;
        act.innerHTML = btn(G.picks.length ? `discard ${G.picks[0] + 1}` : 'discard 0', 'Discard and draw', G.picks.length ? `Discard the ${cardStr(v.hand[G.picks[0]])}, draw 1` : 'Pick a card first', { cls: 'main mid', off: !G.picks.length }) + err;
