        const kb = !!d.kb && canChain, kbNoChain = !canChain && /you have no chain to play this round/.test(d.prompt), danger = v.kbReady[them] && v.bars[me].last === 0;
        setPrompt(kb ? '★ Killing Blow ready ★' : canChain ? '★ Chain ready' : 'Your move',
          kb ? 'Their Last is 0: land a chain to strike. Press “Killing Blow chain” or click the gold cards, or pick a move.'
            : canChain ? 'Their Break is 0. Press “Play a chain” or click the gold cards yourself — or pick Basic, Heavy or Block.'
            : kbNoChain ? 'Killing Blow chance: their Last is 0, but you have no chain to play this round. Pick Basic, Heavy or Block.'
            : danger ? `Careful: ${nameOf(them)} can play a Killing Blow chain. Keep cards to stop it. Pick Basic, Heavy or Block.` : 'Pick Basic, Heavy or Block.');
        one('#prompt').classList.toggle('glow', canChain); hand.classList.toggle('glow', canChain);
        one('#prompt').classList.toggle('kb', kb); hand.classList.toggle('kb', kb);
        // a chain is possible: say so loudly. The sign shows once per decision; the gold cards and the big button stay until you answer.
        const hints = canChain ? (pending.hints || (pending.hints = chainHints())) : null;
        if (canChain) {
          turn.textContent = kb ? '★ Killing Blow ready!' : '★ Chain ready!'; turn.classList.add('chain'); turn.classList.toggle('kb', kb);
          if (!pending.signed) { pending.signed = true; chainSign(kb); }
        }
        const opp = v.bars[them];
        const nCh = [me, them].map(p => v.chains[p].length);
        info.innerHTML = `<h4>Round ${v.round}</h4><p>${theirName} holds ${plural(v.oppHand, 'card')}.</p>`
          // one short Killing Blow note at most (it takes the place of the chain count, which the table above already shows)
          + (kb ? `<p class="kbnote">★ If your chain lands: you name their weak point</p>`
            : danger ? `<p class="kbnote bad">⚠ Killing Blow danger: keep cards to stop a chain</p>`
            : kbNoChain ? `<p class="kbnote soft">Killing Blow chance, but no chain this round</p>`
            : `<p class="dim">${nCh[0] + nCh[1] ? `Chains: yours ${nCh[0]}, theirs ${nCh[1]} (above the fighters).` : 'No chains on the table yet.'}</p>`)
          + (v.rep.count ? `<p class="dim">Same move ${v.rep.count} of ${SETTINGS.repetitionDraw} rounds in a row (${MOVE_NAME[v.rep.move]}): at ${SETTINGS.repetitionDraw} it is a draw.</p>` : '')
          + more('Rules reminder', ['Basic beats Heavy, Heavy beats Block, Block beats Basic. The winner hits the loser’s current bar.',
            kb ? 'Their Last is 0: a chain you play now (new from your hand, or added to one of yours) is a Killing Blow chain. They can stop it by discarding as many cards. If it lands there is no Charge: you name their weak point.'
              : canChain ? 'Their Break is 0: you can play a chain (three or more cards of one number, or in a row) instead of a move.'
              : `You can start a chain only when their Break is 0 (now ${opp.break})${opp.shield === 0 ? ' and their Shield is still up' : ''}.`,
            'Killing Blow: from the round after a Last bar reaches 0, and while it stays at 0, the other player may play a chain instead of a move. If it lands, they name one weak point; the right one wins.']);
        hand.innerHTML = `<h4>${kb ? '★ Killing Blow: the gold cards can chain' : canChain ? '★ Chain ready: the gold cards can chain' : 'Your hand'}</h4>${handHtml(v, { pickable: canChain, selTag: 'chain', chain: hints })}${canChain ? err : ''}`;
        const legalKey = k => d.legal.some(l => l.startsWith(k + ' '));
        const why = k => {
          if (v.frozen[me][k] > 0 && !legalKey(k)) return `Frozen for ${plural(v.frozen[me][k], 'more round')}`;
          if (!legalKey(k)) return k === 'basic' ? 'Needs a card in your discard pile' : 'Needs a card in your hand';
          return null;
        };
        const fire = k => v.fire[me][k] ? `<span class="tag">Fire ×${v.fire[me][k]}</span>` : '';
        const sub = { basic: '1 die · then swap a card with your discard pile', heavy: '2 dice · then discard 1 and draw 1', block: `Beats Basic: hits 1 die${CHARACTERS[v.chars[me]].blockRegain ? `, heals ${CHARACTERS[v.chars[me]].blockRegain}` : ''} · draw 1` };
        const icon = { basic: 'sword', heavy: 'hammer', block: 'shield' };
        // with a chain ready the three moves become one-line buttons (same order, same place) so the chain buttons fit under them
        const short = { basic: '1 die · swap a card', heavy: '2 dice · discard 1, draw 1', block: `hits 1 die${CHARACTERS[v.chars[me]].blockRegain ? `, heals ${CHARACTERS[v.chars[me]].blockRegain}` : ''} · draw 1` };
        let chainBtns = '';
        if (canChain && G.picks.length) chainBtns = chainButtons(v);
        else if (canChain && hints.suggest.length) {
          const sg = hints.suggest, cs = sg.map(i => cardStr(v.hand[i])).join(' · ');
          const adds = sg.length < SETTINGS.chain.minLength;      // fewer cards than a new chain needs: they go onto a chain on the table
          chainBtns = `<button type="button" class="btn icon chaincta${kb ? ' kb' : ''}" data-chainpick="${sg.join(' ')}">${pic('star', 3)}<b>${kb ? 'Killing Blow chain' : 'Play a chain'}</b><small>${adds ? `Picks your ${cs} to add to a chain` : `Picks ${cs} from your hand`}</small></button>`;
        }
        const nBtns = (chainBtns.match(/<button/g) || []).length;
        act.innerHTML = MOVES.map((k, i) => btn(k, MOVE_NAME[k], (why(k) || (canChain ? short : sub)[k]) + fire(k), { icon: icon[k], off: !!why(k), cls: (i === 0 && !why(k) ? 'main' : '') + (canChain ? ' line' : '') })).join('')
          + (canChain ? `<div class="chainzone n${Math.min(nBtns, 5)}${kb ? ' kb' : ''}">${chainBtns}</div>` : err);
        break;
      }
      case 'defend': {
        setMode('chain');
        const n = defendSize(d), v1 = v.chains[them], ch = v1.find(c => c.chained === false && c.cards.length === n) || v1[v1.length - 1];
        const canStop = !d.legal[0].startsWith('land');
        const kb = !!d.kb, mine = v.weak, tried = v.wrong[them];
        const restart = Math.ceil(v.max[me].last * SETTINGS.killingBlow.restartFraction);
        setPrompt(kb ? '⚠ Killing Blow chain' : 'Your decision', kb ? `${nameOf(them)} played a Killing Blow chain of ${n}. Stop it (costs ${plural(n, 'card')}) or they name your weak point.` : `${nameOf(them)} played a chain of ${n}. Stop it or let it land.`);
        one('#prompt').classList.toggle('kb', kb); one('#prompt').classList.toggle('glow', kb);
        info.innerHTML = `<h4>${kb ? 'Killing Blow chain' : 'Chain played'}: ${ch ? (ch.kind === 'joker' ? 'Joker set' : ch.kind === 'run' ? 'run' : 'set') + ' of ' + n : n + ' cards'}</h4>`
          + `<div class="row">${ch ? ch.cards.map(c => card(c, { size: 's' })).join('') : ''}${kb ? '' : '</div><div class="row">'}${chainEffects(v, them, ch, n).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>`
          + (kb ? `<p class="kbnote bad">⚠ No Charge if it lands: they name a weak point (yours: ${esc(mine || '?')}).</p>` : '')
          + more('What this means', (kb ? [`Stop it: discard exactly ${n} cards. The chain stays on the table, and they may try again next round while your Last is 0.`, `Let it land: you keep your cards. No Charge: they name one weak point. If it is yours, you lose the match. If they miss, your Last restarts at ${restart}.${tried.length ? ` They already missed with ${tried.join(', ')}.` : ''}`]
            : ['Stop it: discard exactly ' + n + ' cards. The chain stays on the table.', 'Let it land: keep your cards; a Charge starts: they roll d8s, you roll ' + n + ' escape dice.']).concat(CHARACTERS[v.chars[them]].spells ? ['Her spell goes off either way, once you decide.'] : []));
        hand.innerHTML = `<h4>Your hand${canStop ? `: pick ${n} to discard` : ' (too few cards to stop it)'}</h4>${handHtml(v, { pickable: canStop })}`;
        act.innerHTML = (canStop ? btn(G.picks.length === n ? `stop ${G.picks.map(i => i + 1).join(' ')}` : 'stop', 'Stop it', G.picks.length === n ? `Discard the ${n} picked cards` : kb ? `Costs ${n} cards: pick them (${G.picks.length} picked)` : `Pick ${n} cards (${G.picks.length} picked)`, { cls: 'main mid', off: G.picks.length !== n }) : '')
          + btn('land', 'Let it land', kb ? (canStop ? 'No Charge: they name your weak point' : 'You can’t stop it: they name your weak point') : 'Keep your cards, a Charge starts', { cls: 'mid' + (kb ? ' danger' : '') }) + err;
        break;
      }
      case 'keep': {
        setMode('charge');
        const m = d.prompt.match(/rolled d(\d+): ((?:\d+:\d+\s*)+)/), sides = m ? m[1] : 4;
        const dice = m ? m[2].trim().split(/\s+/).map(x => Number(x.split(':')[1])) : [];
        const pool = v.d8[them], total = sumOf(pool);
        setPrompt('Your roll', 'Keep the dice you like, then reroll the rest once. If they all match, you break free.');
        info.innerHTML = `<h4>${theirName}’s d${CHARACTERS[v.chars[them]].dice?.attack || 8} pool</h4><div class="row">${pool.map(x => die(x, { cls: 'd8' })).join('')}<b class="total">Total ${total}</b></div>`
          + more('Charge rules', ['If all your escape dice match, the chaining breaks.', 'If not, they may attack: their total minus your highest die hits your Shield.']);
        const hi = Math.max(...dice);
        hand.innerHTML = `<h4>Your d${sides}s: click to keep</h4><div class="row">${dice.map((x, i) => die(x, { pick: i, cls: G.picks.includes(i) ? 'keep' : '' })).join('')}</div><p class="note2"><b>If they attack now:</b> ${total} − ${hi} = ${Math.max(0, total - hi)} damage to your Shield (${v.bars[me].shield} → ${Math.max(0, v.bars[me].shield - Math.max(0, total - hi))})</p>`;
        const keep = G.picks.length ? `keep ${G.picks.map(i => i + 1).join(' ')}` : 'keep none';
        act.innerHTML = btn(keep, G.picks.length ? 'Reroll the rest' : 'Reroll all', G.picks.length ? `Keep ${G.picks.map(i => dice[i]).join(', ')}, reroll ${dice.length - G.picks.length}` : 'Keep none', { cls: 'main mid', off: G.picks.length === dice.length })
          + btn('keep all', 'Keep all', 'Keep all as rolled', { cls: 'mid' }) + err;
        break;
      }
      case 'charge': {
        setMode('charge');
        const m = d.prompt.match(/'s d(\d+): ([\d, ]+) \(highest (\d+)\)/), pm = d.prompt.match(/\((\d+) of at most (\d+) dice\)/);
        const dice = m ? m[2].split(',').map(Number) : [], hi = m ? Number(m[3]) : 0, pool = v.d8[me], total = sumOf(pool), dmg = Math.max(0, total - hi);
        const full = !d.legal.includes('charge'), bank = d.legal.includes('bank');      // the Demon may bank a full pool (rules 1.39)
        setPrompt('Your charge', bank ? 'Your pool is full: attack, or bank it for your next Charge.' : full ? 'Your pool is full: attack.' : 'Attack now, or charge again for a bigger pool.');
        info.innerHTML = `<h4>Your pool</h4><div class="row">${pool.map(x => die(x, { cls: 'd8' })).join('')}<b class="total">Total ${total}</b></div><p class="dim">${pm ? `${pm[1]} of at most ${pm[2]} dice` : ''}</p>`
          + more('Charge rules', ['Attack: your total minus their highest die hits their Shield, and every die is spent.', 'Charge again: you roll one more die; they roll fresh escape dice, and if all of them match, the chaining breaks (you keep your pool).'].concat(bank ? ['Bank (Demon, full pool only): the Charge ends with no attack. You keep your dice for your next Charge; their Break refills.'] : []));
        hand.innerHTML = `<h4>${theirName}’s escape dice</h4><div class="row">${dice.map(x => die(x)).join('')}</div><p class="note2"><b>Attack now:</b> ${total} − ${hi} = ${dmg} damage to their Shield (${v.bars[them].shield} → ${Math.max(0, v.bars[them].shield - dmg)})</p>`;
        act.innerHTML = btn('attack', 'Attack', `${dmg} damage to their Shield`, { cls: 'main mid' }) + (full ? '' : btn('charge', 'Charge again', 'Roll one more die', { cls: 'mid' }))
          + (bank ? btn('bank', 'Bank', 'Keep your dice for your next Charge; their Break refills', { cls: 'mid' }) : '') + err;
        break;
      }
      case 'killing-blow': {
        setMode('kb');
        const W = CHARACTERS[v.chars[them]].weakPoints, wrong = v.wrong[me];
        setPrompt('Your Killing Blow', `Your chain landed. Name ${nameOf(them)}’s weak point to win.`);
        const restart = Math.ceil(v.max[them].last * SETTINGS.killingBlow.restartFraction);
        info.innerHTML = `<h4>Wrong guesses</h4><p class="big">${wrong.length ? esc(wrong.join(', ')) : 'none yet'}</p>`
          + more('What happens', ['Right: you win the match.', `Wrong: their Last bar restarts at ${restart}; their Break and Shield stay, and their weak point stays the same.`, 'To try again you must empty their Last and land another chain.']);
        hand.innerHTML = `<h4>Their weak point</h4><div class="row" style="gap:14px">${card('back', { size: 'l' })}<p>${v.knowsWeak ? `Your Last buff: it is <b>${esc(v.knowsWeak)}</b>.` : 'One card, face down.'}</p></div>`;
        act.innerHTML = `<div class="row nowrap">${W.map(w => btn(`name ${w.toLowerCase()}`, w, wrong.includes(w) ? 'Wrong already' : '', { cls: (wrong.includes(w) ? 'dull' : v.knowsWeak === w ? 'main' : '') + ' mid' })).join('')}</div>` + err;
        break;
      }
      case 'freeze':
      case 'fire': {
        setMode('chain');
        const fz = d.kind === 'freeze';
        const rounds = (d.prompt.match(/next (\d) duel round/) || [])[1], stacks = (d.prompt.match(/puts (\d+) fire stack/) || [])[1];
        setPrompt(fz ? 'Spell: Freeze' : 'Spell: Fire', fz ? `Pick one of ${theirName}’s moves to freeze for ${plural(Number(rounds), 'round')}.` : `Pick one of ${theirName}’s moves to put ${plural(Number(stacks), 'fire stack')} on.`);
        info.innerHTML = `<h4>${fz ? 'Freeze' : 'Fire'}</h4><p>${fz ? 'They can’t use that move for their next ' + plural(Number(rounds), 'duel round') + '.' : 'Every duel round they pick that move, they take damage equal to its stacks. Stacks never go away.'}</p>`;
        hand.innerHTML = `<h4>Their last move</h4><p class="big">${G.lastMoves[them] ? MOVE_NAME[G.lastMoves[them]] : '—'}</p>`;
        act.innerHTML = MOVES.map((k, i) => btn(`${d.kind} ${k}`, MOVE_NAME[k], fz ? (v.frozen[them][k] ? `Already frozen (${v.frozen[them][k]})` : '') : (v.fire[them][k] ? `Fire ×${v.fire[them][k]} now` : ''), { cls: (i ? '' : 'main') + ' compact' })).join('') + err;
        break;
      }
      case 'replay':
      case 'reroll': {
        const left = v.gCharges[me];
        setPrompt('Gunner charge', `${plural(left, 'charge')} left this match.`);
        const c = d.ctx || {}, coin = c.sides === 2;
        // a re-roll: the roll in question is drawn as dice (a d2 as coins), with its size
        if (d.kind === 'reroll' && c.rolls) info.innerHTML = `<h4>Gunner charge</h4><div class="row"><span class="tag dsize">${coin ? 'coin (d2)' : 'd' + c.sides}</span>${c.rolls.map(x => die(x, { cls: coin ? 'coin' : c.kind === 'charge die' ? 'd8' : '' })).join('')}</div>`
          + `<p>${c.own ? 'Your' : theirName + '’s'} ${c.kind === 'duel' ? 'duel damage' : c.kind === 'charge die' ? 'charge die' : 'escape dice'} roll.</p><p class="dim">Roll all of it again (once), or keep it.</p>`;
        else info.innerHTML = `<h4>Gunner charge</h4><p>${esc(tell(d.prompt.replace(/^GUNNER CHARGE \(\d+ left\): /, '')))}</p>`;
        hand.innerHTML = `<h4>Your hand</h4>${handHtml(v)}`;
        act.innerHTML = (d.kind === 'replay' ? btn('replay', 'Replay the round', 'Both pick again', { cls: 'main mid' }) : btn('reroll', 'Re-roll it', 'Roll the whole roll again', { cls: 'main mid' }))
          + btn('keep', 'Keep it', 'Save the charge', { cls: 'mid' }) + err;
        break;
      }
      default: {        // anything else the engine asks: one button per legal action
        setPrompt('Decide', d.prompt.slice(0, 140));
        info.innerHTML = `<h4>Decision</h4><p>${esc(tell(d.prompt))}</p>`;
        hand.innerHTML = `<h4>Your hand</h4>${handHtml(v)}`;
        act.innerHTML = d.legal.map(l => btn(l.split(/\s{2,}|\s+\(/)[0], esc(l.split(/\s{2,}|\s+\(/)[0]), '', { cls: 'mid compact' })).join('') + err;
      }
    }
    fitDock();
  }

  // what a chain will do, for the defend screen
  function chainEffects(v, att, ch, n) {
    const c = CHARACTERS[v.chars[att]], out = [], m = G.match;
    if (!ch) return out;
    if (c.spells) {
      if (ch.kind === 'run') out.push(`Spell: Fire ×${n - 2}`); else out.push(`Spell: Freeze ${plural(n >= 4 ? 2 : 1, 'round')}`);
      if (ch.complete) out.push('Completes: Power +1 d6');
    }
    if (ch.kind === 'joker') out.push(n >= c.jokerWin ? `${n} Jokers: if it lands, she wins` : `Joker set ${n} of ${c.jokerWin}`);
    if (c.poison) out.push(`Poison +${m.poisonFor(att, n)} (already added)`);
    if (ch.complete && !c.spells) out.push('Completes the chain');
    return out;
  }

  // Which hand cards can go into a chain right now (asked from the engine): usable = every card that is part of some legal play,
  // suggest = the play the engine itself would pick (the "Play a chain" button selects these cards).
  function chainHints() {
    const m = G.match, n = m.pl[0].hand.length, usable = new Set();
    const has = (idx, type) => m.chainOptions(0, idx).some(o => o.type === type), mark = idx => idx.forEach(i => usable.add(i));
    for (let a = 0; a < n; a++) {
      if (has([a], 'add')) mark([a]);
      for (let b = a + 1; b < n; b++) {
        if (has([a, b], 'add')) mark([a, b]);
        for (let c = b + 1; c < n; c++) if (has([a, b, c], 'new')) mark([a, b, c]);
      }
    }
    const suggest = m.findChainPlay(0) || [];
    mark(suggest);
    return { usable, suggest };
  }
  // the big sign across the stage, once when a decision with a possible chain starts
  function chainSign(kb) {
    const arena = one('#arena'); if (!arena) return;
    all('.chainsign', arena).forEach(x => x.remove());
    const el = document.createElement('div');
    el.className = 'chainsign' + (kb ? ' kb' : ''); el.setAttribute('role', 'status');
    el.innerHTML = kb ? `<b>${pic('star', 5)}Killing Blow ready!${pic('star', 5)}</b><span>${esc(nameOf(1))}’s Last is 0: land a chain and you name their weak point</span>`
      : `<b>${pic('star', 5)}Chain ready!${pic('star', 5)}</b><span>${esc(nameOf(1))}’s Break is 0: you can play a chain this round</span>`;
    arena.appendChild(el); setTimeout(() => el.remove(), 2300);
  }

  // the chain buttons for the cards you picked
  function chainButtons(v) {
    const m = G.match, idx = G.picks, cards = idx.map(i => v.hand[i]), pos = idx.map(i => i + 1).join(' '), out = [];
    const hasJ = cards.includes(0);
    const newSame = m.planChain(null, cards, 0, 'same') && hasJ, newRun = m.planChain(null, cards, 0, 'run') && hasJ;
    const opts = m.chainOptions(0, idx);
    if (opts.some(o => o.type === 'new')) {
      if (newSame && newRun) {
        out.push(btn(`chain new ${pos} set`, 'New chain: set', `${cards.map(cardStr).join(' ')} as one number`, { cls: 'go compact' }));
        out.push(btn(`chain new ${pos} run`, 'New chain: run', `${cards.map(cardStr).join(' ')} in a row`, { cls: 'go compact' }));
      } else out.push(btn(`chain new ${pos}`, 'Play new chain', cards.map(cardStr).join(' '), { cls: 'go compact' }));
    }
    opts.filter(o => o.type === 'add').forEach(o => out.push(btn(`chain add ${o.ci + 1} ${pos}`, `Add to chain #${o.ci + 1}`, `${v.chains[0][o.ci].cards.map(cardStr).join(' ')} + ${cards.map(cardStr).join(' ')}`, { cls: 'go compact' })));
    if (!out.length) out.push(btn('chain', 'Not a chain', cards.length < 3 && !v.chains[0].length ? 'A new chain needs 3 or more cards' : 'Same number or in a row', { cls: 'compact', off: true }));
    return out.join('');
  }

  /* ---------------- the end of the match ---------------- */
  function showEnd(r) {
    const v = G.view, w = r.winner;
    setMode('kb');
    renderGauges();
    one('#turn').style.display = 'none';
    const title = w === null ? 'No winner' : w === 0 ? 'You win!' : 'You lose';
    announce(w === null ? 'no-winner' : w === 0 ? 'win' : 'lose', { delay: Math.min(700, Math.max(sfxRinging(['kb-right', 'five-jokers', 'deck-out']) - 300, (G.minorAt || 0) - performance.now())) });      // after the last big sound, not on top of it
    setPrompt('Match over', `${title} — ${tell(r.endReason || '')}.`);
    const weak = G.match.pl.map(p => p.weak);
    if (w !== null) G.fighters[w].pose('attacking', 1000 * speed);
    if (w !== null) setTimeout(() => G.fighters[1 - w].pose('hurt', 700 * speed), 360 * speed);
    one('#dInfo').innerHTML = `<h4>Result</h4><p class="big">${title}</p><p>${esc(tell(r.endReason || ''))} after ${plural(r.rounds || v.round, 'round')}.</p>`;
    one('#dHand').innerHTML = `<h4>Weak points</h4><p>Yours: <b>${esc(weak[0] || '—')}</b>. ${esc(nameOf(1))}’s: <b>${esc(weak[1] || '—')}</b>.</p><p class="dim">The computer was ${esc(G.bot.name)}: ${esc(botStyle(G.bot))}.</p>`;
    one('#dAct').innerHTML = `<button type="button" class="btn main mid" id="again"><b>Rematch</b><small>Same characters</small></button><button type="button" class="btn mid" id="toSelect"><b>New match</b><small>Choose the characters</small></button>`;
    one('#again').onclick = () => startMatch(G.chars[0], G.chars[1]);
    one('#toSelect').onclick = () => showSelect();
  }
  function botStyle(b) {
    const mv = { balanced: 'balanced moves', basicHeavy: 'likes Basic', heavyHeavy: 'likes Heavy', blockHeavy: 'likes Block', noBlock: 'rarely Blocks', attackOnly: 'attacks a lot' }[b.moves];
    const st = { always: 'always stops chains', never: 'never stops chains', shortOnly: 'stops only short chains', half: 'stops chains half the time' }[b.stop];
    return `${mv}, builds ${b.chainStyle === 'long' ? 'long runs' : 'sets'}, ${st}, attacks at ${b.charge === 99 ? 'a full pool' : 'a total of ' + b.charge + '+'}`;
  }

  /* ---------------- choosing the characters ---------------- */
  const pickState = { mine: 'swordsman', theirs: 'mage' };
  const MAXBAR = Math.max(...ROSTER.flatMap(k => BAR.map(b => CHARACTERS[k].bars[b])));       // the longest bar of the roster: every gauge is drawn against it
  const MAXNUM = Math.max(...ROSTER.map(k => CHARACTERS[k].deck.maxNumber));
  const WEAK = [...new Set(ROSTER.flatMap(k => CHARACTERS[k].weakPoints))];
  const BAR_TIP = { break: 'The first bar to fall. While it is at 0, the opponent can play chains.', shield: 'Hit by charge attacks after a chain lands. At 0 the fight moves to the Last bar.', last: 'The final bar. While it is at 0, the opponent may play a chain as a Killing Blow: if it lands, they name a weak point, and the right one wins.' };
  const DIE_TIP = { duel: 'Rolled for damage when a duel move hits.', attack: 'Rolled into the pool in a Charge, after a chain lands.', defend: 'Rolled to break free when the opponent charges.' };
  // something to look at, with its full sentence on hover, focus or tap
  const hint = (cls, inner, name, text) => `<span class="hint ${cls}" tabindex="0">${inner}<span class="tip"><b>${esc(name)}</b>${esc(text)}</span></span>`;
  const artHtml = (k, form) => { const a = ART[k].standing[0]; return a ? `<img src="${a}" alt=""${form ? ` class="fa-${form}"` : ''}>` : `<canvas width="40" height="48" data-ph="${k}" data-form="${form || ''}"></canvas>`; };

  // one fighter's card: the art, three bars drawn to the same scale for everyone, the deck, the dice and the special powers as pictures
  function fighterCard(row) {
    const k = pickState[row], c = CHARACTERS[k], d = c.deck, he = HE(k), He = he[0].toUpperCase() + he.slice(1);
    const norm = diceFor('default'), start = diceFor(k, c.forms ? 'elegant' : null);
    const bars = BAR.map((b, i) => hint(`hbar k${i}`, `<span class="hn">${BAR_NAME[b]}</span><span class="segs">${Array.from({ length: MAXBAR }, (_, n) => `<i${n < c.bars[b] ? ' class="on"' : ''}></i>`).join('')}</span><b>${c.bars[b]}</b>`, `${BAR_NAME[b]} ${c.bars[b]}`, BAR_TIP[b])).join('');
    const strip = Array.from({ length: MAXNUM }, (_, n) => n + 1 >= d.minNumber && n + 1 <= d.maxNumber ? card(n + 1, { size: 'x' }) : '<span class="card x none"></span>').join('');
    const deck = hint('fdeck', `<span class="strip">${strip}</span><span class="times">×${d.copies}</span>${d.jokers ? `<span class="plus">+</span>${card(0, { size: 'x' })}<span class="times">×${d.jokers}</span>` : ''}<span class="tot"><b>${deckSize(d)}</b> cards</span>`,
      `Deck: ${plural(deckSize(d), 'card')}`, `Numbers ${d.minNumber} to ${d.maxNumber}, ${d.copies} of each${d.jokers ? `, plus ${plural(d.jokers, 'Joker')}` : ''}. A chain is complete at ${c.complete.same} of one number or the full run ${c.complete.runFrom}–${c.complete.runTo}. With no cards left, ${he} loses.`);
    const dice = DICE.map(kind => {
      const n = start[kind], usual = norm[kind], dir = n > usual ? 'up' : n < usual ? 'down' : '';
      return hint(`pdie ${dir}`, `<b>d${n}</b><small>${DIE_NAME[kind]}${dir ? `<i>${dir === 'up' ? '▲' : '▼'}</i>` : ''}</small>`, `${DIE_NAME[kind]} die: d${n}`, `${DIE_TIP[kind]} ${n === usual ? 'The normal size.' : `The normal size is d${usual}.`}${c.forms ? ' These are his starting dice (Elegant form).' : ''}`);
    }).join('');
    const block = hint('fstat', `${pic('shield', 3)}<b>+${c.blockRegain}</b><small>Block heal</small>`, `Block heals ${c.blockRegain}`, `A winning Block heals ${HIS(k)} current bar by ${c.blockRegain}, unless it is full.`);
    const weak = hint('fweak', `<span class="wp">${WEAK.map(w => `<i${c.weakPoints.includes(w) ? ' class="on"' : ''}>${esc(w)}</i>`).join('')}</span><small>Weak point</small>`, 'Weak point',
      c.weakPoints.length > 1 ? `${He} secretly picks one of ${c.weakPoints.join(', ')}. A Killing Blow must name it to win.` : `Always the ${c.weakPoints[0]}: a Killing Blow against ${HIM(k)} can’t miss.`);
    // the Demon's three forms: one row of steps, left to right, each with his figure in that form and the dice he rolls in it
    const formSteps = c.forms ? `<div class="formsteps">${powersFor(k).filter(p => p.form).map((p, i) => (i ? '<i class="farrow" aria-hidden="true">▶</i>' : '')
      + hint(`fstep ${p.form}`, `<span class="fsfig">${artHtml(k, p.form)}</span><span class="fstxt"><b>${i + 1}. ${esc(p.name)}</b><small>${FORMS[p.form].when}</small><em>${p.form === 'demonic' ? 'duel dice ×3' : diceDots(diceFor(k, p.form))}</em></span>`, `${p.name} form`, p.full.replace(/^\w+ form, /, '').replace(/^./, x => x.toUpperCase()))).join('')}</div>` : '';
    const powers = formSteps + powersFor(k).filter(p => !p.form).map(p => hint('power', `<span class="pico">${pic(p.art, 4)}</span><span class="ptxt"><b>${esc(p.name)}</b><small>${esc(p.short)}</small></span>`, p.name, p.full)).join('');
    return `<div class="panel fcard${row === 'theirs' ? ' right' : ''}">
      <div class="ftop"><div class="fart">${artHtml(k)}${ART[k].standing.length ? '' : '<span class="soon">art coming</span>'}</div>
        <div class="fid"><span class="fwho">${row === 'mine' ? 'You · Player 1' : 'Computer · Player 2'}</span><h3>${esc(c.name)}</h3><div class="hbars">${bars}</div></div></div>
      <div class="frow"><span class="fl">Deck</span>${deck}</div>
      <div class="frow"><span class="fl">Dice</span><span class="fdice">${dice}</span>${block}${weak}</div>
      <div class="frow top"><span class="fl">Powers</span><div class="powers">${powers}</div></div>
    </div>`;
  }

  async function showSelect() {
    if (G) { G.token = {}; G.skip = true; }           // stop any match in progress (and its sounds)
    pending = null; sfxStop();
    await Promise.all(ROSTER.map(loadArt));
    const frame = one('#frame');
    const tile = (row, k) => `<button type="button" class="tile${pickState[row] === k ? ' on' : ''}" data-row="${row}" data-key="${k}" aria-pressed="${pickState[row] === k}">
        <span class="art">${artHtml(k)}</span><span class="tname">${esc(CHARACTERS[k].name)}</span></button>`;
    frame.innerHTML = `<div class="scene on select">
      <div class="seltitle">Choose the fighters</div>
      ${['mine', 'theirs'].map((row, i) => `<div class="selcol" style="left:${20 + i * 634}px">
        <div class="selrow"><div class="rowhead"><span class="rowlabel${row === 'mine' ? '' : ' long'}">${row === 'mine' ? 'You' : 'Computer'}</span><button type="button" class="chip rand" data-rand="${row}">Random</button></div>
          <div class="tiles">${ROSTER.map(k => tile(row, k)).join('')}</div></div>
        ${fighterCard(row)}</div>`).join('')}
      <div class="selhint">${pic('rules', 2)}<span>Point at (or tap) any picture to read the full rule.</span></div>
      <button type="button" class="btn main mid" id="fight"><b>Fight!</b><small>You are Player 1</small></button>
      <button type="button" class="btn mid" id="spicy"><b>Random both</b><small>Feeling spicy</small></button>
    </div>`;
    all('canvas[data-ph]', frame).forEach(cv => drawPlaceholder(cv, cv.dataset.ph, cv.dataset.form));
    all('.tile', frame).forEach(t => t.onclick = () => { pickState[t.dataset.row] = t.dataset.key; showSelect(); sfx('pick-fighter'); });
    all('[data-rand]', frame).forEach(b => b.onclick = () => { pickState[b.dataset.rand] = ROSTER[Math.floor(Math.random() * ROSTER.length)]; showSelect(); sfx('random'); });
    one('#spicy').onclick = () => { pickState.mine = ROSTER[Math.floor(Math.random() * ROSTER.length)]; pickState.theirs = ROSTER[Math.floor(Math.random() * ROSTER.length)]; sfx('random-both'); startMatch(pickState.mine, pickState.theirs); };
    one('#fight').onclick = () => { announce('fight'); startMatch(pickState.mine, pickState.theirs); };
  }

  /* ---------------- page ---------------- */
  function fit() {
    const view = one('.viewport'), frame = one('#frame');
    const k = Math.min(1.25, (view.clientWidth - 8) / 1288, (window.innerHeight - 90) / 724);
    frame.style.transform = `scale(${k})`; view.style.height = (724 * k) + 'px'; frame.style.margin = `${4 * k}px`;
  }
  function start() {
    window.addEventListener('resize', fit); fit();
    one('#newMatch').onclick = () => showSelect();
    one('#frame').addEventListener('click', onClick);
    one('#speed').onclick = e => { speed = speed === 1 ? 0.45 : 1; e.currentTarget.textContent = `Speed: ${speed === 1 ? 'normal' : 'fast'}`; e.currentTarget.setAttribute('aria-pressed', String(speed !== 1)); };
    // Sound: on / off and a volume slider, next to Speed (remembered on this device)
    one('#speed').insertAdjacentHTML('afterend', `<button class="chip" id="sound" type="button"></button><label class="vol" id="volBox"><span>Volume</span><input type="range" id="volume" min="0" max="100" step="5" aria-label="Sound volume"></label>`);
    const sb = one('#sound'), vr = one('#volume');
    const showSound = () => { sb.textContent = `Sound: ${SND.on ? 'on' : 'off'}`; sb.setAttribute('aria-pressed', String(SND.on)); one('#volBox').classList.toggle('off', !SND.on); vr.value = SND.vol; vr.disabled = !SND.on; };
    sb.onclick = () => { SND.on = !SND.on; if (SND.on) { audioOn(); sfx('button'); } else sfxStop(); saveSound(); showSound(); };
    vr.oninput = () => { SND.vol = Math.max(0, Math.min(100, Number(vr.value) || 0)); try { if (SND.master) SND.master.gain.setTargetAtTime(volGain(), SND.ctx.currentTime, .02); } catch (e) { /* no audio */ } saveSound(); };
    vr.onchange = () => { audioOn(); sfx('button', { gap: 150 }); };      // a click at the new volume
    showSound();
    // every click: wake the audio; a button that made no sound of its own gets the plain button click
    document.addEventListener('click', () => { SND.click = { sounded: false }; audioOn(); }, true);
    document.addEventListener('click', e => {
      const c = SND.click, b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (c && !c.sounded && b && !b.disabled && !b.classList.contains('off')) sfx('button');
      SND.click = null;
    });
    showSelect();
  }
  // for checking in the browser console: ARENA.autoplay() lets a bot make your decisions too (a quick test of every screen)
  window.ARENA = {
    get game() { return G; }, get pending() { return pending; }, snapshot, submit, render,
    setSpeed(x) { speed = x; },
    // for checking the sounds: ARENA.sound.record() starts a list of every sound that starts (id, time), ARENA.sound.log reads it
    sound: { sfx, announce, stop: sfxStop, record(on = true) { SND.log = on ? [] : null; }, get log() { return SND.log; }, get on() { return SND.on; }, get volume() { return SND.vol; }, get ctx() { return SND.ctx; }, ids: HAVE_SFX ? Object.keys(SFX.SOUNDS) : [] },
    scenes: { breakScene, stopScene, formScene, showRoll },      // for checking a scene on its own
    async autoplay(maxSteps = 200000) {
      const me = makeBots(1, Math.random)[0], seen = {};
      for (let i = 0; i < maxSteps; i++) {
        await tick();
        if (!G || !G.match) continue;
        if (G.match.over || G.match.winner !== null) { if (!pending) { for (let k = 0; k < 20; k++) await tick(); if (!G.events.length) return { result: G.match.result().endReason, winner: G.match.winner, seen }; } }
        if (!pending) continue;
        const d = pending.d; seen[d.kind] = (seen[d.kind] || 0) + 1;
        const tries = botAnswer(me, G.match, 0, d, Math.random);
        const ok = tries.find(t => d.parse(t).ok);
        submit(ok || d.legal[0].split(/\s{2,}|\s+\(/)[0]);
      }
      return { unfinished: true, seen };
    },
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
